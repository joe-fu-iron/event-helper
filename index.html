<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 執行控台 - 最終整合版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // 【第一步】填入您的 Firebase 網址
        const FIREBASE_URL = "https://您的專案名稱-default-rtdb.firebaseio.com/";
        
        // 【核心設定】
        const menuItems = ["長官簽到表", "瓶水*{手動}", "餐盒*{手動}", "簽到箱", "紅桌巾", "TRUSS", "斜撐/鐵板", "木架/手板"];
        const teamList = ["江哥", "瑩驊", "志明", "露比", "鐵仁", "柏緯", "維憶", "芳瑜"]; // 已移除細漢
    </script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background: #f8fafc; color: #1e293b; -webkit-text-size-adjust: 100%; }
        body.admin-mode { background: #fffbeb; }
        
        /* 模式控管 */
        body.view-mode .admin-ui, body.view-mode .btn-del { display: none !important; }
        body.view-mode input, body.view-mode .edit-box, body.view-mode select { pointer-events: none; border: none !important; background: transparent !important; appearance: none; }

        .main-table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .main-table th, .main-table td { border: 1px solid #e2e8f0; padding: 12px 10px; }
        
        /* 手機卡片化優化 */
        @media (max-width: 768px) {
            .desktop-th { display: none; }
            .main-table tr { display: block; margin-bottom: 15px; border-radius: 12px; background: white; border: 1px solid #e2e8f0; position: relative; }
            .main-table td { display: flex; justify-content: space-between; align-items: center; border: none; border-bottom: 1px solid #f8fafc; padding: 12px; }
            .main-table td::before { content: attr(data-label); font-weight: 800; color: #94a3b8; font-size: 11px; }
            .unit-cell { font-size: 1.4rem !important; font-weight: 900; background: #f1f5f9; width: 100% !important; text-align: right; }
            .btn-del-pos { position: absolute; top: 5px; right: 5px; z-index: 20; }
        }

        .section-title { border-left: 6px solid #0f172a; padding-left: 12px; margin: 25px 0 15px 0; font-size: 1.3rem; font-weight: 900; }
        .is-now { background: #dcfce7 !important; border-left: 8px solid #22c55e !important; }
        
        /* 快選按鈕樣式 */
        .menu-btn { background: white; border: 1px solid #cbd5e1; padding: 8px; border-radius: 8px; font-weight: bold; font-size: 0.85rem; text-align: center; }
        .menu-btn:active { background: #e2e8f0; transform: scale(0.95); }
    </style>
</head>
<body class="view-mode pb-32">

    <nav class="bg-slate-900 text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow-md">
        <div>
            <h1 class="font-black text-lg">2026 執行控台</h1>
            <p id="topSync" class="text-[9px] text-slate-500 font-bold uppercase tracking-tighter">WAITING FOR SYNC...</p>
        </div>
        <div class="flex gap-2">
            <button onclick="handleModeSwitch()" id="modeBtn" class="bg-amber-500 px-3 py-1 rounded-lg text-xs font-bold">🛠️ 編輯模式</button>
            <button onclick="saveToFirebase()" class="admin-ui bg-blue-600 px-3 py-1 rounded-lg text-xs font-bold">💾 儲存</button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-3">
        
        <div class="section-title">PART 1. 執行流程 (Rundown)</div>
        <table class="main-table mb-3">
            <thead class="bg-slate-800 text-white desktop-th text-sm">
                <tr><th width="40">序</th><th width="140">時間</th><th width="60">長度</th><th>項目</th><th>執行說明</th><th width="110">負責</th><th width="40" class="admin-ui"></th></tr>
            </thead>
            <tbody id="rundownBody"></tbody>
        </table>
        <button onclick="addRundownRow()" class="admin-ui w-full py-3 bg-white border-2 border-dashed border-slate-300 rounded-xl text-slate-400 font-bold mb-8">+ 新增流程項目</button>

        <div class="section-title">PART 2. 器材需求 (Requisition)</div>
        <div class="admin-ui grid grid-cols-2 md:grid-cols-4 gap-2 mb-4">
            <script>
                menuItems.forEach(item => {
                    document.write(`<button class="menu-btn" onclick="addHardwareRow({name:'${item}', qty:''})">${item}</button>`);
                });
            </script>
        </div>
        <div class="admin-ui flex gap-2 mb-4">
            <input type="text" id="customHw" placeholder="手動新增器材名稱..." class="flex-grow p-2 border rounded-lg text-sm">
            <button onclick="addHardwareRow({name: document.getElementById('customHw').value, qty:''}); document.getElementById('customHw').value='';" class="bg-slate-700 text-white px-4 rounded-lg font-bold text-sm">加入</button>
        </div>

        <table class="main-table">
            <thead class="bg-slate-600 text-white desktop-th text-sm">
                <tr><th width="40">序</th><th>項目名稱</th><th width="100">數量</th><th width="40" class="admin-ui"></th></tr>
            </thead>
            <tbody id="hardwareBody"></tbody>
        </table>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        let db, dataRef, isAdmin = false;

        window.handleModeSwitch = () => {
            if (!isAdmin) {
                if (prompt("管理密碼：") === "364401") toggleMode(true);
                else alert("密碼錯誤");
            } else toggleMode(false);
        };

        window.toggleMode = (s) => {
            isAdmin = s;
            document.body.className = s ? "admin-mode" : "view-mode";
            document.getElementById('modeBtn').innerText = s ? "👁️ 退出編輯" : "🛠️ 編輯模式";
            document.querySelectorAll(".edit-box").forEach(el => el.contentEditable = s);
        };

        // --- 流程邏輯 ---
        window.addRundownRow = (isFirst = false, saved = null) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td data-label="序號" class="text-center font-bold text-slate-300 rd-idx"></td>
                <td data-label="時間" class="text-center font-black text-blue-600">
                    <div class="flex items-center justify-center">
                        ${isFirst ? `<input type="text" class="start-time w-12 text-center border-b" value="${saved?.startTime||'09:00'}" oninput="calculateTimes()">` : '<span class="row-start"></span>'}
                        <span class="mx-1 opacity-30">-</span><span class="row-end"></span>
                    </div>
                </td>
                <td data-label="長度"><input type="number" class="dur-input w-full text-center font-bold" value="${saved?.duration||10}" oninput="calculateTimes()"></td>
                <td data-label="項目" class="unit-cell edit-box outline-none px-2" contenteditable="${isAdmin}">${saved?.unit||''}</td>
                <td data-label="說明" class="edit-box text-xs text-slate-500 px-2 outline-none" contenteditable="${isAdmin}">${saved?.desc||''}</td>
                <td data-label="負責人">
                    <select class="row-job w-full text-xs font-bold bg-transparent">
                        <option value="">選擇人員</option>
                        ${teamList.map(t => `<option value="${t}" ${saved?.job===t?'selected':''}>${t}</option>`).join('')}
                        <option value="CUSTOM">手動輸入</option>
                    </select>
                    <input type="text" class="custom-job w-full text-xs mt-1 border-b ${saved?.job && !teamList.includes(saved?.job) ? '' : 'hidden'}" placeholder="姓名..." value="${saved?.job && !teamList.includes(saved?.job) ? saved?.job : ''}">
                </td>
                <td class="admin-ui btn-del-pos text-center"><button onclick="this.closest('tr').remove(); calculateTimes();" class="text-red-400 font-bold">✕</button></td>
            `;
            document.getElementById("rundownBody").appendChild(tr);
            
            const sel = tr.querySelector('.row-job');
            const cus = tr.querySelector('.custom-job');
            sel.onchange = () => { cus.classList.toggle('hidden', sel.value !== "CUSTOM"); if(sel.value!=="CUSTOM") cus.value = ""; };
            
            calculateTimes();
        };

        window.calculateTimes = () => {
            let nextS = "";
            document.querySelectorAll("#rundownBody tr").forEach((row, i) => {
                row.querySelector(".rd-idx").innerText = i + 1;
                const dur = parseInt(row.querySelector(".dur-input").value) || 0;
                let start = (i === 0) ? row.querySelector(".start-time").value : nextS;
                if(start && start.includes(":")) {
                    let [h, m] = start.split(":").map(Number);
                    let em = m + dur, eh = (h + Math.floor(em/60)) % 24, es = `${String(eh).padStart(2,'0')}:${String(em%60).padStart(2,'0')}`;
                    if(i !== 0) row.querySelector(".row-start").innerText = start;
                    row.querySelector(".row-end").innerText = es; nextS = es;
                }
            });
        };

        // --- 器材邏輯 ---
        window.addHardwareRow = (saved = null) => {
            if(!saved?.name) return;
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td data-label="序號" class="text-center font-bold text-slate-300 hw-idx"></td>
                <td data-label="項目" class="edit-box font-bold outline-none" contenteditable="${isAdmin}">${saved?.name}</td>
                <td data-label="數量"><input type="text" class="hw-qty w-full text-center font-black text-red-600 text-lg border-b" value="${saved?.qty||''}" placeholder="0"></td>
                <td class="admin-ui btn-del-pos text-center"><button onclick="this.closest('tr').remove(); updateHwIdx();" class="text-red-300 font-bold">✕</button></td>
            `;
            document.getElementById("hardwareBody").appendChild(tr);
            updateHwIdx();
        };

        window.updateHwIdx = () => {
            document.querySelectorAll("#hardwareBody tr").forEach((tr, i) => tr.querySelector(".hw-idx").innerText = i + 1);
        };

        // --- Firebase ---
        window.saveToFirebase = () => {
            if(!isAdmin) return;
            const data = { 
                rundown: Array.from(document.querySelectorAll("#rundownBody tr")).map(row => ({
                    startTime: row.querySelector(".start-time")?.value || "",
                    duration: row.querySelector(".dur-input").value,
                    unit: row.querySelector(".unit-cell").innerText,
                    desc: row.querySelector(".edit-box:nth-child(5)").innerText,
                    job: row.querySelector('.row-job').value === "CUSTOM" ? row.querySelector('.custom-job').value : row.querySelector('.row-job').value
                })),
                hardware: Array.from(document.querySelectorAll("#hardwareBody tr")).map(row => ({
                    name: row.querySelector(".edit-box").innerText,
                    qty: row.querySelector(".hw-qty").value
                })),
                ts: Date.now()
            };
            set(dataRef, data).then(() => alert("✅ 已同步至所有裝置"));
        };

        const app = initializeApp({ databaseURL: FIREBASE_URL });
        db = getDatabase(app);
        dataRef = ref(db, 'final_config_2026');

        onValue(dataRef, (snap) => {
            const data = snap.val();
            if(!data) { if(!document.querySelector("#rundownBody tr")) addRundownRow(true); return; }
            document.getElementById('topSync').innerText = "LAST SYNC: " + new Date(data.ts).toLocaleTimeString();
            document.getElementById("rundownBody").innerHTML = "";
            (data.rundown || []).forEach((item, idx) => addRundownRow(idx === 0, item));
            document.getElementById("hardwareBody").innerHTML = "";
            (data.hardware || []).forEach(item => addHardwareRow(item));
        });

        // 每15秒進度追蹤
        setInterval(() => {
            const now = new Date(); const cur = now.getHours() * 60 + now.getMinutes();
            document.querySelectorAll("#rundownBody tr").forEach(tr => {
                const st = tr.querySelector(".row-start")?.innerText || tr.querySelector(".start-time")?.value;
                const et = tr.querySelector(".row-end")?.innerText;
                if(!st || !et) return;
                const s = st.split(":").map(Number), e = et.split(":").map(Number), sm = s[0]*60 + s[1], em = e[0]*60 + e[1];
                tr.classList.toggle('is-now', cur >= sm && cur < em);
            });
        }, 15000);
    </script>
</body>
</html>
