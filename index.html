<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 執行流程控台-成員名單匯入版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background: #f8fafc; color: #1e293b; transition: 0.3s; }
        body.admin-mode { background: #fffbeb; } 
        .is-now { background: #f0fdf4 !important; border-left: 8px solid #22c55e !important; }
        
        .rundown-table { width: 100%; border-collapse: collapse; background: white; }
        .rundown-table th, .rundown-table td { border: 1px solid #cbd5e1; padding: 12px 8px; vertical-align: middle; }
        .table-head { background: #334155; color: white; font-size: 14px; font-weight: bold; }
        .cell-content { font-weight: bold; font-size: 14px; line-height: 1.5; color: #1e293b; }

        .job-tag { display: inline-block; background: #e2e8f0; color: #475569; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin: 2px; font-weight: bold; cursor: pointer; }
        
        /* 器材樣式 */
        .equipment-tag { display: inline-flex; align-items: center; background: white; border: 1.5px solid #cbd5e1; padding: 4px 10px; border-radius: 8px; margin: 4px; font-weight: bold; font-size: 13px; transition: 0.2s; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .equipment-tag.loaded { background-color: #22c55e !important; border-color: #166534 !important; color: white; }
        .eq-count { width: 40px; background: transparent; text-align: center; font-family: monospace; font-weight: 900; }

        /* 器材倉庫彈窗 */
        #warehouseModal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.8); z-index: 100; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
        .warehouse-content { background: white; width: 100%; max-width: 650px; border-radius: 24px; padding: 24px; max-height: 85vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .warehouse-item { cursor: pointer; border: 1px solid #e2e8f0; padding: 10px; border-radius: 10px; font-size: 13px; font-weight: bold; transition: 0.2s; text-align: left; background: #f8fafc; }
        .warehouse-item:hover { background: #eff6ff; border-color: #3b82f6; color: #1d4ed8; }

        .admin-only { display: none !important; }
        body.admin-mode .admin-only { display: block !important; }
        
        #cardViewContainer { display: none; }
        body.card-mode .rundown-table, body.card-mode .admin-only { display: none !important; }
        body.card-mode #cardViewContainer { display: block; }

        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="view-mode p-2 md:p-6 pb-20">

    <div class="max-w-[1500px] mx-auto">
        <div class="flex justify-between items-center mb-6 border-b-2 pb-4">
            <div>
                <h1 id="viewEventTitle" class="text-3xl font-black text-slate-900 tracking-tight italic">專案加載中...</h1>
                <p class="text-lg font-bold text-rose-600"><span id="viewEventDate"></span> <span id="viewWeekdayDisplay"></span></p>
            </div>
            <div class="flex gap-2 no-print">
                <button onclick="handleModeSwitch()" id="modeBtn" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-lg font-bold shadow-md transition">🛠️ 編輯模式</button>
                <button onclick="saveToFirebase()" class="admin-only bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-bold shadow-md">💾 儲存發布</button>
            </div>
        </div>

        <div class="admin-only bg-white rounded-xl mb-6 border-2 border-amber-300 shadow-xl p-4 no-print">
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div><label class="block text-[10px] font-bold text-slate-400">活動日期</label><input type="date" id="eventDate" class="w-full border p-2 font-bold rounded" onchange="updateHeaderInfo()"></div>
                <div><label class="block text-[10px] font-bold text-slate-400">專案名稱</label><input type="text" id="eventTitle" placeholder="輸入活動名稱" class="w-full border p-2 font-bold rounded" oninput="updateHeaderInfo()"></div>
            </div>
            <p class="text-xs font-black text-slate-500 mb-3 italic">👤 工作人員設定 (點選下拉或直接輸入姓名)：</p>
            <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-10 gap-2" id="staffConfig"></div>
        </div>

        <table class="rundown-table shadow-lg rounded-lg overflow-hidden mb-8" id="mainTable">
            <thead class="table-head">
                <tr><th style="width:50px">序</th><th style="width:160px">時間區段</th><th style="width:200px">單元項目</th><th>執行說明</th><th style="width:220px">負責人員</th></tr>
            </thead>
            <tbody id="rundownBody"></tbody>
        </table>
        <button onclick="addRow()" class="admin-only no-print mb-10 bg-white border border-slate-300 px-4 py-2 rounded font-bold hover:bg-slate-50">+ 新增流程</button>

        <div id="eqSection" class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm mb-10">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-black text-slate-800 italic">📋 器材清點 (從庫中點選加入)</h2>
                <button onclick="openWarehouse()" class="admin-only bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-lg hover:bg-slate-700">📦 開啟器材資料庫</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                <div class="bg-blue-50/30 p-4 rounded-xl border border-blue-100">
                    <h3 class="text-blue-600 text-xs font-black mb-3 border-l-4 border-blue-600 pl-2">📍 服務台分區</h3>
                    <div id="serviceContainer" class="flex flex-wrap min-h-[50px]"></div>
                </div>
                <div class="bg-rose-50/30 p-4 rounded-xl border border-rose-100">
                    <h3 class="text-rose-600 text-xs font-black mb-3 border-l-4 border-rose-600 pl-2">📍 舞台工作分區</h3>
                    <div id="stageContainer" class="flex flex-wrap min-h-[50px]"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="warehouseModal" class="no-print">
        <div class="warehouse-content">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h2 class="text-xl font-black text-slate-800 tracking-tighter">📦 器材資源庫 (點擊即加入前台)</h2>
                <button onclick="closeWarehouse()" class="text-3xl text-slate-300 hover:text-slate-600">✕</button>
            </div>
            <div class="grid grid-cols-2 gap-6">
                <div>
                    <p class="text-[10px] font-black text-blue-500 mb-2 uppercase">服務台常用庫存</p>
                    <div id="dbService" class="grid grid-cols-1 gap-2"></div>
                </div>
                <div>
                    <p class="text-[10px] font-black text-rose-500 mb-2 uppercase">舞台常用庫存</p>
                    <div id="dbStage" class="grid grid-cols-1 gap-2"></div>
                </div>
            </div>
            <div class="mt-8 pt-6 border-t bg-slate-50 -mx-6 -mb-6 p-6 rounded-b-24">
                <p class="text-xs font-bold text-slate-500 mb-2">手動新增特殊器材：</p>
                <div class="flex gap-2">
                    <input type="text" id="customEqName" placeholder="輸入名稱 (如：發電機)" class="flex-1 border p-2 rounded-lg font-bold">
                    <select id="customEqZone" class="border p-2 rounded-lg font-bold"><option value="service">服務台</option><option value="stage">舞台區</option></select>
                    <button onclick="addCustomEq()" class="bg-blue-600 text-white px-6 rounded-lg font-bold">新增</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const FIREBASE_URL = "https://rundown-worker-default-rtdb.firebaseio.com/";
        let db, dataRef, isAdmin = false;
        let currentData = { rundown: [], title: "", date: "", service: [], stage: [], staff: {} };

        // 【成員名單匯入】
        const companyStaff = ["江哥", "瑩驊", "志明", "鐵仁", "露比", "柏緯", "崧緯", "維憶", "芳瑜", "燕妮"];
        const jobOptions = ["控場", "機動", "音控", "服務台", "錄影", "儀式", "攝影", "主持人"];

        // 【器材庫清單】
        const dbServiceList = ["長官貴賓簽到表", "長官到場勾選表", "簽到物流箱", "新聞QR-CODE牌", "新聞稿發布資料", "餐盒", "瓶水", "文宣品", "花布桌巾", "紅布桌巾"];
        const dbStageList = ["背景帆布(寬*高)", "TRUSS組件", "音響系統", "無線麥克風", "面光燈+燈架", "活動手板", "主持人講稿夾", "歲末集章牌+木架"];

        // 初始化人員設定欄位 (10組)
        const staffConfig = document.getElementById('staffConfig');
        for(let i=1; i<=10; i++) {
            staffConfig.innerHTML += `
                <div class="staff-card border rounded-lg p-2 bg-slate-50 shadow-sm">
                    <input type="text" id="j${i}" placeholder="職稱" class="w-full text-[11px] mb-1 font-bold border-b bg-transparent focus:outline-none" list="jobList">
                    <input type="text" id="s${i}" placeholder="姓名" class="w-full text-[11px] font-bold bg-transparent focus:outline-none" list="nameList">
                </div>`;
        }

        // 建立 Datalist 選單
        document.body.insertAdjacentHTML('beforeend', `
            <datalist id="jobList">${jobOptions.map(o => `<option value="${o}">`).join('')}</datalist>
            <datalist id="nameList">${companyStaff.map(o => `<option value="${o}">`).join('')}</datalist>
        `);

        // 器材彈窗邏輯
        window.openWarehouse = () => {
            document.getElementById('warehouseModal').style.display = 'flex';
            const renderDb = (id, list, zone) => {
                document.getElementById(id).innerHTML = list.map(name => `<button class="warehouse-item" onclick="pushToActive('${zone}', '${name}')">${name} ＋</button>`).join('');
            };
            renderDb('dbService', dbServiceList, 'service');
            renderDb('dbStage', dbStageList, 'stage');
        };
        window.closeWarehouse = () => document.getElementById('warehouseModal').style.display = 'none';

        window.pushToActive = (zone, name) => {
            if(!currentData[zone].find(e => e.n === name)) {
                currentData[zone].push({ n: name, c: 1, l: false });
                renderEquipments();
            }
        };

        window.addCustomEq = () => {
            const n = document.getElementById('customEqName').value;
            const z = document.getElementById('customEqZone').value;
            if(n) { currentData[z].push({ n, c: 1, l: false }); document.getElementById('customEqName').value = ""; renderEquipments(); }
        };

        // 核心渲染與功能
        window.renderTable = () => {
            const tbody = document.getElementById("rundownBody");
            tbody.innerHTML = "";
            let nextS = "";
            const activeStaff = Array.from({length:10}, (_,i)=>({j:document.getElementById(`j${i+1}`).value, s:document.getElementById(`s${i+1}`).value})).filter(x=>x.j&&x.s);
            
            currentData.rundown.forEach((item, i) => {
                const dur = parseInt(item.duration) || 0;
                let start = (i === 0) ? (item.startTime || "09:00") : nextS;
                let [h, m] = start.split(":").map(Number);
                let emTotal = m + dur, eh = (h + Math.floor(emTotal/60)) % 24, em = emTotal % 60;
                let endStr = `${String(eh).padStart(2,'0')}:${String(em).padStart(2,'0')}`;
                nextS = endStr;
                
                tbody.innerHTML += `
                    <tr>
                        <td class="text-center text-slate-300 text-xs">${i+1}</td>
                        <td class="text-center">
                            <div class="time-range">${isAdmin && i===0 ? `<input type="text" class="w-16 text-center border-b" value="${start}" onchange="currentData.rundown[0].startTime=this.value; renderTable();">` : `<span>${start}</span>`}<span>-</span><span>${endStr}</span></div>
                            ${isAdmin ? `<input type="number" class="w-10 text-[10px] text-slate-400" value="${dur}" onchange="currentData.rundown[${i}].duration=this.value; renderTable();">` : ""}
                        </td>
                        <td class="cell-content" contenteditable="${isAdmin}" onblur="currentData.rundown[${i}].unit=this.innerText">${item.unit || ''}</td>
                        <td class="cell-content text-slate-600 font-normal" contenteditable="${isAdmin}" onblur="currentData.rundown[${i}].desc=this.innerText">${item.desc || ''}</td>
                        <td>
                            <div class="flex flex-wrap">${(item.jobs || []).map(j=>`<span class="job-tag" onclick="removeJob(${i},'${j}')">${j}</span>`).join('')}</div>
                            ${isAdmin ? `<select class="w-full text-[10px] mt-1 border" onchange="addJob(${i}, this.value); this.value=''"><option value="">＋ 派員</option>${activeStaff.map(s=>`<option value="${s.j}: ${s.s}">${s.j}: ${s.s}</option>`).join('')}</select>` : ""}
                        </td>
                    </tr>`;
            });
        };

        window.renderEquipments = () => {
            ['service', 'stage'].forEach(zone => {
                const c = document.getElementById(zone + 'Container');
                c.innerHTML = "";
                (currentData[zone] || []).forEach((e, idx) => {
                    const tag = document.createElement('div');
                    tag.className = `equipment-tag ${e.l ? 'loaded' : ''}`;
                    tag.innerHTML = `
                        <span class="cursor-pointer pr-2 border-r mr-2" onclick="currentData['${zone}'][${idx}].l=!currentData['${zone}'][${idx}].l; renderEquipments(); saveToFirebaseQuietly();">${e.n}</span>
                        <input type="number" class="eq-count" value="${e.c}" onchange="currentData['${zone}'][${idx}].c=this.value; saveToFirebaseQuietly();">
                        ${isAdmin ? `<span class="ml-2 text-rose-400 cursor-pointer font-bold" onclick="currentData['${zone}'].splice(${idx},1); renderEquipments(); saveToFirebaseQuietly();">✕</span>` : ''}
                    `;
                    c.appendChild(tag);
                });
            });
        };

        window.addJob = (i, v) => { if(v && !currentData.rundown[i].jobs.includes(v)) { currentData.rundown[i].jobs.push(v); renderTable(); } };
        window.removeJob = (i, v) => { if(isAdmin) { currentData.rundown[i].jobs = currentData.rundown[i].jobs.filter(x=>x!==v); renderTable(); } };
        window.addRow = () => { currentData.rundown.push({ duration: 10, unit: "新單元", desc: "輸入內容", jobs: [] }); renderTable(); };
        window.handleModeSwitch = () => {
            if (!isAdmin) { if (prompt("管理密碼：") === "364401") isAdmin = true; else return; } else isAdmin = false;
            document.body.className = isAdmin ? "admin-mode p-2 md:p-6 pb-20" : "view-mode p-2 md:p-6 pb-20";
            document.getElementById('modeBtn').innerText = isAdmin ? "👁️ 結束編輯" : "🛠️ 編輯模式";
            renderTable(); renderEquipments();
        };
        window.updateHeaderInfo = () => {
            const title = document.getElementById('eventTitle').value, date = document.getElementById('eventDate').value;
            document.getElementById('viewEventTitle').innerText = title || "2026 執行流程";
            document.getElementById('viewEventDate').innerText = date || "";
            if(date) document.getElementById('viewWeekdayDisplay').innerText = `(${['週日','週一','週二','週三','週四','週五','週六'][new Date(date).getDay()]})`;
        };

        window.saveToFirebase = () => {
            currentData.title = document.getElementById('eventTitle').value;
            currentData.date = document.getElementById('eventDate').value;
            currentData.staff = {};
            for(let i=1; i<=10; i++) currentData.staff[i] = { j: document.getElementById(`j${i}`).value, s: document.getElementById(`s${i}`).value };
            set(dataRef, currentData).then(() => alert("✅ 雲端發布成功"));
        };
        const saveToFirebaseQuietly = () => set(dataRef, currentData);

        const app = initializeApp({ databaseURL: FIREBASE_URL });
        db = getDatabase(app);
        dataRef = ref(db, 'rundown_v2026_final_optimized');

        onValue(dataRef, (snap) => {
            const d = snap.val();
            if(d) {
                currentData = d;
                document.getElementById('eventTitle').value = d.title || "";
                document.getElementById('eventDate').value = d.date || "";
                for(let i=1; i<=10; i++) if(d.staff?.[i]) {
                    document.getElementById(`j${i}`).value = d.staff[i].j || "";
                    document.getElementById(`s${i}`).value = d.staff[i].s || "";
                }
                updateHeaderInfo(); renderTable(); renderEquipments();
            }
        });
    </script>
</body>
</html>
