<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026頭份四月八-執行製作全功能控台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background: #f1f5f9; }
        .admin-mode { background: #fffbeb !important; }
        .is-now { background: #f0fdf4 !important; border-left: 10px solid #22c55e !important; }
        .rundown-table { width: 100%; border-collapse: collapse; background: white; table-layout: fixed; }
        .rundown-table th, .rundown-table td { border: 1px solid #cbd5e1; padding: 12px 8px; vertical-align: middle; }
        .cell-input { font-weight: bold; width: 100%; outline: none; background: transparent; border: none; font-size: 14px; }
        .admin-mode .cell-input { background: #fff; box-shadow: inset 0 0 0 1px #e2e8f0; border-radius: 4px; padding: 4px; }
        .admin-only { display: none !important; }
        .admin-mode .admin-only { display: block !important; }
        /* 名片模式 */
        #cardContainer { display: none; grid-template-columns: 1fr; gap: 1rem; }
        body.card-view .table-wrapper, body.card-view .admin-only:not(#viewBtn) { display: none !important; }
        body.card-view #cardContainer { display: grid; }
        .item-card { background: white; padding: 20px; border-radius: 16px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .eq-tag { cursor: pointer; border: 1.5px solid #cbd5e1; padding: 6px 12px; border-radius: 10px; margin: 4px; font-weight: bold; font-size: 13px; display: inline-block; background: white; }
        .eq-tag.loaded { background-color: #22c55e; color: white; border-color: #166534; }
    </style>
</head>
<body class="p-2 md:p-6 pb-20">

    <div class="max-w-[1400px] mx-auto">
        <div class="flex justify-between items-center mb-6 border-b-4 border-slate-800 pb-4">
            <div>
                <h1 class="text-2xl font-black italic">2026頭份四月八 靚燈好客節</h1>
                <p class="text-sm font-bold text-rose-600">3/27(五) 10:00 發布會 | 執行製作控台</p>
            </div>
            <div class="flex gap-2">
                <button onclick="toggleCardView()" id="viewBtn" class="bg-indigo-600 text-white px-3 py-2 rounded-lg font-bold shadow-md">🗂️ 名片模式</button>
                <button onclick="handleAdminSwitch()" id="modeBtn" class="bg-amber-500 text-white px-3 py-2 rounded-lg font-bold shadow-md">🛠️ 編輯模式</button>
                <button onclick="saveToCloud()" class="admin-only bg-blue-600 text-white px-3 py-2 rounded-lg font-bold shadow-md">💾 儲存發布</button>
            </div>
        </div>

        <div class="admin-only bg-white rounded-xl mb-6 border-2 border-amber-300 p-4 shadow-xl">
            <h3 class="text-xs font-black mb-3 text-amber-600">👥 10人執行人員設定 (決定下方下拉選單內容)</h3>
            <div class="grid grid-cols-2 md:grid-cols-5 gap-2" id="staffGrid"></div>
        </div>

        <div class="table-wrapper overflow-x-auto rounded-xl shadow-xl bg-white">
            <table class="rundown-table">
                <thead class="bg-slate-800 text-white text-sm">
                    <tr>
                        <th width="45">序</th><th width="130">時間</th><th width="70">長度</th><th width="180">單元</th><th>執行說明</th><th width="150">負責人員</th><th width="50" class="admin-only">×</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
            <button onclick="addNewRow()" class="admin-only w-full p-4 border-2 border-dashed border-slate-200 font-black text-slate-400">+ 新增流程項目 (文字會自動記憶)</button>
        </div>

        <div id="cardContainer" class="mt-4"></div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-10">
            <div class="bg-white p-5 rounded-2xl border-t-8 border-blue-500 shadow-sm">
                <h2 class="font-black text-blue-600 text-sm mb-2">📍 服務台器材</h2>
                <div id="serviceBox"></div>
                <div class="admin-only mt-3 flex gap-2">
                    <select id="serviceSelect" class="flex-1 border p-2 rounded text-xs" onchange="if(this.value){addEq('service', this.value); this.value=''}">
                        <option value="">快速指派常用器材...</option>
                        <option value="簽到表/筆">簽到表/筆</option><option value="瓶裝水">瓶裝水</option>
                        <option value="貴賓名牌">貴賓名牌</option><option value="新聞資料袋">新聞資料袋</option>
                    </select>
                    <input type="text" class="flex-1 border p-2 rounded text-xs" placeholder="或手打按 Enter" onkeydown="if(event.key==='Enter'){addEq('service', this.value); this.value=''}">
                </div>
            </div>
            <div class="bg-white p-5 rounded-2xl border-t-8 border-rose-500 shadow-sm">
                <h2 class="font-black text-rose-600 text-sm mb-2">📍 舞台區器材</h2>
                <div id="stageBox"></div>
                <div class="admin-only mt-3 flex gap-2">
                    <select id="stageSelect" class="flex-1 border p-2 rounded text-xs" onchange="if(this.value){addEq('stage', this.value); this.value=''}">
                        <option value="">快速指派常用器材...</option>
                        <option value="無線麥克風*2">無線麥克風*2</option><option value="上手板">上手板</option>
                        <option value="炒米粉道具">炒米粉道具</option><option value="攝影補燈">攝影補燈</option>
                    </select>
                    <input type="text" class="flex-1 border p-2 rounded text-xs" placeholder="或手打按 Enter" onkeydown="if(event.key==='Enter'){addEq('stage', this.value); this.value=''}">
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const app = initializeApp({ databaseURL: "https://rundown-worker-default-rtdb.firebaseio.com/" });
        const db = getDatabase(app);
        const dataRef = ref(db, 'toufen_48_vFinal_Dropdown');

        let isAdmin = false, isCardView = false;
        let localData = {
            staff: Array(10).fill().map(() => ({ j: "", n: "" })),
            rundown: [
                { t: "08:30", d: "30M", u: "公司出發/小車", s: "全體人員出發", person: "" },
                { t: "10:00-10:10", d: "10m", u: "媒體訪問", s: "市長接受聯訪", person: "" }
            ],
            eq: { service: [], stage: [] }
        };

        const init = () => {
            const grid = document.getElementById('staffGrid');
            grid.innerHTML = localData.staff.map((_, i) => `
                <div class="p-1 border rounded bg-slate-50">
                    <input type="text" oninput="localData.staff[${i}].j=this.value; renderAll()" class="sj w-full text-[10px] border-b outline-none mb-1" placeholder="職稱">
                    <input type="text" oninput="localData.staff[${i}].n=this.value; renderAll()" class="sn w-full text-[10px] outline-none font-bold" placeholder="姓名">
                </div>
            `).join('');
            renderAll();
        };

        window.renderAll = () => {
            const tbody = document.getElementById('tableBody');
            const cardContainer = document.getElementById('cardContainer');
            const curMin = new Date().getHours() * 60 + new Date().getMinutes();
            
            tbody.innerHTML = ""; cardContainer.innerHTML = "";
            // 重要：動態生成人員下拉選單內容
            const staffOptions = localData.staff.filter(s => s.n).map(s => `<option value="${s.j}-${s.n}">${s.j}:${s.n}</option>`).join('');

            localData.rundown.forEach((item, i) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="text-center text-slate-300 font-bold text-xs">${i+1}</td>
                    <td><input class="cell-input" value="${item.t}" oninput="localData.rundown[${i}].t=this.value" ${!isAdmin?'readonly':''}></td>
                    <td><input class="cell-input" value="${item.d}" oninput="localData.rundown[${i}].d=this.value" ${!isAdmin?'readonly':''}></td>
                    <td><input class="cell-input" value="${item.u}" oninput="localData.rundown[${i}].u=this.value" ${!isAdmin?'readonly':''}></td>
                    <td><input class="cell-input font-normal text-slate-500" value="${item.s}" oninput="localData.rundown[${i}].s=this.value" ${!isAdmin?'readonly':''}></td>
                    <td>
                        ${isAdmin ? `<select class="w-full text-xs border bg-white" onchange="localData.rundown[${i}].person=this.value; renderAll()">
                            <option value="">未指派</option>
                            ${staffOptions.replace('value="'+item.person+'"', 'selected value="'+item.person+'"')}
                        </select>` : `<span class="text-xs font-bold text-indigo-600">${item.person || '-'}</span>`}
                    </td>
                    <td class="admin-only text-center"><button onclick="removeRow(${i})" class="text-rose-500">×</button></td>
                `;
                tbody.appendChild(tr);

                const card = document.createElement('div');
                card.className = `item-card`;
                card.innerHTML = `<div class="flex justify-between mb-2"><span class="text-xs font-black text-slate-400">#${i+1}</span><span class="text-xl font-black text-indigo-600">${item.t}</span></div>
                    <div class="text-xl font-black mb-1">${item.u}</div><div class="text-sm text-slate-500 mb-3">${item.s}</div>
                    <div class="flex justify-between items-center border-t pt-3">
                        <div class="text-xs font-bold text-slate-400">長度: ${item.d}</div>
                        <div class="bg-indigo-600 text-white px-3 py-1 rounded-full text-[10px] font-bold">${item.person || '現場執行'}</div>
                    </div>`;
                cardContainer.appendChild(card);
            });

            // 同步上方人員輸入框文字
            const sj = document.querySelectorAll('.sj'), sn = document.querySelectorAll('.sn');
            localData.staff.forEach((s, i) => { if(sj[i]) sj[i].value = s.j; if(sn[i]) sn[i].value = s.n; });
            renderEq();
        };

        window.toggleCardView = () => { isCardView = !isCardView; document.body.classList.toggle('card-view', isCardView); document.getElementById('viewBtn').innerText = isCardView ? "📊 表格模式" : "🗂️ 名片模式"; renderAll(); };
        window.handleAdminSwitch = () => { if(!isAdmin && prompt("管理密碼") !== "364401") return; isAdmin = !isAdmin; document.body.classList.toggle('admin-mode', isAdmin); document.getElementById('modeBtn').innerText = isAdmin ? "👁️ 結束編輯" : "🛠️ 編輯模式"; renderAll(); };
        window.addNewRow = () => { localData.rundown.push({ t: "", d: "10m", u: "新單元", s: "", person: "" }); renderAll(); };
        window.removeRow = (i) => { localData.rundown.splice(i, 1); renderAll(); };
        window.addEq = (z, n) => { localData.eq[z].push({n, l:false}); renderEq(); };
        window.renderEq = () => { ['service', 'stage'].forEach(z => { document.getElementById(z+'Box').innerHTML = (localData.eq[z]||[]).map((e,idx)=>`<div class="eq-tag ${e.l?'loaded':''}" onclick="localData.eq['${z}'][${idx}].l=!localData.eq['${z}'][${idx}].l; renderEq()">${e.n} ${isAdmin?'<span class="ml-1 opacity-30" onclick="event.stopPropagation(); localData.eq[\''+z+'\'].splice('+idx+',1); renderEq()">×</span>':''}</div>`).join(''); }); };
        window.saveToCloud = () => { set(dataRef, localData).then(() => alert("✅ 已發布同步！")); };
        onValue(dataRef, (snap) => { if(!isAdmin) { const d = snap.val(); if(d) { localData = d; renderAll(); } } });
        init();
    </script>
</body>
</html>
