<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>執行平台 Ver. 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background: #ffffff; }
        .is-now { background: #f0fdf4 !important; border-left: 8px solid #22c55e !important; }
        
        /* 藍圖色彩對齊 */
        .bg-main-blue { background: #4a72c2; color: white; }
        .bg-main-orange { background: #ed7d31; color: white; }
        .border-main-blue { border: 2px solid #4a72c2; }
        
        /* 按鈕樣式 */
        .btn-header { background: #4a72c2; color: white; border: 1px solid #3b5da3; border-radius: 0; padding: 12px; font-weight: bold; text-align: center; }
        
        /* 區塊標題 */
        .section-header { text-align: center; font-weight: bold; padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.3); }
        
        .admin-only { display: none !important; }
        .admin-mode .admin-only { display: block !important; }
        body.card-view .table-wrapper { display: none; }
        #cardContainer { display: none; }
        body.card-view #cardContainer { display: grid; grid-template-columns: 1fr; gap: 10px; color: #333; }
        
        input, select { color: inherit; background: transparent; border: none; outline: none; }
        .dark-text input, .dark-text select { color: #333; }
    </style>
</head>
<body class="p-4">

    <div class="max-w-[1400px] mx-auto space-y-4">
        
        <div class="grid grid-cols-12 gap-2">
            <div class="col-span-12 md:col-span-6 bg-main-blue p-6 flex items-center text-lg font-bold">
                <span>日期：</span><input type="text" placeholder="請輸入日期" class="border-b border-white w-32 mr-6 px-2">
                <span>活動主題：</span><input type="text" placeholder="請輸入主題" class="border-b border-white flex-1 px-2">
            </div>
            <a href="#" target="_blank" class="col-span-4 md:col-span-2 btn-header flex items-center justify-center">即時簽到看板連結鈕</a>
            <button onclick="toggleCardView()" id="viewBtn" class="col-span-4 md:col-span-2 btn-header">名片模式</button>
            <button onclick="handleAdminSwitch()" id="modeBtn" class="col-span-4 md:col-span-2 btn-header">後台模式</button>
        </div>

        <div class="bg-main-blue rounded-sm overflow-hidden border-main-blue">
            <div class="section-header">執行人員分工及名單</div>
            <div id="staffGrid" class="grid grid-cols-2 md:grid-cols-5 gap-1 p-2 bg-white text-slate-800">
                </div>
        </div>

        <div class="bg-main-blue rounded-sm overflow-hidden border-main-blue">
            <div class="section-header">
                流程表<br>
                <span class="text-xs font-normal">序 / 時間(長度) / 單元項目 / 執行說明 / 負責人員 / 增加 or 刪除</span>
            </div>
            
            <div class="table-wrapper bg-white">
                <table class="w-full text-sm text-slate-800">
                    <thead class="bg-slate-100">
                        <tr>
                            <th class="p-2 border" width="40">序</th>
                            <th class="p-2 border" width="120">時間(長度)</th>
                            <th class="p-2 border">單元項目</th>
                            <th class="p-2 border">執行說明</th>
                            <th class="p-2 border" width="150">負責人員</th>
                            <th class="p-2 border" width="80">簽到</th>
                            <th class="p-2 border admin-only" width="40">✕</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
                <button onclick="addNewRow()" class="admin-only w-full p-4 text-slate-400 border-t border-dashed font-bold">+ 增加項目</button>
            </div>
            <div id="cardContainer" class="p-2 bg-slate-100"></div>
        </div>

        <div class="bg-main-blue p-4 rounded-sm border-main-blue">
            <div class="font-bold mb-4">器材清單</div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-main-orange p-4 min-h-[250px]">
                    <div class="flex justify-between items-center border-b border-white/50 mb-4 pb-2">
                        <span class="text-xl font-black">服務台</span>
                        <button onclick="addEqRow('service')" class="admin-only bg-white/20 px-2 py-1 text-xs">新增</button>
                    </div>
                    <div id="serviceTags" class="mb-2 flex flex-wrap gap-1"></div>
                    <div id="serviceBox" class="space-y-2"></div>
                </div>
                <div class="bg-main-orange p-4 min-h-[250px]">
                    <div class="flex justify-between items-center border-b border-white/50 mb-4 pb-2">
                        <span class="text-xl font-black">舞台區</span>
                        <button onclick="addEqRow('stage')" class="admin-only bg-white/20 px-2 py-1 text-xs">新增</button>
                    </div>
                    <div id="stageTags" class="mb-2 flex flex-wrap gap-1"></div>
                    <div id="stageBox" class="space-y-2"></div>
                </div>
            </div>
            <button onclick="saveToCloud()" class="admin-only w-full bg-slate-900 text-white p-4 mt-4 font-black">💾 儲存並發布 Ver. 1</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const app = initializeApp({ databaseURL: "https://rundown-worker-default-rtdb.firebaseio.com/" });
        const db = getDatabase(app);
        const dataRef = ref(db, 'execution_platform_v1');

        let isAdmin = false, isCardView = false;
        
        // 公司初始名單
        const initialStaff = [
            { j: "控場", n: "鐵仁" }, { j: "執行", n: "崧瑋" }, { j: "執行", n: "露比" },
            { j: "執行", n: "志明" }, { j: "執行", n: "維憶" }, { j: "執行", n: "芳瑜" },
            { j: "服務台", n: "柏緯" }, { j: "攝影", n: "江哥" }, { j: "執行", n: "中瑜" }, { j: "物料", n: "貝克里" }
        ];

        let localData = {
            staff: initialStaff,
            rundown: [{ t: "10:00", d: "10", u: "活動開始", s: "現場說明", person: "全選-ALL STAFF", checkin: "" }],
            eq: { service: [], stage: [] },
            memory: ["麥克風", "無線電", "新聞袋", "摸彩箱"]
        };

        const renderStaff = () => {
            const grid = document.getElementById('staffGrid');
            grid.innerHTML = localData.staff.map((s, i) => `
                <div class="border p-1 ${isAdmin?'bg-amber-50':''}">
                    <input class="text-[10px] w-full border-b block" value="${s.j}" onchange="localData.staff[${i}].j=this.value; renderAll()" ${!isAdmin?'readonly':''}>
                    <input class="font-bold w-full" value="${s.n}" onchange="localData.staff[${i}].n=this.value; renderAll()" ${!isAdmin?'readonly':''}>
                </div>
            `).join('');
        };

        window.renderAll = () => {
            renderStaff();
            const tbody = document.getElementById('tableBody');
            const cardContainer = document.getElementById('cardContainer');
            tbody.innerHTML = ""; cardContainer.innerHTML = "";
            
            // 下拉選單人員清單
            let staffOptions = `<option value="">負責人</option><option value="全選-ALL STAFF">📢 全選: ALL STAFF</option>`;
            localData.staff.forEach(s => { if(s.n) staffOptions += `<option value="${s.j}-${s.n}">${s.j}:${s.n}</option>`; });

            localData.rundown.forEach((item, i) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-2 border text-center font-bold text-slate-400">${i+1}</td>
                    <td class="p-2 border"><input class="w-full font-bold" value="${item.t||''} (${item.d||''})" onchange="[localData.rundown[${i}].t, localData.rundown[${i}].d]=this.value.replace(')','').split('('); renderAll()" ${!isAdmin?'readonly':''}></td>
                    <td class="p-2 border"><input class="w-full font-bold" value="${item.u||''}" oninput="localData.rundown[${i}].u=this.value" ${!isAdmin?'readonly':''}></td>
                    <td class="p-2 border"><input class="w-full text-xs" value="${item.s||''}" oninput="localData.rundown[${i}].s=this.value" ${!isAdmin?'readonly':''}></td>
                    <td class="p-2 border">
                        ${isAdmin ? `<select class="w-full text-xs p-1 border font-bold" onchange="localData.rundown[${i}].person=this.value; renderAll()">${staffOptions.replace(`value="${item.person}"`, `value="${item.person}" selected`)}</select>` 
                        : `<div class="text-[11px] font-bold text-center p-1 rounded ${item.person.includes('全選')?'bg-rose-500 text-white':'bg-slate-100'}">${item.person || '-'}</div>`}
                    </td>
                    <td class="p-2 border text-center">${item.checkin ? `<span class="text-green-600 font-bold">✅${item.checkin}</span>` : `<button onclick="doCheckIn(${i})" class="bg-green-500 text-white text-[10px] px-2 py-1 rounded">簽到</button>`}</td>
                    <td class="p-2 border admin-only text-center"><button onclick="localData.rundown.splice(${i}, 1); renderAll()" class="text-rose-500">✕</button></td>
                `;
                tbody.appendChild(tr);

                // 名片渲染
                const card = document.createElement('div');
                card.className = "bg-white p-4 border-2 border-slate-200";
                card.innerHTML = `<div class="flex justify-between font-black text-blue-800"><span>${item.t} (${item.d}m)</span><span>${item.u}</span></div>
                                  <div class="text-sm mt-2">${item.s}</div>
                                  <div class="flex justify-between mt-3 border-t pt-2">
                                      <span class="text-xs font-bold text-slate-400">簽到: ${item.checkin||'待命'}</span>
                                      <span class="bg-blue-100 text-blue-800 px-2 py-1 text-[10px] font-black">${item.person}</span>
                                  </div>`;
                cardContainer.appendChild(card);
            });
            renderEq();
        };

        window.renderEq = () => {
            ['service', 'stage'].forEach(z => {
                document.getElementById(z+'Tags').innerHTML = localData.memory.map(m => `<span class="bg-white/20 border border-white text-[10px] px-2 py-0.5 cursor-pointer" onclick="useMemory('${z}','${m}')">${m}</span>`).join('');
                document.getElementById(z+'Box').innerHTML = localData.eq[z].map((e, idx) => `
                    <div class="flex items-center gap-2 bg-white/10 p-2">
                        <input type="checkbox" class="w-5 h-5" ${e.l?'checked':''} onchange="localData.eq['${z}'][${idx}].l=!localData.eq['${z}'][${idx}].l; renderEq(); if(!isAdmin) saveToCloud();">
                        <input type="text" class="bg-transparent flex-1 font-bold border-b border-white/30" value="${e.n}" onchange="updateEqName('${z}',${idx},this.value)" ${!isAdmin?'readonly':''}>
                        <input type="number" class="bg-transparent w-10 text-center font-bold" value="${e.q}" onchange="localData.eq['${z}'][${idx}].q=this.value; renderEq()" ${!isAdmin?'readonly':''}>
                    </div>
                `).join('');
            });
        };

        window.useMemory = (z, val) => { if(!isAdmin) return; localData.eq[z].push({n:val, q:1, l:false}); renderEq(); };
        window.updateEqName = (z, idx, val) => { localData.eq[z][idx].n = val; if(val && !localData.memory.includes(val)) localData.memory.push(val); renderEq(); };
        window.addEqRow = (z) => { localData.eq[z].push({n:"", q:1, l:false}); renderEq(); };
        window.doCheckIn = (i) => { const n = new Date(); localData.rundown[i].checkin = n.getHours()+":"+String(n.getMinutes()).padStart(2,'0'); renderAll(); if(!isAdmin) saveToCloud(); };
        window.toggleCardView = () => { isCardView = !isCardView; document.body.classList.toggle('card-view', isCardView); document.getElementById('viewBtn').innerText = isCardView ? "表格模式" : "名片模式"; renderAll(); };
        window.handleAdminSwitch = () => { if(!isAdmin && prompt("管理密碼") !== "364401") return; isAdmin = !isAdmin; document.body.classList.toggle('admin-mode', isAdmin); document.getElementById('modeBtn').innerText = isAdmin ? "結束後台" : "後台模式"; renderAll(); };
        window.addNewRow = () => { localData.rundown.push({t:"", d:"10", u:"新單元", s:"", person:"", checkin:""}); renderAll(); };
        window.saveToCloud = () => { set(dataRef, localData).then(() => alert("✅ 執行平台 Ver. 1 已同步儲存")); };
        onValue(dataRef, (snap) => { if(!isAdmin) { const d = snap.val(); if(d) { localData = d; renderAll(); } } });
        
        renderAll();
    </script>
</body>
</html>
