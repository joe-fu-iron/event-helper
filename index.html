<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>執行平台 Ver. 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background: #ffffff; color: #000; }
        
        /* 標題區維持深色底 */
        .bg-main-blue { background: #4a72c2; color: white; }
        .bg-main-orange { background: #ed7d31; color: white; }
        
        /* 內容區：黑線白底 */
        .border-black { border: 1px solid #000 !important; }
        .table-bw th, .table-bw td { border: 1px solid #000; padding: 8px; background: #fff; }
        .input-bw { background: #fff; border: 1px solid #000; padding: 2px 4px; }
        
        /* 自動高亮：現在進行中的單元 */
        .is-now { background: #e2e8f0 !important; font-weight: bold; border: 3px solid #000 !important; }
        
        .admin-only { display: none !important; }
        .admin-mode .admin-only { display: block !important; }
        .admin-mode .admin-bg { background: #fffbeb !important; }
        
        body.card-view .table-wrapper { display: none; }
        #cardContainer { display: none; }
        body.card-view #cardContainer { display: grid; grid-template-columns: 1fr; gap: 10px; }
        
        input, select { outline: none; }
        .memory-tag { cursor: pointer; border: 1px solid #000; padding: 1px 6px; font-size: 11px; margin: 2px; display: inline-block; background: #f8fafc; color: #000; }
    </style>
</head>
<body class="p-4">

    <div class="max-w-[1400px] mx-auto space-y-4">
        
        <div class="grid grid-cols-12 gap-2">
            <div class="col-span-12 md:col-span-6 bg-main-blue p-6 flex items-center text-lg font-bold">
                <span>日期：</span><input type="text" id="eventDate" class="border-b border-white w-32 mr-6 bg-transparent px-2" value="2026/03/27">
                <span>活動主題：</span><input type="text" id="eventTitle" class="border-b border-white flex-1 bg-transparent px-2" value="頭份四月八 靚燈好客節">
            </div>
            <a href="https://your-sign-in-board-url.web.app" target="_blank" class="col-span-4 md:col-span-2 bg-main-blue text-white flex items-center justify-center font-bold text-sm border border-white">即時簽到看板連結鈕</a>
            <button onclick="toggleCardView()" id="viewBtn" class="col-span-4 md:col-span-2 bg-main-blue text-white font-bold text-sm border border-white">名片模式</button>
            <button onclick="handleAdminSwitch()" id="modeBtn" class="col-span-4 md:col-span-2 bg-main-blue text-white font-bold text-sm border border-white">後台模式</button>
        </div>

        <div class="border-black">
            <div class="bg-main-blue text-center font-bold p-2">執行人員分工及名單</div>
            <div id="staffGrid" class="grid grid-cols-2 md:grid-cols-5 gap-0 bg-white">
                </div>
        </div>

        <div class="border-black">
            <div class="bg-main-blue text-center font-bold p-2">
                流程表<br>
                <span class="text-xs font-normal">序 / 時間(長度) / 單元項目 / 執行說明 / 負責人員 / 增加 or 刪除</span>
            </div>
            
            <div class="table-wrapper">
                <table class="table-bw w-full text-sm">
                    <thead>
                        <tr class="bg-slate-100">
                            <th width="40">序</th>
                            <th width="120">時間(長度)</th>
                            <th>單元項目</th>
                            <th>執行說明</th>
                            <th width="150">負責人員</th>
                            <th width="80">簽到</th>
                            <th class="admin-only" width="40">✕</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
                <button onclick="addNewRow()" class="admin-only w-full p-4 border-t border-black font-bold text-slate-400">+ 增加流程項目</button>
            </div>
            <div id="cardContainer" class="p-2"></div>
        </div>

        <div class="border-black p-1">
            <div class="bg-main-blue font-bold p-2 mb-2 italic">器材清單</div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="border-black p-3">
                    <div class="bg-main-orange flex justify-between items-center p-2 mb-2">
                        <span class="font-black text-lg">服務台</span>
                        <button onclick="addEqRow('service')" class="admin-only border border-white px-2 py-0.5 text-xs">新增</button>
                    </div>
                    <div id="serviceTags" class="mb-2"></div> <div id="serviceBox" class="space-y-1"></div>
                </div>
                <div class="border-black p-3">
                    <div class="bg-main-orange flex justify-between items-center p-2 mb-2">
                        <span class="font-black text-lg">舞台區</span>
                        <button onclick="addEqRow('stage')" class="admin-only border border-white px-2 py-0.5 text-xs">新增</button>
                    </div>
                    <div id="stageTags" class="mb-2"></div> <div id="stageBox" class="space-y-1"></div>
                </div>
            </div>
        </div>

        <button onclick="saveToCloud()" class="admin-only w-full bg-black text-white p-4 font-black">💾 儲存並更新雲端資料 (Ver. 2)</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const app = initializeApp({ databaseURL: "https://rundown-worker-default-rtdb.firebaseio.com/" });
        const db = getDatabase(app);
        const dataRef = ref(db, 'execution_platform_v2');

        let isAdmin = false, isCardView = false;
        
        let localData = {
            date: "2026/03/27",
            title: "頭份四月八 靚燈好客節",
            staff: [
                { j: "控場", n: "鐵仁" }, { j: "執行", n: "崧瑋" }, { j: "執行", n: "露比" },
                { j: "執行", n: "志明" }, { j: "執行", n: "維憶" }, { j: "執行", n: "芳瑜" },
                { j: "服務台", n: "柏緯" }, { j: "攝影", n: "江哥" }, { j: "執行", n: "中瑜" }, { j: "物料", n: "貝克里" }
            ],
            rundown: [{ t: "10:00", d: "10", u: "開幕式", s: "長官致詞與大合照", person: "全選-ALL STAFF", checkin: "" }],
            eq: { service: [], stage: [] },
            memory: ["無線電", "麥克風", "指示牌", "瓶裝水", "講稿"]
        };

        // 自動檢查時間並更新 UI
        setInterval(() => { renderAll(); }, 60000);

        const renderStaff = () => {
            const grid = document.getElementById('staffGrid');
            grid.innerHTML = localData.staff.map((s, i) => `
                <div class="border border-black p-2 ${isAdmin?'admin-bg':''}">
                    <input class="text-[10px] w-full border-b border-black mb-1 block" value="${s.j}" onchange="localData.staff[${i}].j=this.value" ${!isAdmin?'readonly':''}>
                    <input class="font-bold w-full" value="${s.n}" onchange="localData.staff[${i}].n=this.value" ${!isAdmin?'readonly':''}>
                </div>
            `).join('');
        };

        window.renderAll = () => {
            renderStaff();
            const tbody = document.getElementById('tableBody');
            const cardContainer = document.getElementById('cardContainer');
            const now = new Date();
            const curMin = now.getHours() * 60 + now.getMinutes();
            
            tbody.innerHTML = ""; cardContainer.innerHTML = "";
            let staffOptions = `<option value="">負責人</option><option value="全選-ALL STAFF">📢 全選: ALL STAFF</option>`;
            localData.staff.forEach(s => { if(s.n) staffOptions += `<option value="${s.j}-${s.n}">${s.j}:${s.n}</option>`; });

            localData.rundown.forEach((item, i) => {
                let isActive = false;
                if(item.t && item.t.includes(':')) {
                    const [h, m] = item.t.split(':').map(Number);
                    const start = h * 60 + m;
                    const duration = parseInt(item.d) || 5;
                    if(curMin >= start && curMin < (start + duration)) isActive = true;
                }

                const tr = document.createElement('tr');
                if(isActive) tr.className = "is-now";
                tr.innerHTML = `
                    <td class="text-center font-bold border border-black">${i+1}</td>
                    <td class="border border-black"><input class="w-full bg-transparent font-bold" value="${item.t||''} (${item.d||''})" onchange="updateTime(${i}, this.value)" ${!isAdmin?'readonly':''}></td>
                    <td class="border border-black"><input class="w-full bg-transparent font-bold" value="${item.u||''}" oninput="localData.rundown[${i}].u=this.value" ${!isAdmin?'readonly':''}></td>
                    <td class="border border-black"><input class="w-full bg-transparent text-xs" value="${item.s||''}" oninput="localData.rundown[${i}].s=this.value" ${!isAdmin?'readonly':''}></td>
                    <td class="border border-black text-center">
                        ${isAdmin ? `<select class="w-full text-xs font-bold bg-transparent" onchange="localData.rundown[${i}].person=this.value; renderAll()">${staffOptions.replace(`value="${item.person}"`, `value="${item.person}" selected`)}</select>` 
                        : `<div class="text-[11px] font-bold p-1 ${item.person.includes('全選')?'bg-black text-white':''}">${item.person || '-'}</div>`}
                    </td>
                    <td class="border border-black text-center">${item.checkin ? `<span class="font-bold">✅${item.checkin}</span>` : `<button onclick="doCheckIn(${i})" class="border border-black px-2 py-0.5 text-[10px]">簽到</button>`}</td>
                    <td class="border border-black admin-only text-center"><button onclick="localData.rundown.splice(${i}, 1); renderAll()" class="text-rose-500 font-bold">✕</button></td>
                `;
                tbody.appendChild(tr);

                // 名片模式
                const card = document.createElement('div');
                card.className = `p-4 border-2 border-black ${isActive?'bg-slate-100':''}`;
                card.innerHTML = `<div class="flex justify-between font-black"><span>${item.t} (${item.d}m)</span><span>${item.u}</span></div>
                                  <div class="text-sm border-t border-black mt-2 pt-2">${item.s}</div>
                                  <div class="flex justify-between mt-3 italic text-xs">
                                      <span>簽到: ${item.checkin||'---'}</span>
                                      <span class="font-black border-b border-black">${item.person}</span>
                                  </div>`;
                cardContainer.appendChild(card);
            });
            renderEq();
        };

        window.updateTime = (i, val) => {
            const parts = val.replace(')', '').split('(');
            localData.rundown[i].t = parts[0].trim();
            localData.rundown[i].d = parts[1] || "10";
            renderAll();
        };

        window.renderEq = () => {
            ['service', 'stage'].forEach(z => {
                document.getElementById(z+'Tags').innerHTML = localData.memory.map(m => `<span class="memory-tag" onclick="useMemory('${z}','${m}')">${m}</span>`).join('');
                document.getElementById(z+'Box').innerHTML = localData.eq[z].map((e, idx) => `
                    <div class="flex items-center gap-2 border-b border-black pb-1 mb-1">
                        <input type="checkbox" class="w-4 h-4" ${e.l?'checked':''} onchange="localData.eq['${z}'][${idx}].l=!localData.eq['${z}'][${idx}].l; renderEq(); if(!isAdmin) saveToCloud();">
                        <input type="text" class="flex-1 text-sm font-bold bg-transparent outline-none" value="${e.n}" onchange="updateEqName('${z}',${idx},this.value)" ${!isAdmin?'readonly':''}>
                        <input type="number" class="w-10 text-center font-bold bg-transparent" value="${e.q}" onchange="localData.eq['${z}'][${idx}].q=this.value; renderEq()" ${!isAdmin?'readonly':''}>
                        ${isAdmin ? `<button onclick="localData.eq['${z}'].splice(${idx},1); renderEq()" class="text-xs">✕</button>` : ''}
                    </div>
                `).join('');
            });
        };

        window.useMemory = (z, val) => { if(!isAdmin) return; localData.eq[z].push({n:val, q:1, l:false}); renderEq(); };
        window.updateEqName = (z, idx, val) => { localData.eq[z][idx].n = val; if(val && !localData.memory.includes(val)) localData.memory.push(val); renderEq(); };
        window.addEqRow = (z) => { localData.eq[z].push({n:"", q:1, l:false}); renderEq(); };
        window.doCheckIn = (i) => { const n = new Date(); localData.rundown[i].checkin = n.getHours()+":"+String(n.getMinutes()).padStart(2,'0'); renderAll(); if(!isAdmin) saveToCloud(); };
        window.toggleCardView = () => { isCardView = !isCardView; document.body.classList.toggle('card-view', isCardView); document.getElementById('viewBtn').innerText = isCardView ? "表格模式" : "名片模式"; renderAll(); };
        window.handleAdminSwitch = () => { if(!isAdmin && prompt("管理密碼") !== "364401") return; isAdmin = !isAdmin; document.body.classList.toggle('admin-mode', isAdmin); document.getElementById('modeBtn').innerText = isAdmin ? "結束後台" : "後台模式"; renderAll(); };
        window.addNewRow = () => { localData.rundown.push({t:"", d:"10", u:"新單元", s:"", person:"", checkin:""}); renderAll(); };
        window.saveToCloud = () => { set(dataRef, localData).then(() => alert("✅ Ver. 2 資料已更新同步")); };
        onValue(dataRef, (snap) => { if(!isAdmin) { const d = snap.val(); if(d) { localData = d; renderAll(); } } });
        
        renderAll();
    </script>
</body>
</html>
