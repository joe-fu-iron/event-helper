<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 活動執行控台 (整合版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background: #f1f5f9; transition: background 0.3s; }
        /* 後台樣式 */
        .admin-view .rundown-table { width: 100%; border-collapse: collapse; background: white; table-layout: fixed; }
        .admin-view .rundown-table th, .admin-view .rundown-table td { border: 1px solid #000; padding: 5px; vertical-align: middle; }
        .col-time { width: 85px; } .col-dur { width: 50px; } .col-unit { width: 150px; } .col-job { width: 220px; }
        .equipment-tag { display: inline-flex; align-items: center; background: white; border: 1px solid #000; padding: 2px 6px; border-radius: 4px; margin: 2px; font-size: 12px; }
        .num-input { width: 35px; border-bottom: 1px solid black; text-align: center; background: transparent; }
        /* 前台樣式 (深色高對比) */
        .live-view { background: #0f172a; color: white; }
        .live-card { background: #1e293b; border-radius: 12px; padding: 18px; margin-bottom: 12px; border-left: 8px solid #475569; transition: all 0.4s; }
        .live-card.active { border-left-color: #22c55e; background: #064e3b; transform: scale(1.02); box-shadow: 0 0 20px rgba(34, 197, 94, 0.4); }
        .live-time { font-size: 1.8rem; font-weight: 900; color: #fbbf24; line-height: 1; }
        .live-unit { font-size: 1.5rem; font-weight: 900; color: white; margin: 4px 0; }
        .live-job { font-size: 1rem; color: #94a3b8; font-weight: bold; }
        /* 隱藏與顯示 */
        .view-section { display: none; }
        .view-active { display: block; }
        @media print { .no-print { display: none !important; } body { background: white !important; } }
    </style>
</head>
<body class="admin-mode">

    <nav class="sticky top-0 z-[100] bg-slate-900 text-white p-3 flex justify-between items-center no-print shadow-xl">
        <div class="flex items-center gap-2">
            <span id="syncStatus" class="text-[10px] px-2 py-0.5 border rounded border-slate-700 text-slate-500 font-bold">SYNCING...</span>
            <h1 id="viewTitle" class="font-black text-xs tracking-tighter">後台管理模式</h1>
        </div>
        <div class="flex gap-2">
            <button onclick="switchView('admin')" class="bg-slate-700 px-3 py-1.5 rounded text-xs font-bold border border-slate-600">🛠️ 進入後台</button>
            <button onclick="switchView('live')" class="bg-orange-600 px-3 py-1.5 rounded text-xs font-bold shadow-lg">📱 執行前台</button>
        </div>
    </nav>

    <main id="adminSection" class="view-section view-active p-2 md:p-4 admin-view">
        <div class="max-w-[1500px] mx-auto bg-white p-4 shadow-2xl rounded-xl">
            <div class="flex justify-between items-center mb-4 border-b-4 border-orange-500 pb-2">
                <h2 class="text-xl font-black text-orange-700">2026 活動執行細部流程表 (17:00 工作段)</h2>
                <div class="flex gap-2 no-print">
                    <button id="btnSave" class="bg-orange-600 text-white px-5 py-2 rounded-lg font-black shadow-lg hover:bg-orange-700 transition">💾 儲存並同步</button>
                    <button onclick="window.print()" class="bg-slate-700 text-white px-4 py-2 rounded-lg font-bold shadow hover:bg-slate-800 transition">🖨️ 列印</button>
                </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4 text-sm bg-slate-100 p-3 rounded-lg border">
                <div>主題：<input type="text" id="eventTitle" class="border-b-2 border-slate-300 bg-transparent w-full outline-none focus:border-orange-500 font-bold"></div>
                <div>日期：<input type="date" id="eventDate" class="border-b-2 border-slate-300 bg-transparent outline-none focus:border-orange-500 font-bold"></div>
                <div>地點：<input type="text" id="eventLocation" class="border-b-2 border-slate-300 bg-transparent w-full outline-none focus:border-orange-500 font-bold"></div>
                <div>主持：<input type="text" id="headerHost" class="border-b-2 border-slate-300 bg-transparent w-full outline-none focus:border-orange-500 font-bold"></div>
            </div>

            <div class="p-3 bg-orange-50 rounded-lg border border-orange-200 mb-4">
                <span class="font-black text-orange-800 text-xs block mb-2 tracking-widest">👥 核心工作人員配置 (不含工讀生)：</span>
                <div class="grid grid-cols-2 md:grid-cols-8 gap-2" id="staffConfig"></div>
            </div>

            <table class="rundown-table mb-4 shadow-sm">
                <thead class="bg-slate-800 text-white text-xs">
                    <tr><th class="col-time">時間</th><th class="col-dur">長度</th><th class="col-unit">單元項目</th><th>執行說明</th><th class="col-job">負責人 (自動展開)</th></tr>
                </thead>
                <tbody id="rundownBody"></tbody>
            </table>

            <div class="flex gap-4 mb-8 no-print">
                <button id="btnAddRow" class="bg-slate-800 text-white px-8 py-3 rounded-xl font-black shadow-lg hover:bg-slate-700">+ 新增流程</button>
                <button id="btnDelRow" class="bg-red-50 text-red-600 border border-red-200 px-4 py-2 rounded-xl font-bold hover:bg-red-100">🗑️ 刪最後一行</button>
            </div>

            <div class="border-t-2 pt-6">
                <h3 class="font-black text-lg text-blue-900 mb-2 tracking-tight">📋 器材清單編輯 (點擊下方按鈕加入)</h3>
                <div class="no-print bg-slate-100 p-3 rounded-lg mb-4 text-xs">
                    <div class="mb-3"><strong>服務台：</strong><div id="serviceMenu" class="flex flex-wrap gap-2 mt-2"></div></div>
                    <div><strong>舞台區：</strong><div id="stageMenu" class="flex flex-wrap gap-2 mt-2"></div></div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                    <div class="border-2 p-4 rounded-xl bg-white shadow-sm"><strong>📍 服務台清點：</strong><div id="serviceContainer" class="flex flex-wrap mt-2"></div></div>
                    <div class="border-2 p-4 rounded-xl bg-white shadow-sm"><strong>📍 舞台區清點：</strong><div id="stageContainer" class="flex flex-wrap mt-2"></div></div>
                </div>
            </div>
        </div>
    </main>

    <main id="liveSection" class="view-section p-4 live-view">
        <div class="mb-6">
            <h2 id="liveEventTitle" class="text-3xl font-black text-orange-400">LOADING...</h2>
            <p id="liveEventInfo" class="text-slate-400 text-sm font-bold uppercase tracking-wider mt-2 border-l-4 border-orange-600 pl-2"></p>
        </div>
        <div class="mb-10">
            <h3 class="text-xs font-black text-slate-500 mb-4 tracking-[0.2em] border-b border-slate-800 pb-1">LIVE RUNDOWN / 現場流程</h3>
            <div id="liveRundownContainer"></div>
        </div>
        <div class="grid grid-cols-1 gap-8 mb-10">
            <div><h3 class="text-xs font-black text-blue-400 mb-3 tracking-widest border-b border-slate-800 pb-1">SERVICE CHECK / 服務台</h3><div id="liveServiceContainer" class="space-y-2"></div></div>
            <div><h3 class="text-xs font-black text-purple-400 mb-3 tracking-widest border-b border-slate-800 pb-1">STAGE CHECK / 舞台區</h3><div id="liveStageContainer" class="space-y-2"></div></div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://rundown-worker-default-rtdb.firebaseio.com/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dataRef = ref(db, 'rundown_v2026_final');

        const menuItems = {
            service: ["長官簽到表一式", "長官勾選表", "瓶水*{手動}", "餐盒*{手動}", "簽到箱*1式", "新聞資料*{手動}", "黃桌巾*{手動}", "紅桌巾*{手動}", "伴手禮*{手動}"],
            stage: ["音響+電腦1式", "TRUSS*{手動}", "斜撐*{手動}", "鐵板*{手動}", "帆布+豆扣*All", "紅桌巾*{手動}", "濕紙巾*{手動}", "衛生紙*{手動}", "手板*{手動}", "木架*{手動}"]
        };

        // --- 前後台切換密碼鎖 ---
        window.switchView = (mode) => {
            if (mode === 'admin') {
                const pw = prompt("請輸入後台管理密碼：");
                if (pw !== "364401") {
                    alert("密碼錯誤，拒絕進入編輯模式！");
                    return;
                }
            }
            document.getElementById('adminSection').style.display = (mode === 'admin') ? 'block' : 'none';
            document.getElementById('liveSection').style.display = (mode === 'live') ? 'block' : 'none';
            document.body.className = (mode === 'live') ? 'live-view' : 'admin-mode';
            document.getElementById('viewTitle').innerText = (mode === 'live') ? "📱 前台執行模式" : "🛠️ 後台管理模式";
        };

        // --- 初始化人員配置介面 ---
        const staffConfig = document.getElementById('staffConfig');
        for(let i=1; i<=8; i++) {
            staffConfig.innerHTML += `
                <div class="bg-white p-2 border rounded shadow-sm">
                    <select id="j${i}" class="w-full text-[10px] border mb-1" onchange="window.updateAllSelects()">
                        <option value="-">-</option><option value="控場">控場</option><option value="音響">音響</option>
                        <option value="服務台">服務台</option><option value="攝影">攝影</option><option value="manual">(自訂)</option>
                    </select>
                    <input type="text" id="cj${i}" placeholder="工項" class="w-full text-[10px] border-b hidden mb-1" oninput="window.updateAllSelects()">
                    <input type="text" id="s${i}" placeholder="姓名" class="w-full text-[10px] border-b" oninput="window.updateAllSelects()">
                </div>`;
        }

        // --- 全域函數定義 ---
        window.getStaffList = () => {
            const list = [];
            for(let i=1; i<=8; i++) {
                const j = document.getElementById(`j${i}`).value, s = document.getElementById(`s${i}`).value, cj = document.getElementById(`cj${i}`).value;
                document.getElementById(`cj${i}`).style.display = (j === "manual") ? "block" : "none";
                if(j === "manual" && cj) list.push(`${cj}(${s})`); else if(j !== "-") list.push(`${j}(${s})`);
            }
            return list;
        };

        window.calculateAllTimes = () => {
            let nextT = "";
            document.querySelectorAll("#rundownBody tr").forEach((row, i) => {
                const dur = parseInt(row.querySelector(".duration").value) || 0;
                let start = (i === 0) ? (row.querySelector(".start-time")?.value || "09:00") : nextT;
                if(start.includes(":")) {
                    let [h, m] = start.split(":").map(Number);
                    let em = m + dur; let eh = (h + Math.floor(em / 60)) % 24;
                    let endStr = `${String(eh).padStart(2,'0')}:${String(em % 60).padStart(2,'0')}`;
                    if(i !== 0) row.querySelector(".row-start").innerText = start;
                    row.querySelector(".row-end").innerText = "Ends: " + endStr;
                    nextT = endStr;
                }
            });
        };

        window.updateAllSelects = () => {
            const staff = window.getStaffList();
            document.querySelectorAll("#rundownBody tr").forEach(row => {
                row.querySelectorAll(".job-sel").forEach(sel => {
                    const saved = sel.getAttribute('data-val') || sel.value;
                    sel.innerHTML = `<option value="">- 選取 -</option>` + staff.map(s => `<option value="${s}" ${s===saved?'selected':''}>${s}</option>`).join('');
                });
            });
        };

        window.addEquipment = (containerId, template, savedQty = "") => {
            const container = document.getElementById(containerId);
            const name = template.split('*')[0], isManual = template.includes('{手動}');
            const tag = document.createElement('div'); tag.className = 'equipment-tag shadow-sm';
            tag.innerHTML = `<b>${name}</b>${isManual ? `*<input type="text" class="num-input ml-1" value="${savedQty}">` : ''}<button class="ml-1 text-red-400 font-bold no-print" onclick="this.parentElement.remove()">✕</button>`;
            container.appendChild(tag);
        };

        window.addRow = (isFirst = false, saved = null) => {
            const tbody = document.getElementById("rundownBody");
            const tr = document.createElement("tr");
            let jobOptions = "";
            const staff = window.getStaffList();
            for(let i=0; i<4; i++) {
                const val = saved?.jobs?.[i] || "";
                jobOptions += `
                <div class="mb-1">
                    <select class="job-sel w-full text-[10px] border no-print" data-val="${val}" onchange="this.setAttribute('data-val', this.value)">
                        <option value="">- 選取 -</option>
                        ${staff.map(s => `<option value="${s}" ${s===val?'selected':''}>${s}</option>`).join('')}
                    </select>
                </div>`;
            }
            tr.innerHTML = `
                <td class="text-center">
                    ${isFirst ? `<input type="text" class="start-time w-full text-center font-bold bg-yellow-50" value="${saved?.startTime||'09:00'}" oninput="calculateAllTimes()">` : '<span class="row-start font-bold text-orange-600"></span>'}
                    <div class="row-end text-[9px] text-gray-400 mt-1"></div>
                </td>
                <td><input type="number" class="duration w-full text-center border-b" value="${saved?.duration||10}" oninput="calculateAllTimes()"></td>
                <td contenteditable="true" class="unit-cell font-bold px-1 text-blue-900">${saved?.unit||''}</td>
                <td contenteditable="true" class="desc-cell text-xs px-1 text-gray-500 outline-none">${saved?.desc||''}</td>
                <td class="col-job">${jobOptions}</td>`;
            tbody.appendChild(tr);
            window.calculateAllTimes();
        };

        // --- 按鈕事件綁定 ---
        document.getElementById('btnAddRow').onclick = () => window.addRow(document.querySelectorAll("#rundownBody tr").length === 0);
        document.getElementById('btnDelRow').onclick = () => { if(confirm("確定刪除最後一行？")) { document.getElementById("rundownBody").lastElementChild?.remove(); window.calculateAllTimes(); } };
        
        document.getElementById('btnSave').onclick = () => {
            const data = {
                title: document.getElementById('eventTitle').value,
                date: document.getElementById('eventDate').value,
                location: document.getElementById('eventLocation').value,
                host: document.getElementById('headerHost').value,
                staffConfig: {}, rundown: [], service: [], stage: []
            };
            for(let i=1; i<=8; i++) data.staffConfig[i] = {j: document.getElementById(`j${i}`).value, cj: document.getElementById(`cj${i}`).value, s: document.getElementById(`s${i}`).value};
            document.querySelectorAll("#rundownBody tr").forEach(row => {
                data.rundown.push({
                    startTime: row.querySelector(".start-time")?.value || row.querySelector(".row-start").innerText,
                    endTime: row.querySelector(".row-end").innerText.replace("Ends: ", ""),
                    duration: row.querySelector(".duration").value,
                    unit: row.querySelector(".unit-cell").innerText,
                    desc: row.querySelector(".desc-cell").innerText,
                    jobs: Array.from(row.querySelectorAll(".job-sel")).map(s => s.getAttribute('data-val') || s.value).filter(v => v && v !== "")
                });
            });
            document.querySelectorAll('#serviceContainer .equipment-tag').forEach(el => data.service.push({t: el.querySelector('b').innerText+(el.querySelector('input')?"*{手動}":""), q: el.querySelector('input')?.value||""}));
            document.querySelectorAll('#stageContainer .equipment-tag').forEach(el => data.stage.push({t: el.querySelector('b').innerText+(el.querySelector('input')?"*{手動}":""), q: el.querySelector('input')?.value||""}));
            set(dataRef, data).then(() => alert("✅ 數據已發布！所有工作人員手機將同步更新。"));
        };

        // --- Firebase
