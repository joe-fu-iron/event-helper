<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>執行製作控管台 v46.8</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
    :root { --win-blue: #0078D4; --win-border: #D1D1D1; }
    body { font-family: 'Noto Sans TC', sans-serif; background: #f8fafc; padding-bottom: 60px; }

    /* 左右滑動開關 */
    .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.2); transition: .4s; border-radius: 20px; border: 1px solid rgba(255,255,255,0.3); }
    .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #4ade80; border-color: #22c55e; }
    input:checked + .slider:before { transform: translateX(16px); }

    /* UI 樣式 */
    .app-header { background: var(--win-blue); color: #FFF; height: 60px; display: flex; align-items: center; padding: 0 16px; position: sticky; top: 0; z-index: 1000; }
    .header-input { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); padding: 4px 8px; border-radius: 4px; font-weight: 700; color: #FFF; outline: none; }
    #staffBoard { background: linear-gradient(135deg, #1e3a5f 0%, #0078D4 100%); }

    /* 表格樣式 */
    .pro-table { width: 100%; border-collapse: collapse; background: white; border: 1.5px solid #000; }
    .pro-table th { background: #F3F3F3; padding: 12px 10px; border: 1px solid #000; font-weight: 900; }
    .pro-table td { border: 1px solid #000; padding: 10px; }

    .admin-ctrl { display: none !important; }
    .admin-mode .admin-ctrl { display: block !important; }
    
    /* 器材區格位優化 */
    .equip-grid { border: 2px solid #000; background: #fff; width: 100%; margin-top: 15px; }
    .equip-label { background: #f8fafc; border-right: 2px solid #000; width: 100px; text-align: center; font-weight: 900; vertical-align: middle; }
    .equip-content { padding: 10px; }

    /* 列印優化 */
    @media print {
        @page { size: A4 landscape; margin: 0.5cm; }
        .no-print, .admin-ctrl, button, .switch { display: none !important; }
        .app-header { background: white !important; color: black !important; position: static; border-bottom: 3px solid black; }
        .header-input { color: black !important; border: none !important; font-size: 28px !important; }
        .pro-table td, .equip-content { font-size: 18px !important; font-weight: 700 !important; }
        input, textarea { border: none !important; }
    }
</style>
</head>
<body class="admin-mode">

<header class="app-header shadow-xl no-print">
  <div class="max-w-7xl mx-auto w-full flex items-center justify-between gap-2">
    <div class="flex items-center gap-2 flex-1 min-w-0">
      <input type="date" id="eventDate" class="header-input text-xs" onchange="saveData()">
      <input type="text" id="eventName" class="header-input border-none bg-transparent flex-1 font-black" onblur="saveData()">
    </div>
    <div class="flex items-center gap-4 shrink-0">
      <button onclick="toggleCheckinPanel()" id="checkinToggleBtn" class="hdr-btn bg-white/10 px-3 py-1 rounded text-[11px] font-bold">簽到</button>
      <div class="flex items-center gap-1"><span class="text-[9px] font-bold opacity-60">手機</span><label class="switch"><input type="checkbox" onchange="toggleMobileView(this.checked)"><span class="slider"></span></label></div>
      <div class="flex items-center gap-1"><span class="text-[9px] font-bold opacity-60">編輯</span><label class="switch"><input type="checkbox" checked onchange="toggleAdmin(this.checked)"><span class="slider"></span></label></div>
      <button onclick="window.print()" class="bg-orange-500 px-3 py-1.5 rounded text-[11px] font-black text-white">🖨️ PDF</button>
    </div>
  </div>
</header>

<div id="staffBoard" class="px-4 py-4"><div id="staffBoardCards" class="max-w-7xl mx-auto flex flex-wrap gap-2"></div></div>

<main class="max-w-7xl mx-auto p-4">
    <div id="desktopView">
        <section class="admin-ctrl bg-white p-4 rounded-xl border mb-6 no-print">
            <div id="jobOptions" class="flex flex-wrap gap-1 mb-2"></div>
            <div id="nameOptions" class="flex flex-wrap gap-1 mb-4 border-b pb-4"></div>
            <div id="staffList" class="flex flex-wrap gap-2"></div>
        </section>
        <table class="pro-table">
            <thead><tr><th class="w-24">開始</th><th class="w-16">分</th><th class="w-1/3">執行單元</th><th>詳細說明</th><th class="w-40 text-right">負責人</th><th class="w-10 admin-ctrl"></th></tr></thead>
            <tbody id="rundownBody"></tbody>
        </table>
        <button onclick="addRow()" class="admin-ctrl w-full py-4 mt-3 border-2 border-dashed rounded-xl font-black text-slate-400">+ 增加新單元</button>
    </div>

    <div id="mobileView" class="hidden"><div id="mobileRundown" class="space-y-3"></div></div>

    <table class="equip-grid">
        <tr>
            <td class="equip-label">服務台</td>
            <td class="equip-content">
                <div id="list-service" class="flex flex-wrap gap-x-4 gap-y-2"></div>
                <button onclick="addItem('service')" class="admin-ctrl text-blue-500 text-xs mt-2 font-bold">+ 增加服務台項目</button>
            </td>
        </tr>
        <tr>
            <td class="equip-label">舞 台</td>
            <td class="equip-content">
                <div id="list-stage" class="flex flex-wrap gap-x-4 gap-y-2"></div>
                <button onclick="addItem('stage')" class="admin-ctrl text-orange-500 text-xs mt-2 font-bold">+ 增加舞台項目</button>
            </td>
        </tr>
    </table>

    <div class="mt-4 bg-white p-4 border-2 border-black">
        <div class="text-[10px] font-black uppercase mb-2">備註事項 / Notes</div>
        <textarea id="eventNotes" class="w-full h-24 text-sm outline-none bg-transparent resize-none leading-relaxed" placeholder="輸入其他重要交代事項..." onblur="saveData()"></textarea>
    </div>
</main>

<script>
    const JOBS = ["控場","音響","服務台","儀式","攝影","機動","視訊"];
    const NAMES = ["江哥","瑩驊","維憶","芳瑜","智明","鐵仁","柏緯","崧瑋"];
    let selectedJob = "";
    let localData = {
        eventDate: "2026-03-28", eventName: "2026 社區遺產節", staff: [],
        rundown: [{s:"09:00", l:10, u:"進場準備", d:"物資就位", persons:[]}],
        equip: {
            service: ["簽到表+勾選表 1 式", "新聞資料 10 份", "餐盒 50", "瓶水 2 箱", "扇子？"],
            stage: ["Truss6*3(2m*10、1m*4、骰*8、活頁片*4、斜撐*4)", "鐵板*4", "斜撐*4", "沙袋*8", "繩子*all", "帆布 630*300", "豆扣*3 大把", "音響 1 式", "長桌*4 椅子 40 張(用公所的)", "延長線*1 大捲", "紅地毯*2 捲", "紅地膠*4 大捲", "畫架*1", "手拿牌*10", "短桌*2(音響及聽團包用)"]
        },
        notes: ""
    };

    function toggleAdmin(c) { document.body.classList.toggle('admin-mode', c); renderAll(); }
    function toggleMobileView(c) { 
        document.getElementById('desktopView').classList.toggle('hidden', c);
        document.getElementById('mobileView').classList.toggle('hidden', !c);
        renderAll();
    }

    function renderAll() {
        const isAdmin = document.body.classList.contains('admin-mode');
        document.getElementById('eventDate').value = localData.eventDate;
        document.getElementById('eventName').value = localData.eventName;
        
        // 看板
        document.getElementById('staffBoardCards').innerHTML = localData.staff.map(s => `<div class="bg-white/10 border border-white/20 rounded px-3 py-1 text-center min-w-[80px]"><div class="text-[9px] text-white/50">${s.j}</div><div class="font-black text-white text-sm">${s.n}</div></div>`).join('');
        document.getElementById('jobOptions').innerHTML = JOBS.map(j => `<button class="px-2 py-1 border text-[10px] rounded ${selectedJob===j?'bg-blue-600 text-white':'bg-white'}" onclick="selectedJob='${j}';renderAll()">${j}</button>`).join('');
        document.getElementById('nameOptions').innerHTML = NAMES.map(n => `<button class="px-2 py-1 border text-[10px] rounded bg-white" onclick="addStaff('${n}')">${n}</button>`).join('');
        document.getElementById('staffList').innerHTML = localData.staff.map((s,i) => `<div class="bg-blue-50 text-blue-700 px-2 py-1 rounded text-[10px] font-bold">${s.n}(${s.j}) ${isAdmin?`<span onclick="localData.staff.splice(${i},1);saveData();renderAll()">✕</span>`:''}</div>`).join('');

        // 流程
        document.getElementById('rundownBody').innerHTML = localData.rundown.map((row, i) => `<tr><td class="text-center font-black"><input class="w-full text-center" value="${row.s}" onchange="updateRow(${i},'s',this.value)"></td><td class="text-center text-blue-600 font-black bg-blue-50/20"><input class="w-full text-center" value="${row.l}" onchange="updateRow(${i},'l',this.value)"></td><td><input class="w-full font-black outline-none" value="${row.u}" onblur="updateRow(${i},'u',this.value)"></td><td><input class="w-full text-slate-500 outline-none" value="${row.d||''}" onblur="updateRow(${i},'d',this.value)"></td><td class="text-right text-[10px] font-black text-blue-600">${row.persons.join(', ')}</td><td class="admin-ctrl"><button onclick="localData.rundown.splice(${i},1);saveData();renderAll()">✕</button></td></tr>`).join('');

        // 器材 (行列式呈現)
        ['service', 'stage'].forEach(type => {
            document.getElementById(`list-${type}`).innerHTML = localData.equip[type].map((item, idx) => `
                <div class="flex items-center gap-1 border border-slate-100 px-2 py-1 rounded bg-slate-50">
                    <span class="text-slate-300">□</span>
                    <input class="text-sm bg-transparent outline-none w-auto min-w-[50px]" value="${item}" onblur="localData.equip['${type}'][${idx}]=this.value;saveData()" size="${item.length + 2}">
                    ${isAdmin?`<span class="text-red-200 cursor-pointer admin-ctrl" onclick="localData.equip['${type}'].splice(${idx},1);renderAll()">✕</span>`:''}
                </div>`).join('');
        });
    }

    function addStaff(n) { if(!selectedJob) return alert("先選職稱"); localData.staff.push({n, j:selectedJob}); saveData(); renderAll(); }
    function updateRow(i, f, v) { localData.rundown[i][f] = v; saveData(); }
    function addRow() { localData.rundown.push({s:"09:00", l:10, u:"", d:"", persons:[]}); renderAll(); }
    function addItem(type) { localData.equip[type].push("新項目"); renderAll(); }
    
    function saveData() {
        localData.eventDate = document.getElementById('eventDate').value;
        localData.eventName = document.getElementById('eventName').value;
        localData.notes = document.getElementById('eventNotes').value;
        localStorage.setItem('v46_8_save', JSON.stringify(localData));
    }

    window.onload = () => {
        const saved = localStorage.getItem('v46_8_save');
        if (saved) {
            localData = JSON.parse(saved);
            document.getElementById('eventNotes').value = localData.notes || "";
        }
        renderAll();
    };
</script>
</body>
</html>
