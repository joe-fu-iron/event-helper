<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>執行製作旗艦控管台 v53</title>
    <script src="https://cdn.tailwindcss.com"></script>
    </head>
<body class="admin-mode">

<div id="passwordGate">
    <div class="password-container">
        <span class="password-icon">🔐</span>
        <div class="password-title">執行製作控管台</div>
        <div class="password-subtitle">此專案已與雲端資料庫連結，請驗證</div>
        <input type="password" id="passwordInput" class="password-input" placeholder="輸入密碼">
        <button onclick="loginAndSync()" id="loginBtn" class="password-btn">同步資料並進入</button>
        <div id="errorMsg" class="hidden text-red-500 mt-3 font-bold">❌ 驗證失敗</div>
    </div>
</div>

<div id="appInterface" class="hidden">
    </div>

<script>
// ⚠️ 重要：請貼上你剛才從 GAS 獲得的 URL
const DB_URL = "你的_GAS_網頁應用程式_URL";
let AUTH_PWD = "";

// 登入並同步資料
async function loginAndSync() {
    const pwd = document.getElementById('passwordInput').value;
    const btn = document.getElementById('loginBtn');
    
    btn.innerText = "安全性驗證中...";
    btn.disabled = true;

    try {
        const response = await fetch(DB_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'load', password: pwd })
        });
        const result = await response.json();

        if (result.success) {
            AUTH_PWD = pwd; // 存入記憶體供後續存檔使用
            document.getElementById('passwordGate').classList.add('hidden');
            document.getElementById('appInterface').classList.remove('hidden');
            
            // 如果雲端有資料，則載入
            if(result.data) {
                loadDataIntoUI(result.data); 
            }
        } else {
            alert("密碼不正確，無法讀取資料庫");
            btn.innerText = "同步資料並進入";
            btn.disabled = false;
        }
    } catch (e) {
        alert("資料庫連線失敗，請檢查網路或 GAS 部署設定");
    }
}

// 💾 修改原本的 saveData 函式，同步到雲端
async function saveData() {
    if (!AUTH_PWD) return; // 未驗證不存檔

    const currentData = {
        eventName: document.getElementById('eventName').value,
        eventDate: document.getElementById('eventDate').value,
        // ... 其他你想存的資料欄位
    };

    fetch(DB_URL, {
        method: 'POST',
        body: JSON.stringify({ 
            action: 'save', 
            password: AUTH_PWD, 
            payload: currentData 
        })
    });
    
    console.log("資料已同步至雲端");
}

// [其餘你原本控制表格、UI 的 JS 函式也請保留在這裡]
</script>
</body>
</html>
