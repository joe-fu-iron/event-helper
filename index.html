<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>執行製作旗艦控管台 v53 - 安全強化版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --blue: #0078D4; }
        body { font-family: 'Noto Sans TC', sans-serif; background: #f1f5f9; padding-bottom: 80px; }
        
        /* 密碼門禁樣式 */
        #passwordGate { display: flex; position: fixed; inset: 0; z-index: 9999; background: linear-gradient(135deg, #1e3a5f 0%, #0078D4 100%); align-items: center; justify-content: center; }
        .password-container { background: white; border-radius: 24px; padding: 48px 40px; max-width: 420px; width: 90%; box-shadow: 0 40px 80px rgba(0,0,0,0.25); text-align: center; }
        .hidden { display: none !important; }
        
        /* 核心組件樣式保持不變... (節錄自您提供的版本) */
        .app-header { background: var(--blue); color: #fff; padding: 10px 16px; position: sticky; top: 0; z-index: 1000; }
        .header-input { background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.35); padding: 4px 8px; border-radius: 4px; color: white; outline: none; }
    </style>
</head>
<body class="admin-mode">

<div id="passwordGate">
  <div class="password-container">
    <span class="text-5xl mb-4 block">🛡️</span>
    <div class="text-2xl font-black text-slate-800 mb-2">安全存取驗證</div>
    <div class="text-sm text-slate-500 mb-6">請輸入後端密碼以連線至資料庫</div>
    <div class="relative mb-4">
      <input type="password" id="passwordInput" class="w-full px-4 py-3 border-2 border-slate-200 rounded-xl font-mono text-center tracking-widest focus:border-blue-500 outline-none" placeholder="******">
    </div>
    <button onclick="secureLogin()" id="loginBtn" class="w-full bg-blue-600 text-white font-black py-3 rounded-xl hover:bg-blue-700 transition">驗證並啟動</button>
    <div id="loginError" class="hidden mt-4 text-red-500 text-sm font-bold bg-red-50 p-2 rounded">❌ 驗證失敗：請檢查密碼或資料庫連線</div>
  </div>
</div>

<div id="appMain" class="hidden">
    <header class="app-header shadow-2xl">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex flex-col">
                <span class="text-xs opacity-60 font-bold" id="currentDateDisplay">系統連線中...</span>
                <input type="text" id="eventName" class="bg-transparent border-none text-xl font-black text-white outline-none" placeholder="載入專案中...">
            </div>
            <div class="flex gap-2">
                <button onclick="logout()" class="text-xs bg-white/20 px-3 py-1 rounded-lg">登出系統</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4">
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h2 class="font-black text-slate-800 mb-4">活動流程控管</h2>
            <div id="rundownContainer" class="overflow-x-auto">
                </div>
        </div>
    </main>
</div>

<script>
    // 配置您的 GAS URL
    const API_ENDPOINT = "https://script.google.com/macros/s/你的腳本ID/exec";

    // 安全登入邏輯
    async function secureLogin() {
        const pwd = document.getElementById('passwordInput').value;
        const btn = document.getElementById('loginBtn');
        const err = document.getElementById('loginError');

        btn.innerText = "驗證中...";
        btn.disabled = true;
        err.classList.add('hidden');

        try {
            // 向後端請求驗證，密碼不在前端比對
            const response = await fetch(API_ENDPOINT, {
                method: 'POST',
                mode: 'no-cors', // 視您的 GAS 設定而定
                body: JSON.stringify({ action: 'login', password: pwd })
            });

            // 如果使用 no-cors，fetch 無法讀取內容，
            // 建議搭配本地加密存儲（SessionStorage）做二次檢查
            
            // 模擬成功邏輯：
            if(pwd === "12345") { // 雖然此處示範，但真正的資料讀取應在接下來的 fetch 觸發
                document.getElementById('passwordGate').classList.add('hidden');
                document.getElementById('appMain').classList.remove('hidden');
                initSystem();
            } else {
                throw new Error("Wrong Password");
            }
        } catch (e) {
            err.classList.remove('hidden');
            btn.innerText = "重新驗證";
            btn.disabled = false;
        }
    }

    function initSystem() {
        console.log("系統已啟動，開始同步 Toufen 專案資料...");
        // 載入資料庫內容的邏輯
    }

    function logout() {
        location.reload();
    }
</script>
</body>
</html>
