<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 執行流程控台-終極優化版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background: #f8fafc; color: #1e293b; transition: 0.3s; }
        body.admin-mode { background: #fffbeb; } 
        .is-now { background: #f0fdf4 !important; border-left: 8px solid #22c55e !important; }
        
        /* 表格與字體統一 */
        .rundown-table { width: 100%; border-collapse: collapse; background: white; }
        .rundown-table th, .rundown-table td { border: 1px solid #cbd5e1; padding: 12px 8px; vertical-align: middle; }
        .table-head { background: #334155; color: white; font-size: 14px; font-weight: bold; }
        
        /* 統一字體大小與粗細 */
        .cell-content { font-weight: bold; font-size: 15px; line-height: 1.5; }
        .col-unit { color: #1e293b; width: auto; min-width: 160px; }
        .col-desc { color: #475569; width: auto; min-width: 250px; }

        .time-range { font-family: monospace; font-weight: bold; color: #2563eb; font-size: 15px; }
        .duration-tag { font-size: 12px; color: #94a3b8; font-weight: normal; margin-left: 4px; }
        
        .job-tag { display: inline-block; background: #e2e8f0; color: #475569; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin: 2px; font-weight: bold; }
        body.admin-mode .job-tag { cursor: pointer; border: 1px dashed #cbd5e1; }
        body.admin-mode .job-tag:hover { background: #fecaca; color: #991b1b; }

        .admin-only { display: none !important; }
        body.admin-mode .admin-only { display: block !important; }
        
        #displayHeader { display: none; }
        body.view-mode #displayHeader { display: block; border-bottom: 4px solid #334155; margin-bottom: 20px; padding-bottom: 10px; }

        @media print {
            .no-print, button, #staffConfig, input, select { display: none !important; }
            body { background: white !important; padding: 0; }
            #displayHeader { display: block !important; }
            .rundown-table { width: 100% !important; border: 2px solid black; }
            .rundown-table th, .rundown-table td { border: 1px solid black !important; color: black !important; }
        }
    </style>
</head>
<body class="view-mode p-2 md:p-6 pb-20">

    <div class="max-w-[1500px] mx-auto">
        <div id="displayHeader" class="no-print">
            <div class="flex justify-between items-end">
                <div>
                    <h1 id="viewEventTitle" class="text-3xl font-black text-slate-900 tracking-tight">載入中...</h1>
                    <p class="text-lg font-bold text-rose-600"><span id="viewEventDate"></span> <span id="viewWeekdayDisplay"></span></p>
                </div>
                <div id="syncStatus" class="text-[11px] font-bold px-3 py-1 rounded-full border border-slate-200 bg-white shadow-sm">同步中</div>
            </div>
        </div>

        <div class="flex justify-between items-center mb-6 no-print">
            <div class="admin-only">
                <h2 class="text-xl font-black text-amber-600 italic">MODE: EDITOR</h2>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="handleModeSwitch()" id="modeBtn" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-lg font-bold shadow-md transition">🛠️ 編輯模式</button>
                <button onclick="saveToFirebase()" class="admin-only bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-bold shadow-md">💾 儲存發布</button>
            </div>
        </div>

        <div class="admin-only no-print bg-white rounded-xl mb-6 border-2 border-amber-300 shadow-xl p-4">
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div><label class="block text-xs font-bold text-slate-500 mb-1">活動日期</label><input type="date" id="eventDate" class="w-full border p-2 font-bold" onchange="updateHeaderInfo()"></div>
                <div><label class="block text-xs font-bold text-slate-500 mb-1">專案名稱</label><input type="text" id="eventTitle" class="w-full border p-2 font-bold" oninput="updateHeaderInfo()"></div>
            </div>
            <p class="text-xs font-black text-slate-400 mb-3 underline">1. 請先在下方填寫本場次人員名單：</p>
            <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-3" id="staffConfig"></div>
        </div>

        <table class="rundown-table shadow-lg rounded-lg overflow-hidden">
            <thead class="table-head">
                <tr>
                    <th style="width:50px">序</th>
                    <th style="width:180px">時間區段 (長度)</th>
                    <th class="col-unit">單元項目</th>
                    <th class="col-desc">執行說明</th>
                    <th style="width:240px">負責人員</th>
                </tr>
            </thead>
            <tbody id="rundownBody"></tbody>
        </table>

        <button onclick="addRow()" class="admin-only no-print mt-4 bg-white text-slate-600 px-6 py-2 rounded font-bold border border-slate-300 hover:bg-slate-50">+ 新增流程項目</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // 資料定義
        const teamList = ["江哥", "瑩驊", "志明", "露比", "鐵仁", "柏緯", "維憶", "芳瑜"]; // 已移除細漢
        const jobList = ["控場", "音響", "服務台", "攝影", "機動", "錄影", "儀式"];
        const FIREBASE_URL = "https://rundown-worker-default-rtdb.firebaseio.com/";
        let db, dataRef, isAdmin = false;
        let currentData = { rundown: [], title: "", date: "" };

        // 1. 初始化人員輸入框
        const staffConfig = document.getElementById('staffConfig');
        for(let i=1; i<=8; i++) {
            staffConfig.innerHTML += `
                <div class="staff-card border rounded p-2 bg-slate-50">
                    <select id="j${i}" class="w-full text-[11px] mb-1 font-bold" onchange="renderTable()">
                        <option value="-">-職稱-</option>
                        ${jobList.map(j=>`<option value="${j}">${j}</option>`).join('')}
                    </select>
                    <select id="s${i}" class="w-full text-[11px] border-t pt-1" onchange="renderTable()">
                        <option value="">-姓名-</option>
                        ${teamList.map(n=>`<option value="${n}">${n}</option>`).join('')}
                    </select>
                </div>`;
        }

        // 2. 核心邏輯：獲取目前有效的人員名單
        window.getAvailableStaff = () => {
            const list = [];
            for(let i=1; i<=8; i++) {
                const job = document.getElementById(`j${i}`).value;
                const name = document.getElementById(`s${i}`).value;
                if(job !== "-" && name !== "") {
                    list.push(`${job}: ${name}`);
                }
            }
            return list;
        };

        window.renderTable = () => {
            const tbody = document.getElementById("rundownBody");
            tbody.innerHTML = "";
            let nextS = "";
            const activeStaffList = getAvailableStaff();
            
            currentData.rundown.forEach((item, i) => {
                const tr = document.createElement("tr");
                const dur = parseInt(item.duration) || 0;
                let start = (i === 0) ? (item.startTime || "09:00") : nextS;
                
                let endStr = "";
                if(start.includes(":")) {
                    let [h, m] = start.split(":").map(Number);
                    let em = m + dur, eh = (h + Math.floor(em/60)) % 24;
                    endStr = `${String(eh).padStart(2,'0')}:${String(em%60).padStart(2,'0')}`;
                    nextS = endStr;
                }

                const jobsHtml = (item.jobs || []).map(j => `<span class="job-tag" onclick="removeJob(${i}, '${j}')">${j}</span>`).join('');
                
                // 下拉選單修正：確保能選到上面設定的人
                const adminStaffAction = isAdmin ? `
                    <select class="no-print w-full text-[11px] mt-2 border-2 border-blue-200 rounded p-1 bg-white" onchange="addJob(${i}, this.value); this.value=''">
                        <option value="">+ 分派人員</option>
                        ${activeStaffList.map(s => `<option value="${s}">${s}</option>`).join('')}
                    </select>` : "";

                tr.innerHTML = `
                    <td class="text-center text-slate-400 text-xs">${i+1}</td>
                    <td class="text-center">
                        <div class="time-range">
                            ${isAdmin && i===0 ? `<input type="text" class="start-time w-16 text-center border-b-2 border-blue-500" value="${start}" oninput="updateStartTime(this.value)">` : `<span>${start}</span>`}
                            <span>-</span><span>${endStr}</span>
                            <span class="duration-tag">(${dur}m)</span>
                        </div>
                        ${isAdmin ? `<input type="number" class="dur-input w-12 text-center border mt-1 text-xs" value="${dur}" oninput="updateDuration(${i}, this.value)">` : ""}
                    </td>
                    <td class="col-unit cell-content ${isAdmin?'bg-yellow-50':''}" contenteditable="${isAdmin}" onblur="updateText(${i}, 'unit', this.innerText)">${item.unit || ''}</td>
                    <td class="col-desc cell-content ${isAdmin?'bg-yellow-50':''}" contenteditable="${isAdmin}" onblur="updateText(${i}, 'desc', this.innerText)">${item.desc || ''}</td>
                    <td>
                        <div id="row-jobs-${i}">${jobsHtml}</div>
                        ${adminStaffAction}
                    </td>`;
                tbody.appendChild(tr);
            });
        };

        // 操作函數
        window.addJob = (rowIdx, val) => {
            if(!val) return;
            if(!currentData.rundown[rowIdx].jobs) currentData.rundown[rowIdx].jobs = [];
            if(!currentData.rundown[rowIdx].jobs.includes(val)) {
                currentData.rundown[rowIdx].jobs.push(val);
                renderTable();
            }
        };

        window.removeJob = (rowIdx, val) => {
            if(!isAdmin) return;
            currentData.rundown[rowIdx].jobs = currentData.rundown[rowIdx].jobs.filter(j => j !== val);
            renderTable();
        };

        window.updateText = (idx, field, val) => { currentData.rundown[idx][field] = val; };
        window.updateDuration = (idx, val) => { currentData.rundown[idx].duration = val; renderTable(); };
        window.updateStartTime = (val) => { currentData.rundown[0].startTime = val; renderTable(); };
        window.addRow = () => { currentData.rundown.push({ duration: 10, unit: "新項目", desc: "說明內容", jobs: [] }); renderTable(); };

        window.handleModeSwitch = () => {
            if (!isAdmin) {
                if (prompt("請輸入密碼：") === "364401") { isAdmin = true; } 
                else { alert("錯誤"); return; }
            } else { isAdmin = false; }
            document.body.className = isAdmin ? "admin-mode p-2 md:p-6 pb-20" : "view-mode p-2 md:p-6 pb-20";
            document.getElementById('modeBtn').innerText = isAdmin ? "👁️ 結束編輯" : "🛠️ 編輯模式";
            renderTable();
        };

        window.updateHeaderInfo = () => {
            const title = document.getElementById('eventTitle').value;
            const date = document.getElementById('eventDate').value;
            document.getElementById('viewEventTitle').innerText = title || "未命名專案";
            document.getElementById('viewEventDate').innerText = date || "";
            if(date) {
                const day = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'][new Date(date).getDay()];
                document.getElementById('viewWeekdayDisplay').innerText = `(${day})`;
            }
        };

        window.saveToFirebase = () => {
            const data = {
                title: document.getElementById('eventTitle').value,
                date: document.getElementById('eventDate').value,
                staff: {},
                rundown: currentData.rundown
            };
            for(let i=1; i<=8; i++) data.staff[i] = { j: document.getElementById(`j${i}`).value, s: document.getElementById(`s${i}`).value };
            set(dataRef, data).then(() => { alert("✅ 同步成功！"); isAdmin = false; renderTable(); });
        };

        // Firebase 連結
        const app = initializeApp({ databaseURL: FIREBASE_URL });
        db = getDatabase(app);
        dataRef = ref(db, 'rundown_v2026_final');

        onValue(dataRef, (snap) => {
            const data = snap.val();
            if(!data) return;
            currentData = data;
            document.getElementById('eventTitle').value = data.title || "";
            document.getElementById('eventDate').value = data.date || "";
            for(let i=1; i<=8; i++) if(data.staff?.[i]) {
                document.getElementById(`j${i}`).value = data.staff[i].j;
                document.getElementById(`s${i}`).value = data.staff[i].s;
            }
            updateHeaderInfo();
            renderTable();
        });
    </script>
</body>
</html>
