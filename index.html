<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 執行流程控台 PRO版 - 鐵仁團隊</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { font-family:"Microsoft JhengHei"; background:#0f172a; color:white; }
.current { background:#22c55e !important; color:black; }
</style>
</head>
<body class="p-4">

<h1 class="text-2xl font-black mb-4">🚀 執行流程控台 PRO版</h1>

<div class="mb-4">
開始時間：<input id="start" type="time" value="09:00" class="text-black">
<button onclick="addRow()" class="bg-blue-500 px-3 py-1 rounded">＋新增</button>
<button onclick="save()" class="bg-green-500 px-3 py-1 rounded">💾儲存</button>
</div>

<table class="w-full border" id="table">
<thead><tr class="bg-slate-700"><th>時間</th><th>長度</th><th>項目</th></tr></thead>
<tbody></tbody>
</table>

<script>
let data = [];

function addRow(d={duration:10,unit:""}){
 const tr=document.createElement("tr");
 tr.innerHTML=`
 <td class="time"></td>
 <td><input type="number" value="${d.duration}" onchange="calc()" class="text-black w-16"></td>
 <td contenteditable="true">${d.unit}</td>`;
 document.querySelector("tbody").appendChild(tr);
 calc();
}

function calc(){
 let t=document.getElementById("start").value.split(":");
 let h=parseInt(t[0]),m=parseInt(t[1]);
 document.querySelectorAll("tbody tr").forEach(tr=>{
  let d=parseInt(tr.children[1].children[0].value)||0;
  let start=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  m+=d;
  let endH=h+Math.floor(m/60);
  let endM=m%60;
  let end=`${String(endH).padStart(2,'0')}:${String(endM).padStart(2,'0')}`;
  tr.children[0].innerText=start+"-"+end;
  h=endH; m=endM;
 });
 highlightNow();
}

function highlightNow(){
 let now=new Date();
 let cur=now.getHours()*60+now.getMinutes();
 document.querySelectorAll("tbody tr").forEach(tr=>{
  let txt=tr.children[0].innerText;
  if(!txt) return;
  let s=txt.split("-")[0].split(":");
  let e=txt.split("-")[1].split(":");
  let sm=s[0]*60+parseInt(s[1]);
  let em=e[0]*60+parseInt(e[1]);
  if(cur>=sm && cur<=em) tr.classList.add("current");
  else tr.classList.remove("current");
 });
}

setInterval(highlightNow,60000);

function save(){
 let arr=[];
 document.querySelectorAll("tbody tr").forEach(tr=>{
  arr.push({
   time:tr.children[0].innerText,
   duration:tr.children[1].children[0].value,
   unit:tr.children[2].innerText
  });
 });
 localStorage.setItem("rundown_pro",JSON.stringify(arr));
 alert("已儲存");
}

function load(){
 let d=localStorage.getItem("rundown_pro");
 if(!d){ addRow(); return; }
 JSON.parse(d).forEach(addRow);
}

load();
</script>

</body>
</html>
