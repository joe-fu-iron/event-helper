<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 執行流程控台-時間連鎖修正版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background: #f8fafc; color: #1e293b; transition: 0.3s; }
        body.admin-mode { background: #fffbeb; } 
        .is-now { background: #f0fdf4 !important; border-left: 8px solid #22c55e !important; }
        .rundown-table { width: 100%; border-collapse: collapse; background: white; table-layout: fixed; }
        .rundown-table th, .rundown-table td { border: 1px solid #cbd5e1; padding: 10px 8px; vertical-align: middle; }
        .table-head { background: #334155; color: white; font-size: 14px; font-weight: bold; }
        .cell-content { font-weight: bold; font-size: 15px; outline: none; min-height: 1.2em; }
        .time-range { font-family: monospace; font-weight: bold; color: #2563eb; font-size: 15px; }
        .job-tag { display: inline-block; background: #e2e8f0; color: #475569; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin: 2px; font-weight: bold; cursor: pointer; }
        .equipment-tag { display: inline-flex; align-items: center; background: white; border: 1.5px solid #cbd5e1; padding: 4px 10px; border-radius: 8px; margin: 4px; font-weight: bold; font-size: 13px; transition: 0.2s; }
        .equipment-tag.loaded { background-color: #22c55e !important; border-color: #166534 !important; color: white; }
        .eq-count { width: 30px; background: transparent; text-align: center; font-weight: 900; border: none; outline: none; }
        #warehouseModal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.8); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .warehouse-content { background: white; width: 90%; max-width: 500px; border-radius: 20px; padding: 20px; }
        .admin-only { display: none !important; }
        body.admin-mode .admin-only { display: block !important; }
        #cardViewContainer { display: none; }
        body.card-mode .rundown-table, body.card-mode .admin-only { display: none !important; }
        body.card-mode #cardViewContainer { display: block; }
        .card-view-item { background: white; border-radius: 12px; padding: 15px; margin-bottom: 12px; border: 1px solid #e2e8f0; }
        #checkInBtn { display: none; background: #059669; color: white; padding: 8px 16px; border-radius: 20px; font-weight: 900; animation: pulse 2s infinite; text-decoration: none; }
        body.card-mode #checkInBtn { display: inline-flex; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    </style>
</head>
<body class="view-mode p-2 md:p-6 pb-20">

    <div class="max-w-[1400px] mx-auto">
        <div class="flex justify-between items-center mb-6 border-b-2 pb-4 no-print">
            <div>
                <h1 id="viewEventTitle" class="text-2xl font-black italic">載入中...</h1>
                <p class="text-sm font-bold text-rose-600"><span id="viewEventDate"></span> <span id="viewWeekdayDisplay"></span></p>
            </div>
            <div class="flex gap-2 items-center">
                <a id="checkInBtn" href="https://script.google.com/macros/s/AKfycby35-QOWq7DV9JTwmuYgTvOWlhGor5gVncs7EwCcC7aHDthP6aCzgf5pCcwfeTI613lDw/exec" target="_blank">📊 簽到看板</a>
                <button onclick="toggleCardMode()" id="toggleViewBtn" class="bg-indigo-600 text-white px-4 py-2 rounded-full text-xs font-black">🗂️ 名片模式</button>
                <button onclick="handleModeSwitch()" id="modeBtn" class="bg-amber-500 text-white px-4 py-2 rounded-lg font-bold shadow-md">🛠️ 編輯模式</button>
                <button onclick="saveToFirebase()" class="admin-only bg-blue-600 text-white px-4 py-2 rounded-lg font-bold">💾 儲存發布</button>
            </div>
        </div>

        <div class="admin-only bg-white rounded-xl mb-6 border-2 border-amber-300 p-4">
            <div class="grid grid-cols-2 gap-4 mb-4">
                <input type="date" id="eventDate" class="border p-2 rounded font-bold" onchange="updateHeaderInfo()">
                <input type="text" id="eventTitle" placeholder="專案名稱" class="border p-2 rounded font-bold" oninput="updateHeaderInfo()">
            </div>
            <div class="grid grid-cols-2 md:grid-cols-5 gap-2" id="staffConfig"></div>
        </div>

        <table class="rundown-table shadow-md rounded-lg overflow-hidden mb-6" id="mainTable">
            <thead class="table-head">
                <tr><th style="width:45px">序</th><th style="width:140px">時間(分)</th><th style="width:200px">單元名稱</th><th>執行內容</th><th style="width:200px">負責人</th></tr>
            </thead>
            <tbody id="rundownBody"></tbody>
        </table>

        <div id="cardViewContainer" class="no-print"></div>
        <button onclick="addRow()" class="admin-only mb-10 bg-slate-100 border-2 border-dashed border-slate-300 p-3 rounded-xl font-bold w-full">+ 新增流程</button>

        <div class="bg-white p-6 rounded-2xl border shadow-sm">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-black italic">📦 器材清點 (點擊名稱標註已到位)</h2>
                <button onclick="openWarehouse()" class="admin-only bg-slate-800 text-white px-3 py-1 rounded text-xs">＋新增器材</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="p-3 bg-blue-50 rounded-lg">
                    <p class="text-blue-600 text-xs font-bold mb-2">📍 服務台</p>
                    <div id="serviceContainer" class="flex flex-wrap"></div>
                </div>
                <div class="p-3 bg-rose-50 rounded-lg">
                    <p class="text-rose-600 text-xs font-bold mb-2">📍 舞台區</p>
                    <div id="stageContainer" class="flex flex-wrap"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="warehouseModal">
        <div class="warehouse-content">
            <h3 class="font-bold mb-4">新增器材到清單</h3>
            <input type="text" id="customEqName" placeholder="器材名稱" class="w-full border p-2 mb-3 rounded">
            <select id="customEqZone" class="w-full border p-2 mb-4 rounded">
                <option value="service">服務台</option>
                <option value="stage">舞台區</option>
            </select>
            <div class="flex gap-2">
                <button onclick="addEqToData()" class="flex-1 bg-blue-600 text-white p-2 rounded font-bold">確認新增</button>
                <button onclick="closeWarehouse()" class="flex-1 bg-slate-200 p-2 rounded">取消</button>
            </div>
        </div>
    </div>

    <datalist id="teamNames"><option value="江哥"><option value="瑩驊"><option value="志明"><option value="鐵仁"><option value="露比"></datalist>
    <datalist id="teamJobs"></datalist>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const FIREBASE_URL = "https://rundown-worker-default-rtdb.firebaseio.com/";
        let db, dataRef, jobDbRef, isAdmin = false, isCardMode = false;
        let currentData = { rundown: [], title: "", date: "", service: [], stage: [], staff: {} };
        let jobLibrary = ["控場", "製作人", "音控", "主持人"];

        // 初始化人員欄位
        const staffConfig = document.getElementById('staffConfig');
        for(let i=1; i<=10; i++) {
            staffConfig.innerHTML += `<div class="staff-card border rounded p-1"><input type="text" id="j${i}" list="teamJobs" placeholder="職稱" class="w-full text-[10px] font-bold border-b outline-none" onchange="saveJob(this.value)"><input type="text" id="s${i}" list="teamNames" placeholder="姓名" class="w-full text-[10px] outline-none"></div>`;
        }

        window.saveJob = (v) => { if(v && !jobLibrary.includes(v)) { jobLibrary.push(v); set(jobDbRef, jobLibrary); updateJobDatalist(); } };
        const updateJobDatalist = () => { document.getElementById('teamJobs').innerHTML = jobLibrary.map(j => `<option value="${j}">`).join(''); renderTable(); };

        window.toggleCardMode = () => { isCardMode = !isCardMode; document.body.classList.toggle('card-mode', isCardMode); document.getElementById('toggleViewBtn').innerText = isCardMode ? "📊 表格模式" : "🗂️ 名片模式"; renderTable(); };
        window.openWarehouse = () => document.getElementById('warehouseModal').style.display = 'flex';
        window.closeWarehouse = () => document.getElementById('warehouseModal').style.display = 'none';

        // 器材邏輯
        window.addEqToData = () => {
            const name = document.getElementById('customEqName').value, zone = document.getElementById('customEqZone').value;
            if(!name) return;
            if(!currentData[zone]) currentData[zone] = [];
            currentData[zone].push({ n: name, c: 1, l: false });
            document.getElementById('customEqName').value = "";
            closeWarehouse(); renderEquipments();
        };

        window.renderEquipments = () => {
            ['service', 'stage'].forEach(zone => {
                const container = document.getElementById(zone + 'Container');
                container.innerHTML = (currentData[zone] || []).map((e, idx) => `
                    <div class="equipment-tag ${e.l ? 'loaded' : ''}">
                        <span class="cursor-pointer pr-2 border-r" onclick="toggleEqStatus('${zone}', ${idx})">${e.n}</span>
                        <input type="number" class="eq-count" value="${e.c}" onchange="currentData['${zone}'][${idx}].c=this.value">
                        ${isAdmin ? `<span class="ml-1 text-rose-400 cursor-pointer" onclick="removeEq('${zone}', ${idx})">×</span>` : ''}
                    </div>`).join('');
            });
        };
        window.toggleEqStatus = (z, i) => { currentData[z][i].l = !currentData[z][i].l; renderEquipments(); };
        window.removeEq = (z, i) => { currentData[z].splice(i, 1); renderEquipments(); };

        // 核心：時間自動排序與表格渲染
        window.renderTable = () => {
            const tbody = document.getElementById("rundownBody");
            const cardContainer = document.getElementById("cardViewContainer");
            tbody.innerHTML = ""; cardContainer.innerHTML = "";
            let nextStartTime = "";
            const activeStaff = Array.from({length:10}, (_,i)=>({j: document.getElementById(`j${i+1}`).value, s: document.getElementById(`s${i+1}`).value})).filter(x => x.j && x.s);
            const now = new Date(); const curMin = now.getHours() * 60 + now.getMinutes();

            currentData.rundown.forEach((item, i) => {
                const dur = parseInt(item.duration) || 0;
                let start = (i === 0) ? (item.startTime || "09:00") : nextStartTime;
                
                // 計算結束時間
                let [h, m] = start.split(":").map(Number);
                let totalMin = h * 60 + m + dur;
                let eh = Math.floor(totalMin / 60) % 24, em = totalMin % 60;
                let endStr = `${String(eh).padStart(2,'0')}:${String(em).padStart(2,'0')}`;
                nextStartTime = endStr; // 交棒給下一行

                const isActive = (curMin >= (h*60+m) && curMin < (eh*60+em));

                const tr = document.createElement("tr");
                if(isActive) tr.className = "is-now";
                tr.innerHTML = `
                    <td class="text-center font-bold text-slate-400">${i+1}</td>
                    <td class="text-center">
                        <div class="time-range">${isAdmin && i===0 ? `<input type="time" class="border-b" value="${start}" onchange="currentData.rundown[0].startTime=this.value; renderTable();">` : `<span>${start}</span>`} - ${endStr}</div>
                        ${isAdmin ? `<input type="number" class="w-12 text-center text-xs border rounded" value="${dur}" onchange="currentData.rundown[${i}].duration=this.value; renderTable();">` : `<span class="text-[10px] text-slate-400">${dur}min</span>`}
                    </td>
                    <td class="cell-content" contenteditable="${isAdmin}" onblur="currentData.rundown[${i}].unit=this.innerText">${item.unit || ''}</td>
                    <td class="cell-content text-slate-500 font-normal" contenteditable="${isAdmin}" onblur="currentData.rundown[${i}].desc=this.innerText">${item.desc || ''}</td>
                    <td>
                        <div class="flex flex-wrap">${(item.jobs || []).map(j=>`<span class="job-tag" onclick="removeJob(${i},'${j}')">${j}</span>`).join('')}</div>
                        ${isAdmin ? `
                            <div class="flex gap-1 mt-2 border-t pt-1">
                                <select class="flex-1 text-[10px] border outline-none" onchange="addJob(${i}, this.value); this.value=''"><option value="">＋ 派員</option>${activeStaff.map(s=>`<option value="${s.j}: ${s.s}">${s.j}: ${s.s}</option>`).join('')}</select>
                                <button onclick="deleteRow(${i})" class="text-rose-500 text-xs">🗑️</button>
                            </div>` : ""}
                    </td>`;
                tbody.appendChild(tr);

                // 名片模式
                const card = document.createElement("div");
                card.className = `card-view-item ${isActive ? 'bg-green-50 border-l-8 border-green-500' : ''}`;
                card.innerHTML = `<div class="flex justify-between text-xs mb-1"><span class="font-bold">#${i+1}</span><span class="text-blue-600 font-bold">${start} - ${endStr}</span></div><div class="font-black text-lg">${item.unit || ''}</div><div class="text-sm text-slate-600 mb-2">${item.desc || ''}</div><div class="flex flex-wrap gap-1">${(item.jobs || []).map(j => `<span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-[10px] font-bold">${j}</span>`).join('')}</div>`;
                cardContainer.appendChild(card);
            });
        };

        window.addJob = (i, v) => { if(v && !currentData.rundown[i].jobs.includes(v)) { currentData.rundown[i].jobs.push(v); renderTable(); } };
        window.removeJob = (i, v) => { if(isAdmin) { currentData.rundown[i].jobs = currentData.rundown[i].jobs.filter(x=>x!==v); renderTable(); } };
        window.addRow = () => { currentData.rundown.push({ duration: 10, unit: "新項目", desc: "", jobs: [] }); renderTable(); };
        window.deleteRow = (idx) => { if(confirm("確定刪除？")) { currentData.rundown.splice(idx, 1); renderTable(); } };
        window.handleModeSwitch = () => {
            if (!isAdmin) { if (prompt("密碼：") === "364401") isAdmin = true; else return; } else isAdmin = false;
            document.body.className = (isAdmin ? "admin-mode" : "view-mode") + (isCardMode ? " card-mode" : "") + " p-2 md:p-6 pb-20";
            document.getElementById('modeBtn').innerText = isAdmin ? "👁️ 結束編輯" : "🛠️ 編輯模式";
            renderTable(); renderEquipments();
        };
        window.updateHeaderInfo = () => {
            const t = document.getElementById('eventTitle').value, d = document.getElementById('eventDate').value;
            document.getElementById('viewEventTitle').innerText = t || "2026 執行流程";
            document.getElementById('viewEventDate').innerText = d || "";
            if(d) document.getElementById('viewWeekdayDisplay').innerText = `(${['週日','週一','週二','週三','週四','週五','週六'][new Date(d).getDay()]})`;
        };
        window.saveToFirebase = () => {
            currentData.title = document.getElementById('eventTitle').value;
            currentData.date = document.getElementById('eventDate').value;
            currentData.staff = {};
            for(let i=1; i<=10; i++) currentData.staff[i] = { j: document.getElementById(`j${i}`).value, s: document.getElementById(`s${i}`).value };
            set(dataRef, currentData).then(() => alert("✅ 已成功同步發布"));
        };

        const app = initializeApp({ databaseURL: FIREBASE_URL });
        db = getDatabase(app); 
        dataRef = ref(db, 'rundown_v2026_final_v7'); 
        jobDbRef = ref(db, 'job_library_v7');

        onValue(jobDbRef, (snap) => { if(snap.val()) { jobLibrary = snap.val(); updateJobDatalist(); } });
        onValue(dataRef, (snap) => {
            const d = snap.val();
            if(d) {
                currentData = d;
                document.getElementById('eventTitle').value = d.title || "";
                document.getElementById('eventDate').value = d.date || "";
                for(let i=1; i<=10; i++) if(d.staff?.[i]) { document.getElementById(`j${i}`).value = d.staff[i].j || ""; document.getElementById(`s${i}`).value = d.staff[i].s || ""; }
                updateHeaderInfo(); renderTable(); renderEquipments();
            } else { renderTable(); }
        });
        setInterval(renderTable, 60000);
    </script>
</body>
</html>
