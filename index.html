<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 活動執行細部流程表 (Mobile Ready)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background: #f1f5f9; font-size: 16px; }
        .rundown-table { width: 100%; border-collapse: collapse; background: white; table-layout: fixed; }
        .rundown-table th, .rundown-table td { border: 1.2px solid black; padding: 6px; vertical-align: middle; }
        
        /* 欄位寬度設定 (電腦版) */
        .col-time { width: 100px; }
        .col-dur { width: 60px; }
        .col-unit { width: 220px; } 
        .col-job { width: 180px; }  

        .input-line { border: none; border-bottom: 1px solid #94a3b8; outline: none; background: transparent; font-size: 16px; }
        .equipment-tag { display: inline-flex; align-items: center; background: white; border: 1px solid #000; padding: 2px 6px; border-radius: 4px; margin: 2px; font-size: 14px; }
        .num-input { width: 45px; border-bottom: 1px solid black; text-align: center; background: transparent; }
        .start-time-input { width: 100%; text-align: center; background: #fffbeb; border: 1px inset #ccc; font-weight: bold; }

        /* 手機版 RWD 核心代碼 */
        @media screen and (max-width: 768px) {
            .rundown-table, .rundown-table thead, .rundown-table tbody, .rundown-table th, .rundown-table td, .rundown-table tr {
                display: block; width: 100% !important;
            }
            .rundown-table thead { display: none; } 
            .rundown-table tr {
                margin-bottom: 15px; border: 2px solid #ea580c; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            }
            .rundown-table td {
                border: none; border-bottom: 1px solid #f1f5f9; position: relative; padding: 12px 12px 12px 35%; text-align: left; min-height: 48px;
            }
            .rundown-table td::before {
                content: attr(data-label); position: absolute; left: 12px; font-weight: 800; color: #ea580c; font-size: 14px;
            }
            .col-time .time-box { flex-direction: row !important; gap: 10px; }
            .col-job select { margin-bottom: 8px; }
            .no-print.flex { flex-direction: column; }
            .no-print button { width: 100%; }
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white; padding: 0; }
            @page { size: A4 landscape; margin: 0.5cm; }
            .page-break { page-break-before: always; }
            .rundown-table td { font-size: 11pt; }
        }
    </style>
</head>
<body class="p-2 md:p-4">

    <div id="capture-area" class="max-w-[1580px] mx-auto">
        <div class="bg-white p-4 rounded-lg shadow mb-4 border-t-4 border-orange-600">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-4">
                <div class="flex flex-wrap items-center gap-4">
                    <span class="font-black text-2xl text-orange-700">活動執行細部流程表</span>
                    <a href="https://script.google.com/macros/s/AKfycby35-QOWq7DV9JTwmuYgTvOWlhGor5gVncs7EwCcC7aHDthP6aCzgf5pCcwfeTI613lDw/exec" 
                       target="_blank" class="no-print bg-red-600 text-white px-3 py-1.5 rounded font-bold text-xs shadow hover:bg-red-700">🚨 長官簽到即時情況</a>
                </div>
                <div class="flex gap-2 w-full md:w-auto no-print">
                    <button onclick="saveToFirebase()" class="flex-1 md:flex-none bg-orange-600 text-white px-6 py-2 rounded text-sm font-bold shadow">💾 儲存</button>
                    <button onclick="window.print()" class="flex-1 md:flex-none bg-slate-700 text-white px-5 py-2 rounded text-sm font-bold shadow">🖨️ 列印</button>
                </div>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 font-bold mb-4 border-b pb-4 text-sm">
                <div>主題：<input type="text" id="eventTitle" class="input-line w-full" placeholder="請輸入活動名稱"></div>
                <div>日期：<input type="date" id="eventDate" class="input-line" onchange="updateDayOfWeek()"> <span id="dayOfWeek" class="text-blue-600"></span></div>
                <div>地點：<input type="text" id="eventLocation" class="input-line w-full" placeholder="活動地點"></div>
                <div>主持人：<input type="text" id="headerHost" class="input-line w-full" placeholder="主持人姓名"></div>
            </div>

            <div class="p-2 bg-orange-50 rounded border border-orange-200">
                <span class="font-bold text-orange-800 text-sm block mb-2">👥 工作人員名單 (手機版請橫向滑動或向下捲動)：</span>
                <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-2">
                    <script>
                        const fixedJobs = ["-", "控場", "音響", "服務台", "攝影", "機動"];
                        for(let i=1; i<=8; i++) {
                            let options = fixedJobs.map(job => `<option value="${job}">${job}</option>`).join('');
                            document.write(`
                                <div class="bg-white p-2 rounded border border-gray-200 text-xs">
                                    <div class="flex justify-between text-gray-400 mb-1 font-bold">#${i}</div>
                                    <select id="j${i}" class="border rounded w-full mb-1 p-1 bg-white" onchange="updateAllSelects()">
                                        ${options}
                                        <option value="manual">(手動)</option>
                                    </select>
                                    <input type="text" id="cj${i}" placeholder="工項" class="input-line w-full hidden mb-1 !text-xs" oninput="updateAllSelects()">
                                    <input type="text" id="s${i}" placeholder="姓名" class="input-line w-full !text-xs" oninput="updateAllSelects()">
                                </div>
                            `);
                        }
                    </script>
                </div>
            </div>
        </div>

        <table id="rundownTable" class="rundown-table mb-4 shadow-sm">
            <thead class="bg-gray-800 text-white text-sm text-center">
                <tr>
                    <th class="col-time">時間</th>
                    <th class="col-dur">長度</th>
                    <th class="col-unit">單元項目</th>
                    <th class="col-desc">執行說明</th>
                    <th class="col-job">負責人</th>
                </tr>
            </thead>
            <tbody id="rundownBody"></tbody>
        </table>
        
        <div class="no-print mb-8 flex flex-col md:flex-row gap-4">
            <button onclick="addRow()" class="bg-slate-800 text-white px-6 py-3 rounded text-sm font-bold shadow">+ 新增流程項目</button>
            <button onclick="deleteRowPrompt()" class="bg-white text-red-600 border border-red-200 px-5 py-3 rounded text-sm font-bold shadow-sm">🗑️ 刪除指定行數</button>
        </div>

        <div class="page-break bg-white p-4 md:p-6 shadow border rounded mt-8">
            <div class="flex justify-between items-center border-b pb-2 mb-4">
                <h3 class="font-black text-xl text-blue-800">📋 器材清單核對</h3>
                <button onclick="toggleMenuArea()" id="toggleBtn" class="no-print bg-blue-100 text-blue-700 px-4 py-2 rounded text-sm">🔼 收合選單</button>
            </div>
            
            <div id="menuArea" class="no-print mb-6 p-4 bg-slate-50 rounded border border-dashed">
                <div class="mb-4"><strong>📍 服務台項目：</strong><div id="serviceMenu" class="flex flex-wrap gap-2 mt-2"></div></div>
                <div class="mb-4"><strong>📍 舞台區項目：</strong><div id="stageMenu" class="flex flex-wrap gap-2 mt-2"></div></div>
                <div class="flex gap-4">
                    <button onclick="addCustomEquip('serviceContainer')" class="bg-blue-600 text-white px-4 py-2 rounded text-xs font-bold">+ 自訂服務台</button>
                    <button onclick="addCustomEquip('stageContainer')" class="bg-red-600 text-white px-4 py-2 rounded text-xs font-bold">+ 自訂舞台區</button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="border p-4 rounded min-h-[120px] bg-slate-50"><h4 class="font-bold text-blue-700 mb-2 border-b border-blue-200">服務台：</h4><div id="serviceContainer" class="flex flex-wrap items-start"></div></div>
                <div class="border p-4 rounded min-h-[120px] bg-slate-50"><h4 class="font-bold text-red-700 mb-2 border-b border-red-200">舞台區：</h4><div id="stageContainer" class="flex flex-wrap items-start"></div></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://rundown-worker-default-rtdb.firebaseio.com/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dataRef = ref(db, 'rundown_v2026_detail_sync');

        // Q2: 增加髒數據檢查機制
        let isDirty = false;
        const markDirty = () => { isDirty = true; };

        const menuItems = {
            service: ["長官簽到表一式", "長官勾選表", "瓶水*{手動}", "餐盒*{手動}", "簽到箱*1式", "新聞資料*{手動}", "黃桌巾*{手動}", "紅桌巾*{手動}", "伴手禮*{手動}"],
