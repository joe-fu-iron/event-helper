<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IRON 2026 CUE - FINAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background: #000; color: #e2e8f0; -webkit-tap-highlight-color: transparent; }
        .rundown-table { width: 100%; border-collapse: collapse; background: #0f172a; }
        .rundown-table th, .rundown-table td { border: 1px solid #1e293b; padding: 12px 8px; vertical-align: middle; }
        
        /* 控台風格 */
        .time-range { font-family: 'Courier New', monospace; font-weight: bold; color: #f97316; font-size: 16px; text-align: center; }
        .unit-cell { font-size: 16px; font-weight: bold; color: #fbbf24; }
        
        /* 工作人員收合：沒資料就不佔空間 */
        .staff-display-item { font-size: 11px; color: #94a3b8; border-bottom: 1px solid #1e293b; padding: 2px 0; }
        .staff-card { background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 8px; }
        .staff-card.empty { display: none; } 
        #infoSection.open .staff-card.empty { display: block; opacity: 0.4; border-style: dashed; }

        /* 器材：點擊即存 */
        .equipment-tag { display: inline-flex; align-items: center; background: #1e293b; border: 1px solid #475569; padding: 6px 14px; border-radius: 6px; margin: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; border-left: 4px solid transparent; }
        .equipment-tag.loaded { background-color: #064e3b !important; border-color: #10b981 !important; color: #d1fae5; border-left: 4px solid #10b981; }
        
        @media screen and (max-width: 768px) {
            .col-dur, .col-no, th:nth-child(1), th:nth-child(3) { display: none !important; }
            .rundown-table tr { margin-bottom: 15px; border-left: 6px solid #f97316; display: block; background: #0f172a; border-radius: 0 8px 8px 0; }
            .rundown-table td { display: block; width: 100% !important; padding-left: 30% !important; position: relative; border: none; border-bottom: 1px solid #1e293b; min-height: 45px; }
            .rundown-table td::before { content: attr(data-label); position: absolute; left: 12px; color: #64748b; font-size: 10px; font-weight: bold; text-transform: uppercase; }
            .unit-cell { font-size: 18px; padding-top: 15px !important; }
        }
        
        .collapsible { transition: max-height 0.4s ease; overflow: hidden; max-height: 0; }
        .collapsible.open { max-height: 1200px; }
    </style>
</head>
<body class="p-2 md:p-6 pb-20">

    <div class="max-w-[1400px] mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-black text-orange-500 tracking-tighter">IRON 2026 CUE</h1>
            <div class="flex items-center gap-3 no-print">
                <div id="syncStatus" class="text-[10px] font-bold px-3 py-1 rounded-full border border-slate-800 bg-slate-900">WAITING...</div>
                <button onclick="saveToFirebase()" class="bg-orange-600 hover:bg-orange-500 text-white px-6 py-2 rounded-lg font-black shadow-lg transition active:scale-95">💾 全局存檔</button>
            </div>
        </div>

        <div class="no-print bg-slate-900 rounded-xl mb-6 border border-slate-800 overflow-hidden">
            <div onclick="toggleInfo()" class="p-4 cursor-pointer flex justify-between items-center bg-slate-800/50 hover:bg-slate-800 transition">
                <span class="text-slate-400 font-bold text-sm">⚙️ CONFIG & STAFF (設定網址與人員)</span>
                <span id="infoIcon">▼</span>
            </div>
            <div id="infoSection" class="collapsible">
                <div class="p-4 space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="text-[10px] text-orange-500 font-black tracking-widest uppercase">Firebase Database URL</label>
                            <input type="text" id="dbUrl" placeholder="貼上 Firebase 網址..." class="w-full bg-black border border-slate-700 p-2 rounded text-blue-400 text-sm outline-none focus:border-orange-500">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>主題：<input type="text" id="eventTitle" class="w-full bg-transparent border-b border-slate-700 outline-none p-1 text-white"></div>
                            <div>日期：<input type="date" id="eventDate" class="w-full bg-transparent border-b border-slate-700 outline-none p-1 text-white"></div>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-3" id="staffConfig"></div>
                </div>
            </div>
        </div>

        <table class="rundown-table rounded-lg overflow-hidden shadow-2xl mb-6">
            <thead class="bg-slate-900 text-slate-500 text-[10px] uppercase tracking-widest text-center">
                <tr>
                    <th style="width:50px">#</th>
                    <th style="width:165px">Time Range</th>
                    <th style="width:60px" class="col-dur">Min</th>
                    <th>Unit / Cue</th>
                    <th>Instruction</th>
                    <th style="width:220px">Staff in Charge</th>
                </tr>
            </thead>
            <tbody id="rundownBody"></tbody>
        </table>

        <button onclick="addRow()" class="no-print bg-slate-800 text-slate-400 px-6 py-2 rounded font-bold border border-slate-700 hover:bg-slate-700 transition mb-10">+ ADD CUE</button>

        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-black text-orange-500 italic">LOGISTICS 核對</h2>
                <div class="text-[10px] text-slate-500 font-bold bg-black px-3 py-1 rounded-full border border-slate-800">
                    點擊器材標籤 = <span class="text-green-500">已上車</span> (自動同步)
                </div>
            </div>
            
            <div class="no-print flex gap-2 mb-6 p-4 bg-black/50 rounded-xl border border-slate-800">
                <input type="text" id="manualEquipName" placeholder="新增器材..." class="bg-transparent border-b border-slate-700 flex-grow p-1 text-sm outline-none focus:border-orange-500 text-white">
                <select id="manualEquipTarget" class="bg-slate-800 text-xs rounded px-3 border-none text-slate-300">
                    <option value="serviceContainer">服務台</option>
                    <option value="stageContainer">舞台區</option>
                </select>
                <button onclick="addManualEquip()" class="bg-orange-600 text-white px-5 py-1 rounded-lg font-black text-xs hover:bg-orange-500 transition">新增</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-800/50">
                    <h3 class="text-blue-500 text-[10px] font-black mb-4 tracking-tighter uppercase">● Front Desk / 服務台</h3>
                    <div id="serviceContainer" class="flex flex-wrap"></div>
                </div>
                <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-800/50">
                    <h3 class="text-red-500 text-[10px] font-black mb-4 tracking-tighter uppercase">● Stage Area / 舞台區</h3>
                    <div id="stageContainer" class="flex flex-wrap"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // 自動記憶 Firebase URL
        const savedUrl = localStorage.getItem('iron_firebase_url');
        if(savedUrl) document.getElementById('dbUrl').value = savedUrl;

        let db, dataRef;

        const connectDB = () => {
            const url = document.getElementById('dbUrl').value.trim();
            if(!url) return;
            try {
                localStorage.setItem('iron_firebase_url', url);
                const app = initializeApp({ databaseURL: url }, 'IronApp');
                db = getDatabase(app);
                dataRef = ref(db, 'rundown_2026_live');
                startSync();
            } catch(e) { console.error("URL 格式錯誤"); }
        };

        // 人員介面生成
        const staffConfig = document.getElementById('staffConfig');
        for(let i=1; i<=8; i++) {
            staffConfig.innerHTML += `
                <div id="staffBox${i}" class="staff-card space-y-2">
                    <select id="j${i}" class="w-full bg-black border border-slate-700 text-[10px] rounded p-1" onchange="updateAllSelects()">
                        <option value="-">-職位-</option><option value="控場">控場</option><option value="音響">音響</option>
                        <option value="攝影">攝影</option><option value="服務台">服務台</option><option value="manual">自訂</option>
                    </select>
                    <input type="text" id="cj${i}" placeholder="自訂職稱" class="w-full bg-slate-800 border-b border-slate-600 text-[10px] hidden p-1" oninput="updateAllSelects()">
                    <input type="text" id="s${i}" placeholder="姓名" class="w-full bg-transparent border-b border-slate-700 text-[10px] p-1" oninput="updateAllSelects()">
                </div>`;
        }

        window.toggleInfo = () => {
            const sec = document.getElementById('infoSection');
            sec.classList.toggle('open');
            document.getElementById('infoIcon').innerText = sec.classList.contains('open') ? '▲' : '▼';
        };

        // 器材點擊變色即時存檔
        window.toggleEquipStatus = (el, type, index) => {
            el.classList.toggle('loaded');
            if(dataRef) {
                const status = el.classList.contains('loaded');
                update(ref(db, `rundown_2026_live/${type}/${index}`), { l: status });
            }
        };

        window.addEquipment = (containerId, template, savedQty = "", isLoaded = false, index = 0) => {
            const container = document.getElementById(containerId);
            const name = template.split('*')[0], isManual = template.includes('{手動}');
            const tag = document.createElement('div');
            tag.className = `equipment-tag ${isLoaded ? 'loaded' : ''}`;
            const type = containerId.replace('Container', ''); 
            tag.innerHTML = `
                <span onclick="toggleEquipStatus(this.parentElement, '${type}', ${index})">${name}</span>
                ${isManual ? `<input type="text" class="w-8 border-b border-slate-600 bg-transparent text-center ml-2 text-[10px] text-orange-400" value="${savedQty}" onchange="saveToFirebase()">` : ''}
                <button class="ml-3 text-slate-700 no-print hover:text-red-500" onclick="this.parentElement.remove(); saveToFirebase()">✕</button>`;
            container.appendChild(tag);
        };

        window.addManualEquip = () => {
            const name = document.getElementById('manualEquipName').value;
            if(!name) return;
            addEquipment(document.getElementById('manualEquipTarget').value, name + "*{手動}");
            document.getElementById('manualEquipName').value = "";
            saveToFirebase();
        };

        window.refreshRowJobs = (row) => {
            const list = [];
            for(let i=1; i<=8; i++) {
                const j = document.getElementById(`j${i}`).value, s = document.getElementById(`s${i}`).value, cj = document.getElementById(`cj${i}`).value;
                const box = document.getElementById(`staffBox${i}`);
                document.getElementById(`cj${i}`).style.display = (j === "manual") ? "block" : "none";
                if(j === "-" && !s) box.classList.add('empty'); else box.classList.remove('empty');
                if(s) {
                    const title = (j === "manual") ? cj : j;
                    if(title !== "-") list.push(`${title}: ${s}`);
                }
            }
            row.querySelectorAll('.job-sel').forEach((sel, i) => {
                const saved = sel.getAttribute('data-temp-val') || "";
                sel.innerHTML = `<option value="">-</option>` + list.map(n => `<option value="${n}" ${n===saved?'selected':''}>${n}</option>`).join('');
                const print = row.querySelectorAll('.print-text')[i];
                if(saved && list.includes(saved)) { sel.value = saved; print.innerText = saved; sel.style.display = "block"; } 
                else { print.innerText = ""; sel.style.display = (i === 0 || row.querySelectorAll('.job-sel')[i-1]?.value) ? "block" : "none"; }
            });
        };

        window.updateAllSelects = () => document.querySelectorAll("#rundownBody tr").forEach(row => refreshRowJobs(row));

        window.addRow = (isFirst = false, saved = null) => {
            const tbody = document.getElementById("rundownBody");
            const tr = document.createElement("tr");
            let jobHTML = `<div class="space-y-1">`;
            for(let i=0; i<3; i++) {
                const val = saved?.jobs?.[i] || "";
                jobHTML += `<select class="job-sel no-print w-full bg-slate-800 text-[10px] rounded border-none" data-temp-val="${val}" onchange="this.setAttribute('data-temp-val', this.value); refreshRowJobs(this.closest('tr'))"></select><div class="print-text hidden font-bold text-orange-400 text-[10px]">${val}</div>`;
            }
            jobHTML += `</div>`;

            tr.innerHTML = `
                <td data-label="#" class="col-no text-center text-slate-700 text-[10px]"></td>
                <td data-label="Time" class="text-center">
                    <div class="time-range">
                        ${isFirst ? `<input type="text" class="start-time bg-slate-800 border border-slate-700 rounded w-16 text-center text-white" value="${saved?.startTime||'09:00'}" oninput="calculateAllTimes()">` : '<span class="row-start">00:00</span>'}
                        <span class="mx-1 text-slate-800">-</span><span class="row-end">00:00</span>
                    </div>
                </td>
                <td data-label="Min" class="col-dur"><input type="number" class="duration w-full text-center bg-transparent border-b border-slate-800 text-white" value="${saved?.duration||10}" oninput="calculateAllTimes()"></td>
                <td data-label="Cue" contenteditable="true" class="unit-cell outline-none px-2">${saved?.unit||''}</td>
                <td data-label="Note" contenteditable="true" class="desc-cell text-[11px] text-slate-500 outline-none px-2">${saved?.desc||''}</td>
                <td data-label="Staff">${jobHTML}</td>`;
            tbody.appendChild(tr);
            refreshRowJobs(tr);
            calculateAllTimes();
        };

        window.calculateAllTimes = () => {
            let nextS = "";
            document.querySelectorAll("#rundownBody tr").forEach((row, i) => {
                row.querySelector(".col-no").innerText = i + 1;
                const dur = parseInt(row.querySelector(".duration").value) || 0;
                let start = (i === 0) ? row.querySelector(".start-time").value : nextS;
                if(start && start.includes(":")) {
                    let [h, m] = start.split(":").map(Number);
                    let em = m + dur, eh = (h + Math.floor(em/60)) % 24, es = `${String(eh).padStart(2,'0')}:${String(em%60).padStart(2,'0')}`;
                    if(i !== 0) row.querySelector(".row-start").innerText = start;
                    row.querySelector(".row-end").innerText = es;
                    nextS = es;
                }
            });
        };

        window.saveToFirebase = () => {
            if(!dataRef) { connectDB(); if(!dataRef)
