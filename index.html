<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 執行流程控台-終極優化版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background: #f8fafc; color: #1e293b; transition: 0.3s; }
        body.admin-mode { background: #fffbeb; } 
        .is-now { background: #f0fdf4 !important; border-left: 8px solid #22c55e !important; }
        .is-now .time-range { color: #166534 !important; font-weight: 800; }
        
        /* 表格優化 */
        .rundown-table { width: 100%; border-collapse: collapse; background: white; }
        .rundown-table th, .rundown-table td { border: 1px solid #cbd5e1; padding: 10px 8px; vertical-align: middle; }
        .table-head { background: #334155; color: white; font-size: 14px; font-weight: bold; }
        
        .col-id { width: 45px; text-align: center; }
        .col-time { width: 160px; text-align: center; }
        .col-unit { width: auto; min-width: 150px; } 
        .col-desc { width: auto; min-width: 250px; }
        .col-jobs { width: 220px; }

        /* 統一字體：單元項目與執行說明 */
        .cell-content { font-weight: bold; font-size: 15px; color: #1e293b; }

        .time-range { font-family: monospace; font-weight: bold; color: #2563eb; font-size: 15px; }
        .duration-tag { font-size: 12px; color: #64748b; font-weight: normal; margin-left: 4px; }
        
        .equipment-tag { display: inline-flex; align-items: center; background: white; border: 1px solid #475569; padding: 6px 12px; border-radius: 4px; margin: 4px; font-weight: bold; cursor: pointer; }
        .equipment-tag.loaded { background-color: #dcfce7 !important; border-color: #166534 !important; color: #166534; }
        
        .job-tag { display: inline-block; background: #e2e8f0; color: #475569; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin: 2px; font-weight: bold; }
        body.admin-mode .job-tag { cursor: pointer; }
        body.admin-mode .job-tag:hover { background: #fecaca; color: #991b1b; }

        .admin-only { display: none !important; }
        body.admin-mode .admin-only { display: block !important; }
        body.view-mode .dur-input, body.view-mode .start-time { display: none !important; }
        
        #displayHeader { display: none; }
        body.view-mode #displayHeader { display: block; border-bottom: 4px solid #334155; margin-bottom: 20px; padding-bottom: 10px; }

        @media print {
            .no-print, button, #staffConfig, input { display: none !important; }
            body { background: white !important; padding: 0; }
            #displayHeader { display: block !important; }
            .rundown-table { width: 100% !important; border: 2px solid black; }
            .rundown-table th, .rundown-table td { border: 1px solid black !important; color: black !important; }
            @page { margin: 1cm; size: A4 landscape; }
        }
    </style>
</head>
<body class="view-mode p-2 md:p-6 pb-20">

    <div class="max-w-[1500px] mx-auto">
        <div id="displayHeader" class="no-print">
            <div class="flex justify-between items-end">
                <div>
                    <h1 id="viewEventTitle" class="text-3xl font-black text-slate-900 tracking-tight">未命名專案</h1>
                    <p class="text-lg font-bold text-rose-600"><span id="viewEventDate">----/--/--</span> <span id="viewWeekdayDisplay"></span></p>
                </div>
                <div id="syncStatus" class="text-[11px] font-bold px-3 py-1 rounded-full border border-slate-200 bg-white">資料同步中...</div>
            </div>
        </div>

        <div class="flex justify-between items-center mb-6 no-print">
            <div>
                <h2 class="text-xl font-black text-slate-800 tracking-tight admin-only">🛠️ 後台編輯模式 (人員已移除細漢)</h2>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="handleModeSwitch()" id="modeBtn" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-lg font-bold shadow-md transition">🛠️ 編輯模式</button>
                <button onclick="window.print()" class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-lg font-bold shadow-md">🖨️ 列印</button>
                <button onclick="saveToFirebase()" class="admin-only bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-bold shadow-md">💾 儲存所有變更</button>
            </div>
        </div>

        <div class="admin-only no-print bg-white rounded-xl mb-6 border-2 border-amber-300 shadow-sm p-4">
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">活動日期</label>
                    <input type="date" id="eventDate" class="w-full border border-slate-300 rounded p-2 font-bold" onchange="updateHeaderInfo()">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">專案名稱</label>
                    <input type="text" id="eventTitle" placeholder="請輸入專案名稱" class="w-full border border-slate-300 rounded p-2 font-bold" oninput="updateHeaderInfo()">
                </div>
            </div>
            <p class="text-[10px] font-bold text-slate-400 mb-2">步驟 1: 設定人員與職稱 (設定完後下方下拉選單會自動更新)：</p>
            <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-3" id="staffConfig"></div>
        </div>

        <table class="rundown-table rounded-lg overflow-hidden shadow-sm mb-6">
            <thead class="table-head">
                <tr>
                    <th class="col-id">序</th>
                    <th class="col-time">時間區段 (長度)</th>
                    <th class="col-unit">單元項目</th>
                    <th class="col-desc">執行說明</th>
                    <th class="col-jobs">負責人員</th>
                </tr>
            </thead>
            <tbody id="rundownBody"></tbody>
        </table>

        <div class="flex gap-4 mb-10">
            <button onclick="addRow()" class="admin-only no-print bg-white text-slate-600 px-6 py-2 rounded-md font-bold border border-slate-300 shadow-sm hover:bg-slate-50">+ 新增項目</button>
        </div>

        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <h2 class="text-lg font-black text-slate-800 mb-6 italic">📋 器材清點備忘 (點擊可切換清點狀態)</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                <div><h3 class="text-blue-600 text-xs font-bold mb-2 border-l-4 border-blue-600 pl-2">📍 服務台</h3><div id="serviceContainer" class="flex flex-wrap min-h-[50px]"></div></div>
                <div><h3 class="text-red-600 text-xs font-bold mb-2 border-l-4 border-red-600 pl-2">📍 舞台區</h3><div id="stageContainer" class="flex flex-wrap min-h-[50px]"></div></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // 移除細漢後的名單
        const teamList = ["江哥", "瑩驊", "志明", "露比", "鐵仁", "柏緯", "維憶", "芳瑜"];
        const jobList = ["控場", "音響", "服務台", "攝影", "機動", "錄影", "儀式"];
        const FIREBASE_URL = localStorage.getItem('iron_db_url') || "https://rundown-worker-default-rtdb.firebaseio.com/";
        let db, dataRef, isAdmin = false;

        window.handleModeSwitch = () => {
            if (!isAdmin) {
                if (prompt("管理員驗證：") === "364401") toggleMode(true);
                else alert("密碼錯誤！");
            } else toggleMode(false);
        };

        window.toggleMode = (state) => {
            isAdmin = state;
            document.body.className = isAdmin ? "admin-mode p-2 md:p-6 pb-20" : "view-mode p-2 md:p-6 pb-20";
            document.getElementById('modeBtn').innerText = isAdmin ? "👁️ 瀏覽模式" : "🛠️ 編輯模式";
            renderTable(); 
        };

        window.updateHeaderInfo = () => {
            const title = document.getElementById('eventTitle').value;
            const date = document.getElementById('eventDate').value;
            document.getElementById('viewEventTitle').innerText = title || "未命名專案";
            document.getElementById('viewEventDate').innerText = date || "----/--/--";
            if(date) {
                const day = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'][new Date(date).getDay()];
                document.getElementById('viewWeekdayDisplay').innerText = `(${day})`;
            }
        };

        // 初始化人員配置下拉選單 (步驟 1)
        const staffConfig = document.getElementById('staffConfig');
        for(let i=1; i<=8; i++) {
            staffConfig.innerHTML += `
                <div class="staff-card border rounded p-2 bg-slate-50">
                    <select id="j${i}" class="w-full text-[11px] mb-1 font-bold" onchange="renderTable()"><option value="-">-職稱-</option>${jobList.map(j=>`<option value="${j}">${j}</option>`).join('')}</select>
                    <input type="text" id="s${i}" placeholder="姓名" class="w-full text-[11px] border-b bg-transparent" oninput="renderTable()">
                </div>`;
        }

        let currentData = { rundown: [] };

        window.renderTable = () => {
            const tbody = document.getElementById("rundownBody");
            tbody.innerHTML = "";
            let nextS = "";
            
            currentData.rundown.forEach((item, i) => {
                const tr = document.createElement("tr");
                const dur = parseInt(item.duration) || 0;
                let start = (i === 0) ? (item.startTime || "09:00") : nextS;
                
                let endStr = "";
                if(start.includes(":")) {
                    let [h, m] = start.split(":").map(Number);
                    let em = m + dur, eh = (h + Math.floor(em/60)) % 24;
                    endStr = `${String(eh).padStart(2,'0')}:${String(em%60).padStart(2,'0')}`;
                    nextS = endStr;
                }

                const jobsHtml = (item.jobs || []).map(j => `<span class="job-tag" onclick="removeJob(${i}, '${j}')">${j}</span>`).join('');
                
                // 獲取目前設定好的人員名單
                const availableStaff = getAvailableStaff();
                
                const adminStaffAction = isAdmin ? `
                    <select class="no-print w-full text-[10px] mt-2 border border-blue-200 rounded" onchange="addJob(${i}, this.value); this.value=''">
                        <option value="">+ 新增負責人</option>
                        ${availableStaff.map(s => `<option value="${s}">${s}</option>`).join('')}
                    </select>
                ` : "";

                tr.innerHTML = `
                    <td class="col-id">${i+1}</td>
                    <td class="col-time">
                        <div class="time-range">
                            ${isAdmin && i===0 ? `<input type="text" class="start-time w-14 text-center border bg-yellow-50" value="${start}" oninput="updateStartTime(this.value)">` : `<span>${start}</span>`}
                            <span>-</span><span>${endStr}</span>
                            <span class="duration-tag">(${dur}m)</span>
                        </div>
                        ${isAdmin ? `<input type="number" class="dur-input w-12 text-center border mt-1" value="${dur}" oninput="updateDuration(${i}, this.value)">` : ""}
                    </td>
                    <td class="col-unit cell-content ${isAdmin?'bg-white border-blue-100':''}" contenteditable="${isAdmin}" onblur="updateText(${i}, 'unit', this.innerText)">${item.unit || ''}</td>
                    <td class="col-desc cell-content ${isAdmin?'bg-white border-blue-100':''}" style="font-weight: bold; color: #64748b;" contenteditable="${isAdmin}" onblur="updateText(${i}, 'desc', this.innerText)">${item.desc || ''}</td>
                    <td class="col-jobs">
                        <div id="row-jobs-${i}">${jobsHtml}</div>
                        ${adminStaffAction}
                    </td>
                `;
                tbody.appendChild(tr);
            });
            highlightNow();
        };

        window.getAvailableStaff = () => {
            const list = [];
            for(let i=1; i<=8; i++) {
                const j = document.getElementById(`j${i}`).value, s = document.getElementById(`s${i}`).value;
                if(j !== "-" && s) list.push(`${j}:${s}`);
            }
            return list;
        };

        window.addJob = (rowIdx, val) => {
            if(!val) return;
            if(!currentData.rundown[rowIdx].jobs) currentData.rundown[rowIdx].jobs = [];
            if(!currentData.rundown[rowIdx].jobs.includes(val)) {
                currentData.rundown[rowIdx].jobs.push(val);
                renderTable();
            }
        };

        window.removeJob = (rowIdx, val) => {
            if(!isAdmin) return;
            currentData.rundown[rowIdx].jobs = currentData.rundown[rowIdx].jobs.filter(j => j !== val);
            renderTable();
        };

        window.updateText = (idx, field, val) => { currentData.rundown[idx][field] = val; };
        window.updateDuration = (idx, val) => { currentData.rundown[idx].duration = val; renderTable(); };
        window.updateStartTime = (val) => { currentData.rundown[0].startTime = val; renderTable(); };

        window.addRow = () => {
            currentData.rundown.push({ duration: 10, unit: "新單元", desc: "請輸入執行說明", jobs: [] });
            renderTable();
        };

        window.saveToFirebase = () => {
            if(!dataRef) return;
            const data = {
                title: document.getElementById('eventTitle').value,
                date: document.getElementById('eventDate').value,
                staff: {},
                rundown: currentData.rundown,
                service: Array.from(document.querySelectorAll('#serviceContainer .equipment-tag')).map(t=>({n:t.querySelector('span').innerText, l:t.classList.contains('loaded')})),
                stage: Array.from(document.querySelectorAll('#stageContainer .equipment-tag')).map(t=>({n:t.querySelector('span').innerText, l:t.classList.contains('loaded')}))
            };
            for(let i=1; i<=8; i++) data.staff[i] = { j: document.getElementById(`j${i}`).value, s: document.getElementById(`s${i}`).value };
            set(dataRef, data).then(() => {
                alert("✅ 資料已發布至雲端");
                toggleMode(false); // 儲存後切回瀏覽模式
            });
        };

        function highlightNow() {
            const now = new Date(); const cur = now.getHours() * 60 + now.getMinutes();
            document.querySelectorAll("#rundownBody tr").forEach((tr, i) => {
                const timeText = tr.querySelector(".time-range span:first-child").innerText;
                const endText = tr.querySelector(".time-range span:nth-child(3)").innerText;
                if(!timeText.includes(":")) return;
                const s = timeText.split(":").map(Number), e = endText.split(":").map(Number);
                const sm = s[0]*60+s[1], em = e[0]*60+e[1];
                tr.classList.toggle('is-now', cur >= sm && cur < em);
            });
        }

        const app = initializeApp({ databaseURL: FIREBASE_URL });
        db = getDatabase(app);
        dataRef = ref(db, 'rundown_v2026_final');

        onValue(dataRef, (snap) => {
            const data = snap.val();
            if(!data) return;
            currentData = data;
            document.getElementById('eventTitle').value = data.title || "";
            document.getElementById('eventDate').value = data.date || "";
            for(let i=1; i<=8; i++) if(data.staff?.[i]) {
                document.getElementById(`j${i}`).value = data.staff[i].j;
                document.getElementById(`s${i}`).value = data.staff[i].s;
            }
            updateHeaderInfo();
            renderTable();
            
            const renderEq = (id, arr) => {
                const c = document.getElementById(id+'Container'); c.innerHTML = "";
                (arr||[]).forEach((e, idx) => {
                    const tag = document.createElement('div'); tag.className = `equipment-tag ${e.l?'loaded':''}`;
                    tag.innerHTML = `<span onclick="this.parentElement.classList.toggle('loaded')">${e.n}</span>`;
                    c.appendChild(tag);
                });
            };
            renderEq('service', data.service);
            renderEq('stage', data.stage);
        });

        setInterval(highlightNow, 30000);
    </script>
</body>
</html>
