<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>執行製作平台 v25 - Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&family=Noto+Sans+TC:wght@500;900&display=swap" rel="stylesheet">
    <style>
        :root { --win-blue: #0078D4; --win-bg: #FFFFFF; --win-border: #D1D1D1; --win-text: #000000; }
        body { font-family: 'Segoe UI', 'Noto Sans TC', sans-serif; background: var(--win-bg); color: var(--win-text); padding-bottom: 100px; }
        .app-header { background: var(--win-blue); color: #ffffff; border-bottom: 1px solid #005A9E; }
        .header-item { font-size: 18px; font-weight: 700; color: #ffffff !important; }
        input[type="date"].header-input { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); padding: 2px 8px; border-radius: 2px; font-size: 18px; font-weight: 700; }
        input[type="text"].header-input-text { background: transparent; border: none; outline: none; font-size: 18px; font-weight: 700; width: auto; flex-grow: 1; }
        .pro-table { border-collapse: collapse; width: 100%; border: 1px solid var(--win-border); }
        .pro-table th { background: #F3F3F3; color: #333333; padding: 12px; font-size: 13px; border: 1px solid var(--win-border); }
        .pro-table td { border: 1px solid var(--win-border); padding: 8px; background: #ffffff; }
        .is-now { background: #F0F7FF !important; outline: 3px solid var(--win-blue); outline-offset: -3px; z-index: 10; position: relative; }
        .staff-tag { border: 1px solid var(--win-border); padding: 5px 12px; font-size: 14px; font-weight: 600; display: inline-flex; gap: 4px; background: #F9F9F9; border-radius: 2px; }
        .select-btn { border: 1px solid var(--win-border); padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; background: #FFFFFF; }
        .selected-job { background: var(--win-blue) !important; color: #ffffff !important; border-color: var(--win-blue); }
        .edit-only { display: none !important; }
        .admin-mode .edit-only { display: block !important; }
        .btn-orange { background: #E95420; color: #ffffff; padding: 8px 18px; font-weight: 600; font-size: 13px; border-radius: 2px; }
        .btn-header-outline { border: 1px solid rgba(255,255,255,0.7); color: #ffffff; padding: 8px 18px; font-weight: 600; font-size: 13px; border-radius: 2px; }
        .view-section { display: none; }
        .active-view { display: block !important; }
        .person-pill { background: #e0f2fe; color: #0369a1; padding: 2px 6px; border-radius: 4px; margin: 1px; display: inline-block; font-size: 11px; }
        #personPickerModal { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; border:2px solid var(--win-blue); z-index:100; padding:20px; box-shadow:0 10px 25px rgba(0,0,0,0.2); width: 300px; }
        .row-tool { display: flex; gap: 4px; justify-content: center; align-items: center; }
        .btn-tool { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; border: 1px solid #ddd; }
        .btn-add { color: green; border-color: green; }
        .btn-del { color: red; border-color: red; }
    </style>
</head>
<body>

    <header class="app-header sticky top-0 z-50 px-4 py-4 shadow-md">
        <div class="max-w-7xl mx-auto flex flex-col lg:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4 w-full lg:w-auto">
                <div class="flex items-center gap-2 whitespace-nowrap">
                    <span class="header-item">日期：</span>
                    <input type="date" id="eventDate" class="header-input" onchange="updateWeekDay()">
                    <span id="displayWeek" class="header-item opacity-80">---</span>
                </div>
                <div class="h-6 w-[1px] bg-white/30 mx-1"></div>
                <div class="flex items-center gap-2 flex-grow min-w-[200px]">
                    <span class="header-item whitespace-nowrap">活動主題：</span>
                    <input type="text" id="eventName" class="header-input-text text-white placeholder-white/50" value="頭份四月八 靚燈好客節" onblur="autoSave()">
                </div>
            </div>
            <div class="flex flex-wrap items-center justify-center gap-2">
                <button onclick="window.open('https://your-checkin-link.com', '_blank')" class="btn-orange">長官即時簽到平台</button>
                <button onclick="switchView('card')" id="btn-card" class="btn-header-outline">名片模式</button>
                <button onclick="switchView('table')" id="btn-table" class="hidden btn-header-outline">表格模式</button>
                <button onclick="handleAdminSwitch()" class="p-2 border border-white/40 hover:bg-white/20 transition rounded-full text-white" id="adminBtn">
                    </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 space-y-8 mt-4">
        <section class="space-y-4">
            <div class="border-b border-win-border pb-2"><span class="text-xs font-bold tracking-wider uppercase text-slate-500">Personnel & Roles / 人員及分工</span></div>
            <div class="edit-only space-y-4 p-4 border border-win-border bg-slate-50/50">
                <div class="flex flex-wrap gap-2 items-center"><span class="text-xs font-bold text-slate-600">1. 分工：</span><div id="jobOptions" class="flex flex-wrap gap-1"></div></div>
                <div class="flex flex-wrap gap-2 items-center"><span class="text-xs font-bold text-slate-600">2. 人員：</span><div id="nameOptions" class="flex flex-wrap gap-1"></div></div>
            </div>
            <div id="staffGrid" class="flex flex-wrap gap-2"></div>
        </section>

        <section class="overflow-hidden">
            <div id="tableView" class="view-section active-view overflow-x-auto">
                <table class="pro-table">
                    <thead>
                        <tr>
                            <th class="w-48 text-left">時段區間 (長度)</th>
                            <th class="w-48">執行單元</th>
                            <th>內容說明</th>
                            <th class="w-40 text-right">負責人員</th>
                            <th class="w-16 edit-only">編輯</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <div id="cardView" class="view-section grid gap-4 grid-cols-1 md:grid-cols-2 lg:grid-cols-3"></div>
        </section>
    </main>

    <div id="personPickerModal">
        <h3 class="font-bold mb-4 border-b pb-2">選擇負責人員</h3>
        <div id="pickerList" class="flex flex-col gap-2 mb-4 max-h-60 overflow-y-auto"></div>
        <div class="flex justify-end gap-2">
            <button onclick="closePicker()" class="px-4 py-2 bg-gray-200 text-sm">取消</button>
            <button id="savePickerBtn" class="px-4 py-2 bg-blue-600 text-white text-sm">確認</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const app = initializeApp({ databaseURL: "https://rundown-worker-default-rtdb.firebaseio.com/" });
        const db = getDatabase(app);
        const dataRef = ref(db, 'execution_platform_v25');

        let isAdmin = false;
        let selectedJob = ""; 
        let activeEditRow = null;
        const JOBS = ["控場", "音響", "服務台", "儀式", "攝影", "機動", "錄影", "燈光", "特效", "視訊", "料理"];
        const NAMES = ["江哥", "瑩驊", "維憶", "芳瑜", "智明", "露比", "鐵仁", "柏緯", "崧瑋", "燕妮", "工讀1", "工讀2"];

        let localData = {
            eventName: "頭份四月八 靚燈好客節",
            eventDate: "2026-03-27",
            staffRoles: [],
            rundown: [
                { t: "08:00", te: "08:30", d: "30", u: "場地檢查", s: "全區電力負載測試", persons: [] },
                { t: "08:30", te: "09:30", d: "60", u: "設備調試", s: "音響與視訊同步測試", persons: [] },
                { t: "09:30", te: "10:00", d: "30", u: "工作人員集合", s: "今日流程最後確認", persons: [] }
            ]
        };

        window.initSelectors = () => {
            const jBox = document.getElementById('jobOptions');
            jBox.innerHTML = JOBS.map(j => `<button class="select-btn ${selectedJob===j?'selected-job':''}" onclick="selectJob('${j}')">${j}</button>`).join('') + `<button class="select-btn" onclick="customJob()">+手動</button>`;
            const nBox = document.getElementById('nameOptions');
            nBox.innerHTML = NAMES.map(n => `<button class="select-btn" onclick="assignStaff('${n}')">${n}</button>`).join('') + `<button class="select-btn" onclick="customName()">+手動</button>`;
            updateAdminIcon();
        };

        const updateAdminIcon = () => {
            const adminBtn = document.getElementById('adminBtn');
            adminBtn.innerHTML = isAdmin 
                ? `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z" /></svg>` // 開鎖
                : `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>`; // 鎖住
        };

        window.selectJob = (j) => { selectedJob = j; initSelectors(); };
        window.customJob = () => { const j = prompt("分工名稱："); if(j) selectJob(j); };
        window.assignStaff = (n) => { if(!selectedJob) { alert("請先選分工！"); return; } localData.staffRoles.push({ n, j: selectedJob, active: true }); autoSave(); };
        window.customName = () => { const n = prompt("人員姓名："); if(n) assignStaff(n); };

        window.updateWeekDay = () => {
            const val = document.getElementById('eventDate').value;
            if (val) {
                const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                document.getElementById('displayWeek').innerText = days[new Date(val).getDay()];
                localData.eventDate = val;
                autoSave();
            }
        };

        window.autoSave = () => {
            localData.eventName = document.getElementById('eventName').value;
            set(dataRef, localData);
            renderAll();
        };

        window.openPicker = (idx) => {
            if(!isAdmin) return;
            activeEditRow = idx;
            const modal = document.getElementById('personPickerModal');
            const pickerList = document.getElementById('pickerList');
            const currentPersons = localData.rundown[idx].persons || [];
            pickerList.innerHTML = localData.staffRoles.map(role => `
                <label class="flex items-center gap-2 p-2 border hover:bg-gray-50 cursor-pointer">
                    <input type="checkbox" value="${role.n}" ${currentPersons.includes(role.n)?'checked':''}>
                    <span class="text-sm">${role.n} (${role.j})</span>
                </label>
            `).join('');
            modal.style.display = 'block';
            document.getElementById('savePickerBtn').onclick = () => {
                localData.rundown[activeEditRow].persons = Array.from(pickerList.querySelectorAll('input:checked')).map(i => i.value);
                modal.style.display = 'none';
                autoSave();
            };
        };

        window.closePicker = () => document.getElementById('personPickerModal').style.display = 'none';

        // 核心邏輯：自動推算下一行時間
        window.addNewRow = (afterIndex = -1) => {
            let lastTime = "08:00";
            let nextDuration = "10";
            
            if (localData.rundown.length > 0) {
                const target = afterIndex >= 0 ? localData.rundown[afterIndex] : localData.rundown[localData.rundown.length-1];
                lastTime = target.te;
            }

            // 預排規則：第1行30, 第2行60, 第3行30, 其餘10
            const nextIdx = afterIndex >= 0 ? afterIndex + 1 : localData.rundown.length;
            if(nextIdx === 0) nextDuration = "30";
            else if(nextIdx === 1) nextDuration = "60";
            else if(nextIdx === 2) nextDuration = "30";
            else nextDuration = "10";

            const [h, m] = lastTime.split(':').map(Number);
            let date = new Date(); date.setHours(h, m + parseInt(nextDuration));
            const newTe = `${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;

            const newItem = {t: lastTime, te: newTe, d: nextDuration, u: "", s: "", persons: []};
            
            if(afterIndex >= 0) localData.rundown.splice(afterIndex + 1, 0, newItem);
            else localData.rundown.push(newItem);
            
            autoSave();
        };

        window.removeRow = (idx) => {
            if(confirm("確定刪除此行？")) {
                localData.rundown.splice(idx, 1);
                autoSave();
            }
        };

        window.renderAll = () => {
            initSelectors();
            const tbody = document.getElementById('tableBody'); tbody.innerHTML = "";
            const cardView = document.getElementById('cardView'); cardView.innerHTML = "";
            const now = new Date(); const curMin = now.getHours() * 60 + now.getMinutes();

            localData.rundown.forEach((item, i) => {
                const [h, m] = (item.t||"00:00").split(':').map(Number);
                const [eh, em] = (item.te||"00:00").split(':').map(Number);
                const isActive = (curMin >= (h*60+m) && curMin < (eh*60+em));

                const tr = document.createElement('tr');
                if(isActive) tr.className = "is-now";
                
                tr.innerHTML = `
                    <td class="text-left font-bold">
                        <div class="flex items-center gap-1">
                            <input class="w-14 text-center bg-transparent" value="${item.t}" onblur="localData.rundown[${i}].t=this.value; autoSave()" ${!isAdmin?'readonly':''}>
                            <span>-</span>
                            <input class="w-14 text-center bg-transparent" value="${item.te}" onblur="localData.rundown[${i}].te=this.value; autoSave()" ${!isAdmin?'readonly':''}>
                        </div>
                        <div class="text-[10px] text-slate-400">長度: ${item.d} m</div>
                    </td>
                    <td><input class="w-full font-bold text-sm bg-transparent" value="${item.u||''}" placeholder="單元" onblur="localData.rundown[${i}].u=this.value; autoSave()" ${!isAdmin?'readonly':''}></td>
                    <td><input class="w-full text-xs bg-transparent" value="${item.s||''}" placeholder="內容..." onblur="localData.rundown[${i}].s=this.value; autoSave()" ${!isAdmin?'readonly':''}></td>
                    <td class="text-right align-top cursor-pointer" onclick="openPicker(${i})">
                        <div class="flex flex-wrap justify-end gap-1">
                            ${(item.persons && item.persons.length > 0) ? item.persons.map(p => `<span class="person-pill">${p}</span>`).join('') : '<span class="text-slate-300 text-[10px]">未指派</span>'}
                        </div>
                    </td>
                    <td class="edit-only">
                        <div class="row-tool">
                            <button class="btn-tool btn-add" onclick="addNewRow(${i})">+</button>
                            <button class="btn-tool btn-del" onclick="removeRow(${i})">-</button>
                        </div>
                    </td>`;
                tbody.appendChild(tr);

                // 名片模式：依照您的圖片修正，去掉底部多餘資料
                const card = document.createElement('div');
                card.className = `glass-card p-4 border border-win-border rounded ${isActive?'border-blue-500 bg-blue-50/30':''}`;
                card.innerHTML = `
                    <div class="text-[13px] font-bold text-blue-500 mb-1">${item.t}-${item.te}</div>
                    <div class="text-xl font-black text-slate-800 mb-2">${item.u || '未命名單元'}</div>
                    <div class="text-sm text-slate-600 font-bold">${item.s || ''}</div>
                `;
                cardView.appendChild(card);
            });
            // 初始如果沒資料顯示一個加號按鈕
            if(localData.rundown.length === 0 && isAdmin) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center"><button onclick="addNewRow()" class="text-blue-500 font-bold">+ 開始建立第一筆流程</button></td></tr>`;
            }
        };

        window.handleAdminSwitch = () => {
            if(!isAdmin && prompt("管理者密碼：") === "364401") isAdmin = true;
            else if (isAdmin) isAdmin = false;
            document.body.classList.toggle('admin-mode', isAdmin);
            renderAll();
        };

        window.switchView = (m) => {
            document.querySelectorAll('.view-section').forEach(e => e.classList.remove('active-view'));
            document.getElementById(m + 'View').classList.add('active-view');
            document.getElementById('btn-card').classList.toggle('hidden', m === 'card');
            document.getElementById('btn-table').classList.toggle('hidden', m === 'table');
        };

        onValue(dataRef, (snap) => { if(!isAdmin && snap.val()) { localData = snap.val(); renderAll(); } });
        renderAll();
    </script>
</body>
</html>
