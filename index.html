<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2026 四月八執行製作控管台 v48.7</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
    :root { --win-blue: #0078D4; }
    body { font-family: 'Noto Sans TC', sans-serif; background: #f1f5f9; padding-bottom: 80px; }

    /* 滑動開關 */
    .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.3); transition: .4s; border-radius: 20px; border: 1.5px solid rgba(255,255,255,0.4); }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 1.5px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #22c55e; border-color: #16a34a; }
    input:checked + .slider:before { transform: translateX(22px); }

    /* Header 與手機版自適應 */
    .app-header { background: var(--win-blue); color: #FFF; padding: 12px 16px; position: sticky; top: 0; z-index: 1000; }
    .header-input { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); padding: 5px 10px; border-radius: 4px; font-weight: 700; color: #FFF; outline: none; }
    
    /* 專業表格 */
    .pro-table { width: 100%; border-collapse: collapse; background: white; border: 2.5px solid #000; }
    .pro-table th { background: #f8fafc; padding: 12px; border: 1.5px solid #000; font-weight: 900; font-size: 14px; }
    .pro-table td { border: 1.5px solid #000; padding: 12px; vertical-align: middle; }

    .admin-ctrl { display: none !important; }
    .admin-mode .admin-ctrl { display: block !important; }
    
    .section-box { background: #fff; border: 2.5px solid #000; margin-top: 15px; overflow: hidden; }
    .section-title { background: #000; color: #fff; padding: 8px 15px; font-size: 13px; font-weight: 900; display: flex; justify-content: space-between; align-items: center; }
    .equip-label { background: #f1f5f9; width: 90px; text-align: center; font-weight: 900; border-right: 1.5px solid #000; }

    /* 器材長條自適應方塊 */
    .equip-tag { 
        display: inline-flex; align-items: center; 
        background: #fff; border: 2px solid #000; 
        padding: 4px 10px; border-radius: 4px; 
        font-size: 15px; font-weight: 900; gap: 8px;
        box-shadow: 2px 2px 0px #000;
        margin: 4px;
    }
    .equip-name-input { 
        background: transparent; border: none; outline: none; 
        color: #000; min-width: 20px;
    }
    .qty-input { 
        width: 50px; background: #000; border: none;
        border-radius: 2px; text-align: center; color: #FFF; font-weight: 900; 
    }

    /* 照片驗收 */
    .img-grid { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
    .img-box { width: 150px; height: 150px; position: relative; border: 2.5px solid #000; background: #eee; overflow: hidden; }
    .img-box img { width: 100%; height: 100%; object-fit: cover; }

    @media (max-width: 768px) {
        .app-header { flex-direction: column; height: auto; align-items: flex-start; }
        .header-top-info { width: 100%; display: flex; flex-direction: column; gap: 6px; }
        .header-controls { width: 100%; display: flex; justify-content: space-between; margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.2); pt-3 }
    }

    @media print {
        @page { size: A4 landscape; margin: 0.5cm; }
        .no-print, .admin-ctrl, button, .switch { display: none !important; }
        .app-header { background: white !important; color: black !important; border-bottom: 5px solid black; }
        .header-input { color: black !important; border: none !important; font-size: 28px !important; width: auto !important; }
        .pro-table td, .equip-tag, textarea { font-size: 22px !important; font-weight: 900 !important; border: 2.5px solid #000 !important; color: #000 !important; }
        .qty-input { background: transparent !important; color: #000 !important; border-left: 1px solid #000 !important; border-radius: 0 !important; width: 60px !important; font-size: 24px !important; }
    }
</style>
</head>
<body class="admin-mode">

<header class="app-header shadow-2xl no-print">
  <div class="max-w-7xl mx-auto w-full flex flex-col sm:flex-row items-center justify-between">
    <div class="header-top-info flex-1 w-full">
      <div class="flex gap-2 mb-2">
        <input type="date" id="eventDate" class="header-input text-xs w-1/2" onchange="saveData()">
        <input type="time" id="eventTime" class="header-input text-xs w-1/2" onchange="saveData()">
      </div>
      <input type="text" id="eventName" class="header-input border-none bg-transparent w-full font-black text-xl p-0" placeholder="請輸入活動名稱" onblur="saveData()">
    </div>
    <div class="header-controls flex items-center gap-4 pt-2 sm:pt-0">
      <div class="flex items-center gap-1.5"><span class="text-[9px] font-bold opacity-80 uppercase">Mobile</span><label class="switch"><input type="checkbox" onchange="toggleMobileView(this.checked)"><span class="slider"></span></label></div>
      <div class="flex items-center gap-1.5"><span class="text-[9px] font-bold opacity-80 uppercase">Edit</span><label class="switch"><input type="checkbox" checked onchange="toggleAdmin(this.checked)"><span class="slider"></span></label></div>
      <button onclick="window.print()" class="bg-red-600 px-5 py-2 rounded font-black text-xs text-white shadow-lg">匯出 PDF</button>
    </div>
  </div>
</header>

<div id="staffBoard" class="px-4 py-4 shadow-inner" style="background: linear-gradient(135deg, #1e3a5f 0%, #0078D4 100%);">
  <div class="max-w-7xl mx-auto flex flex-wrap gap-2" id="staffBoardCards"></div>
</div>

<main class="max-w-7xl mx-auto p-4">
    <div id="desktopView">
        <section class="admin-ctrl bg-white p-5 rounded-xl border-2 border-slate-300 mb-6 no-print shadow-sm">
            <div id="jobOptions" class="flex flex-wrap gap-1.5 mb-2"></div>
            <div id="nameOptions" class="flex flex-wrap gap-1.5 mb-3 border-b pb-3"></div>
            <div id="staffList" class="flex flex-wrap gap-2"></div>
        </section>
        <table class="pro-table shadow-xl">
            <thead>
                <tr>
                    <th class="w-56 text-center">時間區間 (分)</th>
                    <th class="w-1/3">執行單元</th>
                    <th>詳細細節</th>
                    <th class="w-40 text-right">負責人員</th>
                    <th class="w-10 admin-ctrl"></th>
                </tr>
            </thead>
            <tbody id="rundownBody"></tbody>
        </table>
        <button onclick="addRow()" class="admin-ctrl w-full py-5 mt-3 border-4 border-dashed border-slate-300 rounded-xl font-black text-slate-400 hover:border-blue-500 hover:text-blue-500 transition-all">+ 增加執行流程</button>
    </div>
    
    <div id="mobileView" class="hidden space-y-4"></div>

    <div class="section-box shadow-xl">
        <div class="section-title">器材物資派工 / EQUIPMENT MANAGEMENT</div>
        <table class="w-full">
            <tr>
                <td class="equip-label">服務台</td>
                <td class="p-4" id="list-service-container">
                    <div id="list-service" class="flex flex-wrap items-start"></div>
                    <button onclick="addItem('service')" class="admin-ctrl text-blue-600 text-[11px] mt-4 font-black border-2 border-blue-600 px-3 py-1 rounded">+ 增加服務台物資</button>
                </td>
            </tr>
            <tr>
                <td class="equip-label">舞 台</td>
                <td class="p-4" id="list-stage-container">
                    <div id="list-stage" class="flex flex-wrap items-start"></div>
                    <button onclick="addItem('stage')" class="admin-ctrl text-orange-600 text-[11px] mt-4 font-black border-2 border-orange-600 px-3 py-1 rounded">+ 增加舞台器材</button>
                </td>
            </tr>
        </table>
    </div>

    <div class="section-box shadow-xl">
        <div class="section-title">
            <span>執行紀錄與照片驗收 / VALIDATION</span>
            <button onclick="document.getElementById('imgInput').click()" class="admin-ctrl bg-white text-black px-3 py-1 rounded text-[10px] font-black">📷 上傳現場照</button>
            <input type="file" id="imgInput" class="hidden" accept="image/*" multiple onchange="handleImgs(event)">
        </div>
        <div class="p-5">
            <textarea id="eventNotes" class="w-full min-h-[120px] text-lg font-bold outline-none bg-transparent resize-none leading-relaxed border-b-2 border-slate-200 mb-6" placeholder="請輸入現場執行備註..." onblur="saveData()"></textarea>
            <div id="imgGallery" class="img-grid"></div>
        </div>
    </div>
</main>

<script>
    const JOBS = ["控場","音響","服務台","儀式","攝影","機動","視訊","料理"];
    const NAMES = ["江哥","瑩驊","維憶","芳瑜","智明","鐵仁","柏緯","崧瑋"];
    let selectedJob = "";
    
    let localData = {
        eventDate: "2026-03-28", eventTime: "09:00", eventName: "2026 四月八社區節執行控管", staff: [],
        rundown: [{s:"09:00", l:30, u:"人員進場與物資清點", d:"各組人員就位，器材功能測試", persons:[]}],
        equip: { service: [{n:"簽到表", q:1}], stage: [{n:"無線麥克風", q:4}] },
        images: [], notes: ""
    };

    function calculateEndTime(startTime, duration) {
        if(!startTime || !duration) return "00:00 - 00:00 (0)";
        let [h, m] = startTime.split(':').map(Number);
        let endTotal = h * 60 + m + Number(duration);
        let endH = Math.floor(endTotal / 60).toString().padStart(2, '0');
        let endM = (endTotal % 60).toString().padStart(2, '0');
        return `${startTime} - ${endH}:${endM} (${duration})`;
    }

    // 自動計算輸入框寬度
    function adjustWidth(el) {
        el.style.width = (el.value.length + 1.5) + "ch";
    }

    function toggleAdmin(c) { document.body.classList.toggle('admin-mode', c); renderAll(); }
    function toggleMobileView(c) { 
        document.getElementById('desktopView').classList.toggle('hidden', c);
        document.getElementById('mobileView').classList.toggle('hidden', !c);
        renderAll();
    }

    function handleImgs(e) {
        const files = e.target.files;
        for (let f of files) {
            const reader = new FileReader();
            reader.onload = (event) => { localData.images.push(event.target.result); saveData(); renderAll(); };
            reader.readAsDataURL(f);
        }
    }

    function renderAll() {
        const isAdmin = document.body.classList.contains('admin-mode');
        document.getElementById('eventDate').value = localData.eventDate;
        document.getElementById('eventTime').value = localData.eventTime;
        document.getElementById('eventName').value = localData.eventName;
        document.getElementById('eventNotes').value = localData.notes || "";

        // 看板渲染
        document.getElementById('staffBoardCards').innerHTML = localData.staff.map(s => `
            <div class="bg-white/10 border border-white/20 rounded-lg px-4 py-1.5 text-center min-w-[90px]">
                <div class="text-[9px] text-white/50 font-bold uppercase">${s.j}</div>
                <div class="font-black text-white text-sm">${s.n}</div>
            </div>`).join('');
        
        // 桌面流程渲染
        document.getElementById('rundownBody').innerHTML = localData.rundown.map((row, i) => `
            <tr>
                <td class="text-center">
                    <div class="text-[13px] text-blue-600 font-black mb-1">${calculateEndTime(row.s, row.l)}</div>
                    <div class="flex gap-1 admin-ctrl">
                        <input type="time" class="w-1/2 text-[10px] border p-1" value="${row.s}" onchange="updateRow(${i},'s',this.value)">
                        <input type="number" class="w-1/2 text-[10px] border p-1" value="${row.l}" onchange="updateRow(${i},'l',this.value)">
                    </div>
                </td>
                <td><input class="w-full font-black text-lg outline-none bg-transparent" value="${row.u}" onblur="updateRow(${i},'u',this.value)"></td>
                <td><input class="w-full text-slate-500 text-sm font-bold outline-none bg-transparent" value="${row.d||''}" onblur="updateRow(${i},'d',this.value)"></td>
                <td class="text-right text-[12px] font-black text-blue-700">${row.persons.join(', ') || '未指派'}</td>
                <td class="admin-ctrl text-center"><button class="text-red-400" onclick="localData.rundown.splice(${i},1);saveData();renderAll()">✕</button></td>
            </tr>`).join('');
        
        // 手機版渲染 (強化標題與時間顯示)
        document.getElementById('mobileView').innerHTML = localData.rundown.map((row, i) => `
            <div class="bg-white p-5 rounded-2xl border-l-8 border-blue-600 shadow-md">
                <div class="text-[12px] font-black text-blue-600 mb-3 bg-blue-50 px-3 py-1 rounded-full inline-block">${calculateEndTime(row.s, row.l)}</div>
                <div class="admin-ctrl flex gap-2 mb-3">
                    <input type="time" class="text-xs border rounded p-2" value="${row.s}" onchange="updateRow(${i},'s',this.value)">
                    <input type="number" class="w-20 text-xs border rounded p-2" value="${row.l}" onchange="updateRow(${i},'l',this.value)">
                </div>
                <input class="w-full font-black text-xl mb-1 bg-transparent" value="${row.u}" onblur="updateRow(${i},'u',this.value)">
                <div class="text-xs text-slate-400 font-bold mt-3">負責人員：${row.persons.join(', ') || '全體人員'}</div>
            </div>`).join('');

        // 器材渲染 (自適應伸縮)
        ['service', 'stage'].forEach(type => {
            document.getElementById(`list-${type}`).innerHTML = (localData.equip[type]||[]).map((item, idx) => `
                <div class="equip-tag">
                    <input class="equip-name-input" 
                           value="${item.n}" 
                           oninput="adjustWidth(this)"
                           onblur="localData.equip['${type}'][${idx}].n=this.value;saveData()"
                           style="width: ${item.n.length + 1.5}ch">
                    <input type="number" class="qty-input" value="${item.q}" onchange="localData.equip['${type}'][${idx}].q=this.value;saveData()">
                    ${isAdmin?`<span class="text-red-500 ml-1 cursor-pointer font-black" onclick="localData.equip['${type}'].splice(${idx},1);renderAll();saveData()">✕</span>`:''}
                </div>`).join('');
        });

        document.getElementById('imgGallery').innerHTML = localData.images.map((img, i) => `<div class="img-box"><img src="${img}">${isAdmin?`<div class="img-del" onclick="localData.images.splice(${i},1);renderAll();saveData()">✕</div>`:''}</div>`).join('');
        
        // 編輯介面按鈕
        document.getElementById('jobOptions').innerHTML = JOBS.map(j => `<button class="px-3 py-1.5 border-2 border-slate-200 text-[11px] font-black rounded-lg ${selectedJob===j?'bg-blue-600 text-white border-blue-600 shadow-md':'bg-white text-slate-500'}" onclick="selectedJob='${j}';renderAll()">${j}</button>`).join('');
        document.getElementById('nameOptions').innerHTML = NAMES.map(n => `<button class="px-3 py-1.5 border-2 border-slate-200 text-[11px] font-black rounded-lg bg-white text-slate-500" onclick="addStaff('${n}')">${n}</button>`).join('');
        document.getElementById('staffList').innerHTML = localData.staff.map((s,i) => `<div class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-[11px] font-black border border-blue-200">${s.n}(${s.j}) ${isAdmin?`<span class="ml-1 cursor-pointer text-blue-400" onclick="localData.staff.splice(${i},1);saveData();renderAll()">✕</span>`:''}</div>`).join('');
    }

    function addStaff(n) { if(!selectedJob) return alert("請先選取上方職稱按鈕"); localData.staff.push({n, j:selectedJob}); saveData(); renderAll(); }
    function updateRow(i, f, v) { localData.rundown[i][f] = v; saveData(); renderAll(); }
    function addRow() { localData.rundown.push({s:"09:00", l:15, u:"新執行單元", d:"", persons:[]}); renderAll(); }
    function addItem(type) { localData.equip[type].push({n:"器材", q:1}); renderAll(); }
    
    function saveData() {
        localData.eventDate = document.getElementById('eventDate').value;
        localData.eventTime = document.getElementById('eventTime').value;
        localData.eventName = document.getElementById('eventName').value;
        localData.notes = document.getElementById('eventNotes').value;
        localStorage.setItem('v48_7_final_production', JSON.stringify(localData));
    }

    window.onload = () => {
        const saved = localStorage.getItem('v48_7_final_production');
        if (saved) localData = JSON.parse(saved);
        renderAll();
    };
</script>
</body>
</html>
