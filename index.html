<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 執行流程表 (全功能最終版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background: #f1f5f9; font-size: 14px; color: #334155; }
        .rundown-table { width: 100%; border-collapse: collapse; background: white; table-layout: fixed; }
        .rundown-table th, .rundown-table td { border: 1px solid #cbd5e1; padding: 6px; vertical-align: middle; }
        .col-no { width: 35px; text-align: center; color: #94a3b8; font-size: 11px; }
        .col-time { width: 145px; }
        .col-dur { width: 60px; } 
        .col-unit { width: 180px; } 
        .col-job { width: 220px; }
        .time-range { font-family: monospace; font-weight: bold; color: #f97316; font-size: 14px; text-align: center; white-space: nowrap; }
        .start-time-input { background: #fffbeb; font-weight: bold; text-align: center; border: 1px solid #fbd38d; border-radius: 4px; width: 65px; outline: none; }
        .job-sel { display: none; margin-bottom: 4px; border: 1px solid #e2e8f0; border-radius: 4px; font-size: 11px; }
        .job-sel.visible { display: block; }
        .equipment-tag { display: inline-flex; align-items: center; background: white; border: 1px solid #475569; padding: 2px 8px; border-radius: 4px; margin: 2px; font-weight: bold; font-size: 12px; box-shadow: 1px 1px 2px rgba(0,0,0,0.05); }
        .num-input { width: 45px; border-bottom: 1px solid #000; text-align: center; margin-left: 4px; font-size: 11px; background: transparent; }
        .collapsible-content { transition: max-height 0.3s ease-out; overflow: hidden; }
        .collapsed { max-height: 0 !important; margin-bottom: 0 !important; padding: 0 !important; border: none !important; }
        .arrow { transition: transform 0.3s; display: inline-block; }
        .arrow.rotate { transform: rotate(-90deg); }
        @media screen and (max-width: 768px) {
            .rundown-table, .rundown-table tr, .rundown-table td { display: block; width: 100% !important; }
            .rundown-table thead { display: none; }
            .rundown-table tr { margin-bottom: 15px; border: 1.5px solid #f97316; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
            .rundown-table td { position: relative; padding: 10px 10px 10px 35%; border: none; border-bottom: 1px solid #f1f5f9; min-height: 40px; }
            .rundown-table td::before { content: attr(data-label); position: absolute; left: 10px; font-weight: bold; color: #f97316; font-size: 11px; }
        }
        @media print { .no-print { display: none !important; } .job-sel { display: none !important; } .print-text { display: block !important; border-bottom: 1px solid #eee; margin-bottom: 1px; } .collapsible-content { max-height: none !important; } }
    </style>
</head>
<body class="p-2 md:p-4">

    <div class="max-w-[1580px] mx-auto bg-white p-4 shadow-lg rounded-xl border-t-4 border-orange-600">
        <div class="flex justify-between items-center mb-4 border-b pb-2">
            <div>
                <h1 class="text-2xl font-black text-orange-700 inline-block mr-4">2026 活動執行流程表</h1>
                <span id="syncStatus" class="text-xs font-bold px-2 py-1 bg-gray-100 rounded-full border">初始化...</span>
            </div>
            <div class="flex gap-2 no-print">
                <button onclick="saveToFirebase()" class="bg-orange-600 text-white px-5 py-2 rounded font-bold shadow hover:bg-orange-700">💾 儲存</button>
                <button onclick="window.print()" class="bg-slate-700 text-white px-5 py-2 rounded font-bold shadow">🖨️ 列印</button>
            </div>
        </div>

        <div class="no-print font-bold text-slate-400 mb-2 cursor-pointer select-none text-xs flex items-center gap-2" onclick="toggleSection('infoSection', 'infoArrow')">
            <span id="infoArrow" class="arrow">▼</span> 基本資訊與人員名單 (點擊收合)
        </div>
        <div id="infoSection" class="collapsible-content">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4 text-sm bg-slate-50 p-3 rounded border">
                <div>主題：<input type="text" id="eventTitle" class="border-b bg-transparent w-full outline-none focus:border-orange-500"></div>
                <div>日期：<input type="date" id="eventDate" class="border-b bg-transparent outline-none" onchange="updateDayOfWeek()"> <span id="dayOfWeek" class="text-blue-600 font-bold"></span></div>
                <div>地點：<input type="text" id="eventLocation" class="border-b bg-transparent w-full outline-none"></div>
                <div>主持人：<input type="text" id="headerHost" class="border-b bg-transparent w-full outline-none"></div>
            </div>
            <div class="p-3 bg-orange-50 rounded border border-orange-200 mb-4 shadow-inner">
                <div class="grid grid-cols-2 md:grid-cols-8 gap-2" id="staffConfig"></div>
            </div>
        </div>

        <table class="rundown-table mb-6">
            <thead class="bg-slate-800 text-white text-sm">
                <tr>
                    <th class="col-no">No.</th>
                    <th class="col-time">時間區間</th>
                    <th class="col-dur">長度</th>
                    <th class="col-unit">單元項目</th>
