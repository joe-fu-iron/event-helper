<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Event Pro v9</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --main-blue: #1e40af; }
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background: #f8fafc; color: #1e293b; }
        .app-header { background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); }
        .glass-card { background: white; border-radius: 16px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        
        /* 派遣卡片 UI */
        .staff-chip { cursor: pointer; border: 2px solid #e2e8f0; border-radius: 14px; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); background: white; }
        .staff-chip.active { border-color: #3b82f6; background: #eff6ff; transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.1); }
        .staff-chip.inactive { opacity: 0.4; filter: grayscale(1); }
        
        /* 管理模式 */
        .admin-only { display: none !important; }
        .admin-mode .admin-only { display: block !important; }
        .admin-mode .staff-chip { border-style: dashed; }

        .is-now { background: #f0fdf4 !important; border-left: 6px solid #22c55e !important; }
        .tag { font-size: 10px; font-weight: 800; padding: 2px 10px; border-radius: 20px; }
        .tag-active { background: #1e40af; color: white; }
        .tag-all { background: #be123c; color: white; }

        /* 器材 Chip */
        .eq-item { background: #fff; border: 1px solid #cbd5e1; border-radius: 10px; padding: 6px 10px; display: flex; align-items: center; gap: 8px; }
        .eq-item.checked { background: #f1f5f9; opacity: 0.5; }
    </style>
</head>
<body class="pb-24">

    <header class="app-header sticky top-0 z-50 px-4 py-4 text-white shadow-xl">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex-1">
                <input type="text" class="bg-transparent font-black text-lg block w-full outline-none" value="頭份四月八 靚燈好客節">
                <span class="text-[10px] opacity-90 font-bold tracking-widest">2026 / 03 / 27 · Ver 9 PRO DISPATCH</span>
            </div>
            <div class="flex gap-2">
                <button onclick="toggleView()" id="viewBtn" class="bg-white/10 p-2 rounded-lg text-[10px] font-black border border-white/20 px-3">切換模式</button>
                <button onclick="handleAdminSwitch()" id="modeBtn" class="bg-white/20 p-2 rounded-full"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" /></svg></button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 space-y-6">

        <section class="glass-card p-5">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-black text-slate-400 text-[10px] tracking-widest uppercase">Team Dispatching</h3>
                <button onclick="addStaffMember()" class="admin-only text-[10px] bg-blue-600 text-white px-4 py-1.5 rounded-full font-bold shadow-md">+ 增加人員/職稱組合</button>
            </div>
            <div id="staffGrid" class="flex flex-wrap gap-3"></div>
        </section>

        <section class="glass-card overflow-hidden">
            <div id="tableView">
                <table class="w-full text-left">
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <div id="cardView" class="hidden p-4 grid gap-4 grid-cols-1 md:grid-cols-2 lg:grid-cols-3"></div>
            <button onclick="addNewRow()" class="admin-only w-full py-5 text-xs font-bold text-slate-400 border-t border-dashed hover:bg-slate-50">+ 插入新流程單元</button>
        </section>

        <section class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="glass-card p-5 border-t-4 border-orange-500">
                <div class="flex justify-between items-center mb-4"><h3 class="font-black text-orange-600 text-sm">服務台</h3><button onclick="addEqRow('service')" class="admin-only text-[10px] bg-orange-100 px-2 py-1 rounded">ADD</button></div>
                <div id="serviceBox" class="flex flex-wrap gap-2"></div>
            </div>
            <div class="glass-card p-5 border-t-4 border-blue-600">
                <div class="flex justify-between items-center mb-4"><h3 class="font-black text-blue-700 text-sm">舞台區</h3><button onclick="addEqRow('stage')" class="admin-only text-[10px] bg-blue-100 px-2 py-1 rounded">ADD</button></div>
                <div id="stageBox" class="flex flex-wrap gap-2"></div>
            </div>
        </section>

        <button onclick="saveToCloud()" class="admin-only w-full bg-slate-900 text-white py-6 rounded-2xl font-black shadow-2xl transition hover:bg-black">💾 儲存 Ver. 9 全域配置與記憶庫</button>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const app = initializeApp({ databaseURL: "https://rundown-worker-default-rtdb.firebaseio.com/" });
        const db = getDatabase(app);
        const dataRef = ref(db, 'execution_platform_v9');

        let isAdmin = false;
        let localData = {
            staffRoles: [
                {n: "鐵仁", j: "控場", active: true},
                {n: "柏緯", j: "服務台", active: true},
                {n: "崧瑋", j: "執行製作", active: true},
                {n: "露比", j: "行政執行", active: true}
            ],
            rundown: Array(7).fill().map((_, i) => ({ t: i===0?"08:00":"", d: i<2?"30":"10", u: "", s: "", person: "ALL STAFF", lock: false })),
            eq: { service: [], stage: [] }
        };

        window.renderStaff = () => {
            const grid = document.getElementById('staffGrid');
            grid.innerHTML = "";
            localData.staffRoles.forEach((role, i) => {
                if (!isAdmin && !role.active) return;
                const div = document.createElement('div');
                div.className = `staff-chip p-3 min-w-[130px] ${role.active ? 'active' : 'inactive'}`;
                div.onclick = () => {
                    if (isAdmin) {
                        localData.staffRoles[i].active = !localData.staffRoles[i].active;
                        renderAll();
                    }
                };
                div.innerHTML = `<div class="text-[9px] font-black text-slate-400 uppercase tracking-tighter">${role.j}</div>
                                 <div class="flex items-center justify-between"><span class="font-black text-sm text-slate-800">${role.n}</span>
                                 ${isAdmin ? `<button onclick="event.stopPropagation(); localData.staffRoles.splice(${i},1); renderAll()" class="text-rose-300 ml-2 text-xs">✕</button>` : ''}</div>`;
                grid.appendChild(div);
            });
        };

        window.renderAll = () => {
            calculateTimes();
            renderStaff();
            const tbody = document.getElementById('tableBody');
            const cardView = document.getElementById('cardView');
            const now = new Date(); const curMin = now.getHours() * 60 + now.getMinutes();
            
            tbody.innerHTML = ""; cardView.innerHTML = "";
            let opts = `<option value="ALL STAFF">📢 ALL STAFF</option>`;
            localData.staffRoles.filter(r => r.active).forEach(r => { opts += `<option value="${r.n}">${r.n}</option>`; });

            localData.rundown.forEach((item, i) => {
                const [h, m] = item.t.split(':').map(Number);
                const start = h * 60 + m;
                const isActive = (curMin >= start && curMin < (start + parseInt(item.d)));

                const tr = document.createElement('tr');
                if(isActive) tr.className = "is-now";
                tr.innerHTML = `
                    <td class="p-4 align-top text-center"><div class="font-black text-blue-800 text-xs">${item.t}</div><div class="text-[9px] text-slate-400 font-bold mt-1">${item.d}m</div></td>
                    <td class="p-4 align-top"><input class="w-full font-bold text-slate-800 bg-transparent outline-none" value="${item.u||''}" oninput="localData.rundown[${i}].u=this.value" ${!isAdmin?'readonly':''}>
                    <div class="text-[10px] text-slate-500 mt-1">${item.s||''}</div></td>
                    <td class="p-4 align-top text-right">
                        ${isAdmin ? `<select class="text-[10px] font-bold border rounded p-1" onchange="localData.rundown[${i}].person=this.value; renderAll()">${opts.replace(`value="${item.person}"`, `value="${item.person}" selected`)}</select>` 
                        : `<span class="tag ${item.person==='ALL STAFF'?'tag-all':'tag-active'}">${item.person}</span>`}
                    </td>`;
                tbody.appendChild(tr);

                const card = document.createElement('div');
                card.className = `glass-card p-5 ${isActive?'ring-2 ring-green-500 bg-green-50 shadow-lg':''}`;
                card.innerHTML = `<div class="flex justify-between mb-3"><span class="text-blue-700 font-black text-xs">${item.t} (+${item.d}m)</span><span class="tag tag-active">${item.person}</span></div>
                                  <div class="font-black text-slate-800 mb-2">${item.u || '待填寫項目'}</div><div class="text-[11px] text-slate-500 leading-relaxed">${item.s}</div>`;
                cardView.appendChild(card);
            });
            renderEq();
        };

        window.calculateTimes = () => {
            let lastTime = "08:00";
            localData.rundown.forEach((item, i) => {
                if (i === 0 && !item.t) item.t = "08:00";
                if (item.t && (i === 0 || item.lock)) lastTime = item.t; else item.t = lastTime;
                let [h, m] = lastTime.split(':').map(Number);
                m += parseInt(item.d || 0); h += Math.floor(m / 60); m = m % 60;
                lastTime = `${String(h % 24).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
            });
        };

        window.renderEq = () => {
            ['service', 'stage'].forEach(z => {
                document.getElementById(z+'Box').innerHTML = localData.eq[z].map((e, idx) => `
                    <div class="eq-item shadow-sm ${e.l?'checked':''}">
                        <input type="checkbox" class="w-4 h-4 accent-blue-600 rounded" ${e.l?'checked':''} onchange="localData.eq['${z}'][${idx}].l=!localData.eq['${z}'][${idx}].l; renderEq(); if(!isAdmin) saveToCloud();">
                        <span class="text-xs font-black text-slate-700">${e.n}</span>
                        <input type="number" class="w-10 bg-slate-100 rounded text-center text-[11px] font-black text-blue-700" value="${e.q}" onchange="localData.eq['${z}'][${idx}].q=this.value; renderEq()" ${!isAdmin?'readonly':''}>
                    </div>`).join('');
            });
        };

        window.addStaffMember = () => {
            const input = prompt("輸入格式：姓名+職稱 (例如：柏緯+服務台)");
            if (input && input.includes('+')) {
                const [n, j] = input.split('+');
                localData.staffRoles.push({n, j, active: true});
                renderAll();
            }
        };

        window.addEqRow = (z) => {
            const n = prompt("項目名稱");
            if(n) { localData.eq[z].push({n, q:1, l:false}); renderEq(); }
        };

        window.toggleView = () => {
            document.getElementById('tableView').classList.toggle('hidden');
            document.getElementById('cardView').classList.toggle('hidden');
            document.getElementById('viewBtn').innerText = document.getElementById('tableView').classList.contains('hidden') ? "切換清單模式" : "切換卡片模式";
        };

        window.handleAdminSwitch = () => {
            if(!isAdmin && prompt("管理密碼") !== "364401") return;
            isAdmin = !isAdmin;
            document.body.classList.toggle('admin-mode', isAdmin);
            renderAll();
        };

        window.addNewRow = () => { localData.rundown.push({t:"", d:"10", u:"", s:"", person:"ALL STAFF", lock:false}); renderAll(); };
        window.saveToCloud = () => { set(dataRef, localData).then(() => alert("✅ Ver. 9 全方位資料已同步存檔！")); };
        onValue(dataRef, (snap) => { if(!isAdmin) { const d = snap.val(); if(d) { localData = d; renderAll(); } } });
        
        renderAll();
    </script>
</body>
</html>
