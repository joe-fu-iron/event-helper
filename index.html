<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 活動執行細部流程表 (視覺優化版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background: #f1f5f9; font-size: 14px; color: #334155; }
        
        /* 表格視覺細修 */
        .rundown-table { width: 100%; border-collapse: collapse; background: white; table-layout: fixed; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .rundown-table th, .rundown-table td { border: 1px solid #cbd5e1; padding: 6px; vertical-align: middle; }
        .rundown-table th { border-bottom: 2px solid #ea580c; text-align: center; }
        
        /* 欄位寬度固定 */
        .col-time { width: 95px; } .col-dur { width: 60px; } .col-unit { width: 200px; } .col-job { width: 220px; }
        
        /* 時間顯示區細修 */
        .start-time-input { background: #fffbeb; font-weight: bold; font-size: 15px; text-align: center; border-radius: 4px; padding: 2px; }
        .time-box span.row-start { font-weight: bold; font-size: 15px; color: #f97316; } /* 橘色醒目時間 */
        .time-box .row-end { font-size: 11px; color: #94a3b8; }
        
        /* 動態選單：預設隱藏，有值或前一格有值才顯示 */
        .job-sel { display: none; margin-bottom: 4px; border: 1px solid #e2e8f0; border-radius: 4px; color: #475569; }
        .job-sel.visible { display: block; }
        
        /* 狀態燈號細修 */
        .status-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        
        /* 輸入框一致性 */
        input:focus { border-color: #f97316 !important; outline: none !important; }

        /* 手機版 RWD 視覺優化 */
        @media screen and (max-width: 768px) {
            .rundown-table, .rundown-table thead, .rundown-table tbody, .rundown-table th, .rundown-table td, .rundown-table tr { display: block; width: 100% !important; }
            .rundown-table thead { display: none; }
            .rundown-table tr { margin-bottom: 16px; border: 1px solid #f97316; border-radius: 12px; overflow: hidden; }
            .rundown-table td { position: relative; padding: 12px 12px 12px 35%; border: none; border-bottom: 1px solid #f1f5f9; text-align: left; }
            .rundown-table td::before { content: attr(data-label); position: absolute; left: 12px; font-weight: bold; color: #f97316; font-size: 12px; }
            .col-time .time-box { display: flex !important; flex-direction: row !important; gap: 8px; align-items: center; }
        }
        
        /* 列印版視覺優化 */
        @media print {
            .no-print { display: none !important; }
            body { background: white; color: black; font-size: 11pt; }
            .job-sel { display: none !important; } /* 列印時下拉選單完全消失 */
            .print-text { display: block !important; border-bottom: 1px solid #eee; padding-bottom: 1px; margin-bottom: 2px; }
            @page { size: A4 landscape; margin: 0.5cm; }
        }
    </style>
</head>
<body class="p-2 md:p-4">

    <div class="max-w-[1580px] mx-auto bg-white p-4 shadow-lg rounded-xl border-t-4 border-orange-600">
        <div class="flex justify-between items-center mb-5 border-b pb-3">
            <div>
                <h1 class="text-2xl font-black text-orange-700 inline-block mr-4">活動執行細部流程表</h1>
                <span id="syncStatus" class="text-xs font-bold px-3 py-1.5 bg-gray-100 rounded-full border">
                    <span class="status-dot bg-gray-400 animate-pulse"></span>讀取中...
                </span>
            </div>
            <div class="flex gap-2 no-print">
                <button onclick="saveToFirebase()" class="bg-orange-600 text-white px-5 py-2.5 rounded font-bold shadow hover:bg-orange-700 transition">💾 儲存</button>
                <button onclick="window.print()" class="bg-slate-700 text-white px-5 py-2.5 rounded font-bold shadow hover:bg-slate-800 transition">🖨️ 列印</button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-5 mb-5 text-sm bg-slate-50 p-4 rounded-lg border">
            <div>主題：<input type="text" id="eventTitle" class="border-b w-full outline-none bg-transparent"></div>
            <div>日期：<input type="date" id="eventDate" class="border-b bg-transparent outline-none" onchange="updateDayOfWeek()"> <span id="dayOfWeek" class="text-blue-600 font-bold ml-1"></span></div>
            <div>地點：<input type="text" id="eventLocation" class="border-b w-full outline-none bg-transparent"></div>
            <div>主持人：<input type="text" id="headerHost" class="border-b w-full outline-none bg-transparent"></div>
        </div>

        <div class="p-4 bg-orange-50 rounded-lg border border-orange-200 mb-5">
            <span class="font-bold text-orange-800 text-xs block mb-3">👥 人員名單設定 (選單將自動連動)：</span>
            <div class="grid grid-cols-2 md:grid-cols-8 gap-3" id="staffConfig">
                </div>
        </div>

        <table id="rundownTable" class="rundown-table mb-5">
            <thead class="bg-slate-800 text-white text-sm">
                <tr>
                    <th class="col-time">時間</th>
                    <th class="col-dur">長度(分)</th>
                    <th class="col-unit">單元項目</th>
                    <th>執行說明</th>
                    <th class="col-job">負責人 (自動增長)</th>
                </tr>
            </thead>
            <tbody id="rundownBody"></tbody>
        </table>

        <button onclick="addRow()" class="no-print bg-slate-800 text-white px-7 py-2.5 rounded font-bold hover:bg-slate-700 transition">+ 新增流程</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://rundown-worker-default-rtdb.firebaseio.com/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dataRef = ref(db, 'rundown_v2026_visual_fix');

        // 初始化工作人員介面
        const staffConfig = document.getElementById('staffConfig');
        const jobs = ["-", "控場", "音響", "服務台", "攝影", "機動"];
        for(let i=1; i<=8; i++) {
            staffConfig.innerHTML += `
                <div class="bg-white p-2 border rounded shadow-sm">
                    <select id="j${i}" class="w-full text-xs border mb-1.5 p-0.5 rounded" onchange="updateAllSelects()">
                        ${jobs.map(j => `<option value="${j}">${j}</option>`).join('')}
                        <option value="manual">(手動)</option>
                    </select>
                    <input type="text" id="cj${i}" placeholder="工項名稱" class="w-full text-xs border-b hidden mb-1 outline-none" oninput="updateAllSelects()">
                    <input type="text" id="s${i}" placeholder="姓名" class="w-full text-xs border-b outline-none" oninput="updateAllSelects()">
                </div>`;
        }

        // 核心：獲取名單
        function getStaffList() {
            const list = [];
            for(let i=1; i<=8; i++) {
                const j = document.getElementById(`j${i}`).value;
                const s = document.getElementById(`s${i}`).value || "(無名)";
                const cj = document.getElementById(`cj${i}`).value || "(無工項)";
                document.getElementById(`cj${i}`).style.display = (j === "manual") ? "block" : "none";
                if(j === "manual" && document.getElementById(`cj${i}`).value) list.push(`${cj}(${s})`);
                else if(j !== "-") list.push(`${j}(${s})`);
            }
            return list;
        }

        // 核心：更新選單
        window.refreshRowJobs = (row) => {
            const staffList = getStaffList();
            const selects = row.querySelectorAll('.job-sel');
            const printTexts = row.querySelectorAll('.print-text');
            let lastIdx = -1;

            selects.forEach((sel, i) => {
                const saved = sel.getAttribute('data-temp-val') || "";
                let html = `<option value="">- 選取 -</option>`;
                staffList.forEach(name => {
                    html += `<option value="${name}" ${name === saved ? 'selected' : ''}>${name}</option>`;
                });
                sel.innerHTML = html;
                
                if(saved && staffList.includes(saved)) {
                    sel.value = saved;
                    lastIdx = i;
                    printTexts[i].innerText = saved; // 回填列印文字
                }
            });

            // 處理動態可見性
            selects.forEach((sel, i) => {
                if(i === 0 || i <= lastIdx + 1) sel.classList.add('visible');
                else sel.classList.remove('visible');
            });
        };

        window.updateAllSelects = () => {
            document.querySelectorAll("#rundownBody tr").forEach(row => refreshRowJobs(row));
        };

        window.addRow = (isFirst = false, saved = null) => {
            const tbody = document.getElementById("rundownBody");
            const tr = document.createElement("tr");
            
            // 負責人區塊：列印版與下拉版分開
            let jobHTML = `<div class="job-container">`;
            for(let i=0; i<6; i++) {
                const val = (saved && saved.jobs) ? saved.jobs[i] : "";
                jobHTML += `
                    <div>
                        <select class="job-sel no-print w-full text-xs p-1" data-temp-val="${val}" onchange="this.setAttribute('data-temp-val', this.value); refreshRowJobs(this.closest('tr'))"></select>
                        <div class="print-text hidden font-bold text-blue-900 border-b">${val}</div>
                    </div>`;
            }
            jobHTML += `</div>`;

            tr.innerHTML = `
                <td data-label="時間" class="text-center">
                    <div class="time-box">
                        ${isFirst ? `<input type="text" class="start-time start-time-input w-full border" value="${saved?.startTime||'09:00'}" oninput="calculateAllTimes()">` : '<span class="row-start row-start-display">--:--</span>'}
                        <div class="row-end row-end-display mt-1">結束: --:--</div>
                    </div>
                </td>
                <td data-label="長度(分)"><input type="number" class="duration w-full text-center border-b font-bold outline-none" value="${saved?.duration||10}" oninput="calculateAllTimes()"></td>
                <td data-label="單元" contenteditable="true" class="unit-cell font-bold px-1 text-blue-900 outline-none">${saved?.unit||''}</td>
                <td data-label="說明" contenteditable="true" class="desc-cell text-xs px-1 text-slate-600 outline-none">${saved?.desc||''}</td>
                <td data-label="人員" class="col-job">${jobHTML}</td>
            `;
            tbody.appendChild(tr);
            refreshRowJobs(tr); 
            calculateAllTimes();
        };

        window.saveToFirebase = () => {
            const data = {
                title: document.getElementById('eventTitle').value,
                date: document.getElementById('eventDate').value,
                location: document.getElementById('eventLocation').value,
                host: document.getElementById('headerHost').value,
                staff: {}, rundown: []
            };
            for(let i=1; i<=8; i++) data.staff[i] = {j: document.getElementById(`j${i}`).value, cj: document.getElementById(`cj${i}`).value, s: document.getElementById(`s${i}`).value};
            document.querySelectorAll("#rundownBody tr").forEach(row => {
                data.rundown.push({
                    startTime: row.querySelector(".start-time")?.value || "",
                    duration: row.querySelector(".duration").
