<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 執行控台 - 完整整合版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // 【第一步】請填入您的 Firebase 網址
        const FIREBASE_URL = "https://您的專案名稱-default-rtdb.firebaseio.com/";
        
        // 【第二步】您的核心器材選單設定
        const menuItems = ["長官簽到表", "瓶水*{手動}", "餐盒*{手動}", "簽到箱", "紅桌巾", "TRUSS", "斜撐/鐵板", "木架/手板"];
        const teamList = ["江哥", "瑩驊", "志明", "露比", "鐵仁", "柏緯", "細漢", "維憶", "芳瑜"];
        const jobList = ["控場", "音響", "服務台", "攝影", "機動", "錄影", "儀式", "燈光", "場務"];
    </script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background: #f1f5f9; -webkit-text-size-adjust: 100%; }
        body.admin-mode { background: #fffbeb; }

        /* 權限控管 */
        body.view-mode .edit-box, body.view-mode input, body.view-mode select { pointer-events: none; border: none !important; background: transparent !important; appearance: none; }
        body.view-mode .admin-ui, body.view-mode .btn-del, body.view-mode .job-sel { display: none !important; }

        /* 表格與清單樣式 */
        .main-table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .main-table th, .main-table td { border: 1px solid #cbd5e1; padding: 12px 10px; }
        
        /* 手機版優化：流程表轉為卡片 */
        @media (max-width: 768px) {
            .desktop-only { display: none; }
            .main-table thead { display: none; }
            .main-table tr { display: block; margin-bottom: 20px; border-radius: 15px; box-shadow: 0 8px 15px rgba(0,0,0,0.1); background: white; }
            .main-table td { display: flex; justify-content: space-between; align-items: center; border: none; border-bottom: 1px solid #f1f5f9; padding: 15px; }
            .main-table td::before { content: attr(data-label); font-weight: 800; color: #94a3b8; font-size: 12px; }
            .unit-cell { font-size: 1.6rem !important; font-weight: 900; background: #f8fafc; width: 100% !important; text-align: right; }
            .time-range { font-size: 1.5rem !important; font-weight: 900; color: #2563eb; }
        }

        /* 器材快選按鈕 */
        .menu-btn { background: white; border: 2px solid #e2e8f0; padding: 10px; border-radius: 12px; font-weight: 800; font-size: 1rem; transition: 0.1s; color: #334155; }
        .menu-btn:active { background: #cbd5e1; transform: scale(0.9); }
        .qty-num { font-size: 2rem; font-weight: 900; color: #ef4444; width: 60px; text-align: center; }

        .section-title { border-left: 8px solid #1e293b; padding-left: 15px; margin: 40px 0 20px 0; font-size: 1.5rem; font-weight: 900; }
        .is-now { background: #f0fdf4 !important; border-left: 10px solid #22c55e !important; }
    </style>
</head>
<body class="view-mode pb-40">

    <nav class="bg-slate-900 text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow-2xl">
        <div>
            <h1 id="topTitle" class="font-black text-xl">2026 執行控台</h1>
            <p id="topDate" class="text-[10px] text-slate-400 font-bold tracking-widest uppercase">載入中...</p>
        </div>
        <div class="flex gap-2">
            <button onclick="handleModeSwitch()" id="modeBtn" class="bg-amber-500 px-4 py-2 rounded-xl text-xs font-bold shadow-lg">🛠️ 編輯模式</button>
            <button onclick="saveToFirebase()" class="admin-ui bg-blue-600 px-4 py-2 rounded-xl text-xs font-bold text-white shadow-lg">💾 儲存發布</button>
        </div>
    </nav>

    <main class="max-w-[1200px] mx-auto p-4">
        
        <div class="section-title">PART 1. 執行流程 Rundown</div>
        <table class="main-table mb-6">
            <thead class="bg-slate-800 text-white desktop-only">
                <tr><th width="60">序</th><th width="160">時間</th><th width="80">長度</th><th>單元項目</th><th>執行說明</th><th width="220">負責人</th></tr>
            </thead>
            <tbody id="rundownBody"></tbody>
        </table>
        <button onclick="addRow()" class="admin-ui w-full py-4 border-2 border-dashed border-slate-300 rounded-xl font-bold text-slate-400 mb-10 hover:border-amber-400 hover:text-amber-500">+ 新增流程項目</button>

        <hr class="my-10 border-slate-300">

        <div class="section-title">PART 2. 器材需求 Requisition</div>
        <div class="admin-ui bg-white p-6 rounded-2xl mb-6 shadow-xl border-t-8 border-blue-500">
            <p class="text-sm font-bold text-slate-400 mb-3">快速點選加入項目：</p>
            <div id="menuGrid" class="grid grid-cols-2 md:grid-cols-4 gap-3">
                </div>
        </div>

        <table class="main-table">
            <thead class="bg-slate-700 text-white">
                <tr><th width="60">序</th><th>項目名稱</th><th width="180">數量控制</th><th width="80" class="admin-ui">操作</th></tr>
            </thead>
            <tbody id="hardwareBody"></tbody>
        </table>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        let db, dataRef, isAdmin = false;

        // 初始化：生成快選按鈕
        const menuGrid = document.getElementById('menuGrid');
        menuItems.forEach(item => {
            const btn = document.createElement('button');
            btn.className = "menu-btn";
            btn.innerText = item;
            btn.onclick = () => addHardwareRow({name: item, qty: 1});
            menuGrid.appendChild(btn);
        });

        window.handleModeSwitch = () => {
            if (!isAdmin) {
                if (prompt("管理密碼：") === "364401") toggleMode(true);
                else alert("密碼錯誤");
            } else toggleMode(false);
        };

        window.toggleMode = (state) => {
            isAdmin = state;
            document.body.className = isAdmin ? "admin-mode" : "view-mode";
            document.getElementById('modeBtn').innerText = isAdmin ? "👁️ 退出編輯" : "🛠️ 編輯模式";
            document.querySelectorAll(".edit-box").forEach(el => el.contentEditable = isAdmin);
        };

        // --- 流程表邏輯 ---
        window.addRow = (isFirst = false, saved = null) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td data-label="序號" class="text-center font-bold text-slate-300"></td>
                <td data-label="時間" class="text-center">
                    <div class="time-range">${isFirst ? `<input type="text" class="start-time w-20 text-center border-b font-black" value="${saved?.startTime||'09:00'}" oninput="calculateTimes()">` : '<span class="row-start"></span>'} - <span class="row-end"></span></div>
                </td>
                <td data-label="長度"><input type="number" class="dur-input w-full text-center font-bold text-lg" value="${saved?.duration||10}" oninput="calculateTimes()"></td>
                <td data-label="單元" class="unit-cell edit-box font-black px-4 outline-none" contenteditable="${isAdmin}">${saved?.unit||''}</td>
                <td data-label="說明" class="edit-box text-slate-500 text-sm px-4 outline-none" contenteditable="${isAdmin}">${saved?.desc||''}</td>
                <td data-label="負責人"><input type="text" class="row-job w-full text-xs font-bold border-b" placeholder="填寫人員" value="${saved?.job||''}"></td>
            `;
            document.getElementById("rundownBody").appendChild(tr);
            calculateTimes();
        };

        window.calculateTimes = () => {
            let nextS = "";
            document.querySelectorAll("#rundownBody tr").forEach((row, i) => {
                row.querySelector("td:first-child").innerText = i + 1;
                const dur = parseInt(row.querySelector(".dur-input").value) || 0;
                let start = (i === 0) ? row.querySelector(".start-time").value : nextS;
                if(start && start.includes(":")) {
                    let [h, m] = start.split(":").map(Number);
                    let em = m + dur, eh = (h + Math.floor(em/60)) % 24, es = `${String(eh).padStart(2,'0')}:${String(em%60).padStart(2,'0')}`;
                    if(i !== 0) row.querySelector(".row-start").innerText = start;
                    row.querySelector(".row-end").innerText = es; nextS = es;
                }
            });
        };

        // --- 器材清單邏輯 ---
        window.addHardwareRow = (saved = null) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td data-label="序號" class="text-center font-bold text-slate-300 hw-idx"></td>
                <td data-label="項目名稱" class="edit-box font-bold text-lg outline-none" contenteditable="${isAdmin}">${saved?.name || ''}</td>
                <td data-label="數量控管" class="text-center">
                    <div class="flex items-center justify-center gap-3">
                        <button class="admin-ui w-10 h-10 bg-slate-200 rounded-full font-bold" onclick="changeQty(this, -1)">-</button>
                        <span class="qty-num">${saved?.qty || 0}</span>
                        <button class="admin-ui w-10 h-10 bg-amber-400 text-white rounded-full font-bold shadow-md" onclick="changeQty(this, 1)">+</button>
                    </div>
                </td>
                <td class="admin-ui text-center"><button onclick="this.closest('tr').remove(); updateHwIdx();" class="text-red-400 font-bold">✕</button></td>
            `;
            document.getElementById("hardwareBody").appendChild(tr);
            updateHwIdx();
        };

        window.changeQty = (btn, delta) => {
            const span = btn.parentElement.querySelector('.qty-num');
            let v = parseInt(span.innerText) + delta;
            span.innerText = v < 0 ? 0 : v;
        };

        window.updateHwIdx = () => {
            document.querySelectorAll("#hardwareBody tr").forEach((tr, i) => tr.querySelector(".hw-idx").innerText = i + 1);
        };

        // --- Firebase 核心 ---
        window.saveToFirebase = () => {
            if(!isAdmin) return;
            const data = { rundown: [], hardware: [], timestamp: Date.now() };
            document.querySelectorAll("#rundownBody tr").forEach(row => {
                data.rundown.push({ 
                    startTime: row.querySelector(".start-time")?.value || "", 
                    duration: row.querySelector(".dur-input").value,
                    unit: row.querySelector(".unit-cell").innerText,
                    desc: row.querySelector(".edit-box:nth-child(5)").innerText,
                    job: row.querySelector(".row-job").value
                });
            });
            document.querySelectorAll("#hardwareBody tr").forEach(row => {
                data.hardware.push({
                    name: row.querySelector(".edit-box").innerText,
                    qty: row.querySelector(".qty-num").innerText
                });
            });
            set(dataRef, data).then(() => alert("✅ 全場數據已同步！"));
        };

        const app = initializeApp({ databaseURL: FIREBASE_URL });
        db = getDatabase(app);
        dataRef = ref(db, 'rundown_v2026_full_integrated');

        onValue(dataRef, (snap) => {
            const data = snap.val();
            if(!data) { 
                if(document.querySelectorAll("#rundownBody tr").length===0) addRow(true); 
                return; 
            }
            document.getElementById('topInfo').innerText = "最後發布：" + new Date(data.timestamp).toLocaleString();
            document.getElementById("rundownBody").innerHTML = "";
            (data.rundown || []).forEach((item, idx) => addRow(idx === 0, item));
            document.getElementById("hardwareBody").innerHTML = "";
            (data.hardware || []).forEach(item => addHardwareRow(item));
        });

        // 每15秒檢查當前流程
        setInterval(() => {
            const now = new Date(); const cur = now.getHours() * 60 + now.getMinutes();
            document.querySelectorAll("#rundownBody tr").forEach(tr => {
                const st = tr.querySelector(".row-start")?.innerText || tr.querySelector(".start-time")?.value;
                const et = tr.querySelector(".row-end")?.innerText;
                if(!st || !et) return;
                const s = st.split(":").map(Number), e = et.split(":").map(Number), sm = s[0]*60 + s[1], em = e[0]*60 + e[1];
                tr.classList.toggle('is-now', cur >= sm && cur < em);
            });
        }, 15000);
    </script>
</body>
</html>
