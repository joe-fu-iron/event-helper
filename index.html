<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>執行製作控管台 v40 - 專業對標版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --win-blue: #0078D4; --win-border: #D1D1D1; }
        body { font-family: 'Segoe UI', 'Noto Sans TC', sans-serif; background: #f3f4f6; padding-bottom: 50px; }
        .app-header { background: var(--win-blue); color: white; padding: 12px 20px; position: sticky; top: 0; z-index: 100; }
        .header-input { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: white; font-weight: bold; padding: 4px 8px; border-radius: 4px; outline: none; }
        .pro-table { width: 100%; border-collapse: collapse; background: white; border: 1px solid var(--win-border); }
        .pro-table th { background: #f8fafc; color: #64748b; font-size: 12px; padding: 10px; border: 1px solid var(--win-border); text-align: left; }
        .pro-table td { border: 1px solid var(--win-border); padding: 8px; vertical-align: middle; }
        .time-input { width: 70px; font-weight: bold; border: none; background: transparent; text-align: center; }
        .len-input { width: 45px; background: #f1f5f9; border-radius: 4px; text-align: center; font-weight: bold; color: var(--win-blue); }
        .section-title { font-size: 14px; font-weight: 900; color: #1e293b; border-left: 4px solid var(--win-blue); padding-left: 8px; margin: 20px 0 10px 0; }
        .item-card { background: white; border: 1px solid #e2e8f0; border-radius: 6px; padding: 12px; margin-bottom: 8px; }
        .upload-btn { border: 2px dashed #cbd5e1; padding: 10px; text-align: center; color: #64748b; cursor: pointer; border-radius: 8px; transition: 0.3s; }
        .upload-btn:hover { background: #f1f5f9; border-color: var(--win-blue); }
    </style>
</head>
<body>

<header class="app-header shadow-lg flex justify-between items-center">
    <div class="flex items-center gap-4">
        <input type="date" id="eventDate" class="header-input" onchange="saveData()">
        <input type="text" id="eventName" value="2026 專案執行單" class="header-input text-lg w-64">
    </div>
    <div class="flex gap-2">
        <label class="upload-btn py-1 px-4 text-xs bg-white text-blue-600 border-none font-bold">
            上傳圖檔/文件
            <input type="file" class="hidden" accept="image/*,.pdf,.doc" onchange="handleUpload(this)">
        </label>
        <button onclick="toggleAdmin()" class="bg-white/10 p-1.5 rounded">🔒</button>
    </div>
</header>

<main class="max-w-5xl mx-auto p-4">

    <div class="section-title">EVENT RUNDOWN / 流程時間對標</div>
    <div class="overflow-x-auto shadow-sm rounded-lg">
        <table class="pro-table">
            <thead>
                <tr>
                    <th class="w-24 text-center">開始</th>
                    <th class="w-24 text-center">結束</th>
                    <th class="w-20 text-center">長度(m)</th>
                    <th>執行單元與內容說明</th>
                    <th class="w-32 text-right">負責人員</th>
                    <th class="w-12"></th>
                </tr>
            </thead>
            <tbody id="rundownBody">
                </tbody>
        </table>
    </div>
    <button onclick="addRow()" class="w-full py-3 mt-2 text-slate-400 border-2 border-dashed rounded font-bold hover:bg-white text-sm">+ 增加後續單元</button>

    <div class="section-title">EQUIPMENT LIST / 器材準備清單</div>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-white p-4 rounded shadow-sm border">
            <div class="font-bold text-blue-600 mb-3 border-b pb-2 flex justify-between">
                <span>1. 服務台區</span>
                <button onclick="addItem('service')" class="text-xs bg-slate-100 px-2 rounded">+</button>
            </div>
            <div id="list-service" class="space-y-2"></div>
        </div>
        <div class="bg-white p-4 rounded shadow-sm border">
            <div class="font-bold text-orange-600 mb-3 border-b pb-2 flex justify-between">
                <span>2. 舞台區</span>
                <button onclick="addItem('stage')" class="text-xs bg-slate-100 px-2 rounded">+</button>
            </div>
            <div id="list-stage" class="space-y-2"></div>
        </div>
        <div class="bg-white p-4 rounded shadow-sm border border-dashed border-slate-300">
            <div class="font-bold text-slate-500 mb-3 border-b pb-2">3. 手動輸入/備註</div>
            <textarea id="manualNotes" class="w-full h-32 p-2 text-sm bg-slate-50 outline-none" placeholder="輸入其他特殊器材或需求..." onblur="saveData()"></textarea>
        </div>
    </div>

</main>

<script>
    // 初始化預設資料
    let localData = {
        eventDate: "2026-05-22",
        eventName: "專案執行流程表",
        rundown: [
            { s: "08:00", e: "08:30", l: 30, u: "公司出發/器材裝載", p: "全體" },
            { s: "08:30", e: "09:30", l: 60, u: "進場佈置/電力負載測試", p: "" }
        ],
        equipment: {
            service: ["簽到表", "文具組", "QR Code 立牌", "對講機"],
            stage: ["主音響系統", "無線麥克風*4", "譜架", "筆電/視訊切換器"]
        },
        notes: ""
    };

    // 自動補足後五行 (10分鐘間隔)
    if (localData.rundown.length === 2) {
        let lastEndTime = "09:30";
        for (let i = 0; i < 5; i++) {
            let start = lastEndTime;
            let end = addMinutes(start, 10);
            localData.rundown.push({ s: start, e: end, l: 10, u: "", p: "" });
            lastEndTime = end;
        }
    }

    function renderRundown() {
        const body = document.getElementById('rundownBody');
        body.innerHTML = "";
        localData.rundown.forEach((row, i) => {
            body.innerHTML += `
                <tr class="hover:bg-blue-50/30 transition">
                    <td class="text-center"><input class="time-input" value="${row.s}" onchange="updateRow(${i}, 's', this.value)"></td>
                    <td class="text-center"><input class="time-input" value="${row.e}" onchange="updateRow(${i}, 'e', this.value)"></td>
                    <td class="text-center"><input class="len-input" type="number" value="${row.l}" onchange="updateRow(${i}, 'l', this.value)"></td>
                    <td><input class="w-full bg-transparent outline-none font-medium" value="${row.u}" placeholder="請輸入單元說明..." onblur="updateRow(${i}, 'u', this.value)"></td>
                    <td><input class="w-full text-right bg-transparent outline-none text-xs text-blue-600 font-bold" value="${row.p}" placeholder="指派" onblur="updateRow(${i}, 'p', this.value)"></td>
                    <td class="text-center"><button onclick="deleteRow(${i})" class="text-slate-300 hover:text-red-500">✕</button></td>
                </tr>
            `;
        });
        renderEquipment();
    }

    function updateRow(index, field, value) {
        let row = localData.rundown[index];
        if (field === 'l') {
            row.l = parseInt(value);
            row.e = addMinutes(row.s, row.l);
        } else if (field === 'e') {
            row.e = value;
            row.l = diffMinutes(row.s, row.e);
        } else if (field === 's') {
            row.s = value;
            row.e = addMinutes(row.s, row.l);
        } else {
            row[field] = value;
        }

        // 骨牌連動：更新後續所有行的時間
        for (let j = index + 1; j < localData.rundown.length; j++) {
            localData.rundown[j].s = localData.rundown[j-1].e;
            localData.rundown[j].e = addMinutes(localData.rundown[j].s, localData.rundown[j].l);
        }
        renderRundown();
        saveData();
    }

    function addRow() {
        let last = localData.rundown[localData.rundown.length - 1];
        let start = last ? last.e : "08:00";
        localData.rundown.push({ s: start, e: addMinutes(start, 10), l: 10, u: "", p: "" });
        renderRundown();
        saveData();
    }

    function deleteRow(i) {
        localData.rundown.splice(i, 1);
        if (localData.rundown[i]) { // 如果刪除的不是最後一行，重新連動時間
            updateRow(Math.max(0, i-1), 'u', localData.rundown[Math.max(0, i-1)].u);
        }
        renderRundown();
    }

    // 器材邏輯
    function renderEquipment() {
        ['service', 'stage'].forEach(type => {
            const container = document.getElementById(`list-${type}`);
            container.innerHTML = localData.equipment[type].map((item, idx) => `
                <div class="flex items-center gap-2 text-sm group">
                    <input type="checkbox" class="w-4 h-4 rounded">
                    <input class="flex-grow bg-transparent outline-none border-b border-transparent focus:border-slate-200" 
                           value="${item}" onblur="localData.equipment['${type}'][${idx}]=this.value;saveData()">
                    <button onclick="localData.equipment['${type}'].splice(${idx},1);renderEquipment();saveData()" class="opacity-0 group-hover:opacity-100 text-red-300">✕</button>
                </div>
            `).join('');
        });
        document.getElementById('manualNotes').value = localData.notes;
    }

    function addItem(type) {
        localData.equipment[type].push("新項目");
        renderEquipment();
    }

    // 時間工具函數
    function addMinutes(timeStr, mins) {
        let [h, m] = timeStr.split(':').map(Number);
        let total = h * 60 + m + parseInt(mins);
        return `${String(Math.floor(total/60) % 24).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`;
    }

    function diffMinutes(start, end) {
        let [h1, m1] = start.split(':').map(Number);
        let [h2, m2] = end.split(':').map(Number);
        let diff = (h2 * 60 + m2) - (h1 * 60 + m1);
        return diff < 0 ? diff + 1440 : diff;
    }

    function handleUpload(input) {
        if (input.files && input.files[0]) {
            alert(`已偵測到檔案：${input.files[0].name}\n系統正在進行內容識別... (OCR功能對接預留)`);
            // 這裡可以串接 Cloud Vision API 或其他解析邏輯
        }
    }

    function saveData() {
        localData.eventName = document.getElementById('eventName').value;
        localData.eventDate = document.getElementById('eventDate').value;
        localData.notes = document.getElementById('manualNotes').value;
        console.log("Saving to Cloud...", localData);
        localStorage.setItem('executionData', JSON.stringify(localData));
    }

    // 啟動
    window.onload = () => {
        const saved = localStorage.getItem('executionData');
        if (saved) localData = JSON.parse(saved);
        renderRundown();
    };
</script>

</body>
</html>
