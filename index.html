<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2026 執行製作旗艦控管台 v48.5</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
    :root { --win-blue: #0078D4; }
    body { font-family: 'Noto Sans TC', sans-serif; background: #f1f5f9; padding-bottom: 80px; }

    /* 滑動開關開關 */
    .switch { position: relative; display: inline-block; width: 42px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.3); transition: .4s; border-radius: 20px; border: 1.5px solid rgba(255,255,255,0.4); }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 1.5px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #22c55e; border-color: #16a34a; }
    input:checked + .slider:before { transform: translateX(20px); }

    /* UI 核心 */
    .app-header { background: var(--win-blue); color: #FFF; height: 60px; display: flex; align-items: center; padding: 0 16px; position: sticky; top: 0; z-index: 1000; }
    .header-input { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); padding: 4px 8px; border-radius: 4px; font-weight: 700; color: #FFF; outline: none; }
    #staffBoard { background: linear-gradient(135deg, #1e3a5f 0%, #0078D4 100%); border-bottom: 2px solid #005fa3; }
    
    /* 專業表格 */
    .pro-table { width: 100%; border-collapse: collapse; background: white; border: 2.5px solid #000; }
    .pro-table th { background: #f8fafc; padding: 10px; border: 1.5px solid #000; font-weight: 900; font-size: 13px; }
    .pro-table td { border: 1.5px solid #000; padding: 10px; vertical-align: middle; }

    .admin-ctrl { display: none !important; }
    .admin-mode .admin-ctrl { display: block !important; }
    
    .section-box { background: #fff; border: 2.5px solid #000; margin-top: 15px; overflow: hidden; }
    .section-title { background: #000; color: #fff; padding: 6px 12px; font-size: 12px; font-weight: 900; display: flex; justify-content: space-between; align-items: center; }
    .equip-label { background: #f1f5f9; width: 85px; text-align: center; font-weight: 900; border-right: 1.5px solid #000; }

    /* 器材派工標籤 */
    .equip-tag { display: flex; align-items: center; gap: 6px; background: #fff; border: 2px solid #e2e8f0; padding: 5px 12px; border-radius: 8px; font-size: 15px; font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .qty-input { width: 50px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 4px; text-align: center; color: #0078D4; font-weight: 900; }

    /* 照片藝廊 */
    .img-grid { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
    .img-box { width: 140px; height: 140px; position: relative; border: 2.5px solid #000; background: #eee; border-radius: 4px; overflow: hidden; }
    .img-box img { width: 100%; height: 100%; object-fit: cover; }
    .img-del { position: absolute; top: 4px; right: 4px; background: rgba(255,0,0,0.8); color: white; width: 22px; height: 22px; border-radius: 50%; text-align: center; line-height: 22px; cursor: pointer; font-size: 12px; }

    @media print {
        @page { size: A4 landscape; margin: 0.5cm; }
        .no-print, .admin-ctrl, button, .switch, #checkinPanel { display: none !important; }
        .app-header { background: white !important; color: black !important; border-bottom: 4px solid black; }
        .header-input { color: black !important; border: none !important; font-size: 28px !important; }
        .pro-table td, .equip-tag, textarea { font-size: 22px !important; font-weight: 700 !important; color: black !important; border: 2px solid #000 !important; }
        .qty-input { border: none !important; width: auto !important; font-size: 24px !important; background: transparent !important; }
        .img-box { width: 250px; height: 250px; border: 2px solid #000; }
    }
</style>
</head>
<body class="admin-mode">

<header class="app-header shadow-xl no-print">
  <div class="max-w-7xl mx-auto w-full flex items-center justify-between gap-2">
    <div class="flex items-center gap-2 flex-1 min-w-0">
      <input type="date" id="eventDate" class="header-input text-xs" onchange="saveData()">
      <input type="text" id="eventName" class="header-input border-none bg-transparent flex-1 font-black" onblur="saveData()">
    </div>
    <div class="flex items-center gap-4 shrink-0">
      <button onclick="togglePanel('checkinPanel')" class="bg-white/10 px-3 py-1 rounded text-[10px] font-bold border border-white/20">簽到面板</button>
      <div class="flex items-center gap-1.5"><span class="text-[9px] font-bold opacity-70">手機</span><label class="switch"><input type="checkbox" onchange="toggleMobileView(this.checked)"><span class="slider"></span></label></div>
      <div class="flex items-center gap-1.5"><span class="text-[9px] font-bold opacity-70">編輯</span><label class="switch"><input type="checkbox" checked onchange="toggleAdmin(this.checked)"><span class="slider"></span></label></div>
      <button onclick="window.print()" class="bg-orange-600 px-4 py-1.5 rounded text-[11px] font-black text-white">🖨️ PDF</button>
    </div>
  </div>
</header>

<div id="staffBoard" class="px-4 py-4 shadow-inner">
  <div class="max-w-7xl mx-auto flex flex-wrap gap-2" id="staffBoardCards"></div>
</div>

<div id="checkinPanel" class="max-w-7xl mx-auto px-4 mt-4 no-print hidden">
    <div class="bg-white rounded-xl border-2 border-orange-400 p-5 shadow-2xl text-[10px] text-slate-400 italic">長官簽到連線中...</div>
</div>

<main class="max-w-7xl mx-auto p-4">
    <div id="desktopView">
        <section class="admin-ctrl bg-white p-5 rounded-2xl border-2 border-slate-200 mb-6 no-print shadow-sm">
            <div id="jobOptions" class="flex flex-wrap gap-1.5 mb-2"></div>
            <div id="nameOptions" class="flex flex-wrap gap-1.5 mb-3 border-b pb-3"></div>
            <div id="staffList" class="flex flex-wrap gap-2"></div>
        </section>
        <table class="pro-table shadow-lg">
            <thead>
                <tr>
                    <th class="w-52 text-center">時間區間 (分)</th>
                    <th class="w-1/3">執行單元</th>
                    <th>執行細節</th>
                    <th class="w-40 text-right">負責人</th>
                    <th class="w-10 admin-ctrl"></th>
                </tr>
            </thead>
            <tbody id="rundownBody"></tbody>
        </table>
        <button onclick="addRow()" class="admin-ctrl w-full py-5 mt-2 border-2 border-dashed border-slate-300 rounded-xl font-black text-slate-400 hover:text-blue-500 bg-white/50 transition-all">+ 增加執行流程單元</button>
    </div>
    
    <div id="mobileView" class="hidden space-y-4"></div>

    <div class="section-box shadow-lg">
        <div class="section-title">器材派工控管 / EQUIPMENT ALLOCATION</div>
        <table class="w-full">
            <tr>
                <td class="equip-label">服務台</td>
                <td class="p-4">
                    <div id="list-service" class="flex flex-wrap gap-3"></div>
                    <button onclick="addItem('service')" class="admin-ctrl text-blue-600 text-[11px] mt-3 font-black border-b border-blue-100">+ 增加服務台器材</button>
                </td>
            </tr>
            <tr>
                <td class="equip-label">舞 台</td>
                <td class="p-4">
                    <div id="list-stage" class="flex flex-wrap gap-3"></div>
                    <button onclick="addItem('stage')" class="admin-ctrl text-orange-600 text-[11px] mt-3 font-black border-b border-orange-100">+ 增加舞台器材</button>
                </td>
            </tr>
        </table>
    </div>

    <div class="section-box shadow-lg">
        <div class="section-title">
            <span>備註及拍照驗收 / NOTES & VALIDATION</span>
            <button onclick="document.getElementById('imgInput').click()" class="admin-ctrl bg-white text-black px-3 py-1 rounded text-[10px] font-black">📷 拍照上傳</button>
            <input type="file" id="imgInput" class="hidden" accept="image/*" multiple onchange="handleImgs(event)">
        </div>
        <div class="p-5">
            <textarea id="eventNotes" class="w-full min-h-[120px] text-base outline-none bg-transparent resize-none leading-relaxed mb-4 border-b border-slate-100" placeholder="在此輸入執行心得或驗收說明..." onblur="saveData()"></textarea>
            <div id="imgGallery" class="img-grid"></div>
        </div>
    </div>
</main>

<script>
    const JOBS = ["控場","音響","服務台","儀式","攝影","機動","視訊","料理"];
    const NAMES = ["江哥","瑩驊","維憶","芳瑜","智明","鐵仁","柏緯","崧瑋"];
    let selectedJob = "";
    
    let localData = {
        eventDate: "2026-03-28", eventName: "2026 四月八社區節", staff: [],
        rundown: [{s:"09:00", l:30, u:"進場準備", d:"物資就位與測試", persons:[]}],
        equip: { service: [{n:"簽到表", q:1}], stage: [{n:"音響系統", q:1}] },
        images: [], notes: ""
    };

    function calculateEndTime(startTime, duration) {
        if(!startTime || !duration) return "00:00 - 00:00 (0)";
        let [h, m] = startTime.split(':').map(Number);
        let endTotal = h * 60 + m + Number(duration);
        let endH = Math.floor(endTotal / 60).toString().padStart(2, '0');
        let endM = (endTotal % 60).toString().padStart(2, '0');
        return `${startTime} - ${endH}:${endM} (${duration})`;
    }

    function toggleAdmin(c) { document.body.classList.toggle('admin-mode', c); renderAll(); }
    function toggleMobileView(c) { 
        document.getElementById('desktopView').classList.toggle('hidden', c);
        document.getElementById('mobileView').classList.toggle('hidden', !c);
        renderAll();
    }
    function togglePanel(id) { document.getElementById(id).classList.toggle('hidden'); }

    function handleImgs(e) {
        const files = e.target.files;
        for (let f of files) {
            const reader = new FileReader();
            reader.onload = (event) => { localData.images.push(event.target.result); saveData(); renderAll(); };
            reader.readAsDataURL(f);
        }
    }

    function renderAll() {
        const isAdmin = document.body.classList.contains('admin-mode');
        document.getElementById('eventDate').value = localData.eventDate;
        document.getElementById('eventName').value = localData.eventName;
        document.getElementById('eventNotes').value = localData.notes || "";

        // 看板
        document.getElementById('staffBoardCards').innerHTML = localData.staff.map(s => `
            <div class="bg-white/10 border border-white/20 rounded-lg px-4 py-1.5 text-center min-w-[95px]">
                <div class="text-[9px] text-white/50 font-bold uppercase">${s.j}</div>
                <div class="font-black text-white text-sm">${s.n}</div>
            </div>`).join('');
        
        // 桌面流程 (修正格式)
        document.getElementById('rundownBody').innerHTML = localData.rundown.map((row, i) => `
            <tr>
                <td class="text-center font-black">
                    <div class="text-[12px] text-blue-600 mb-1 font-black">${calculateEndTime(row.s, row.l)}</div>
                    <div class="flex gap-1 admin-ctrl">
                        <input type="time" class="w-1/2 text-[10px] border p-0.5" value="${row.s}" onchange="updateRow(${i},'s',this.value)">
                        <input type="number" class="w-1/2 text-[10px] border p-0.5" value="${row.l}" onchange="updateRow(${i},'l',this.value)">
                    </div>
                </td>
                <td><input class="w-full font-black outline-none bg-transparent" value="${row.u}" onblur="updateRow(${i},'u',this.value)"></td>
                <td><input class="w-full text-slate-500 text-sm outline-none bg-transparent" value="${row.d||''}" onblur="updateRow(${i},'d',this.value)"></td>
                <td class="text-right text-[11px] font-black text-blue-700">${row.persons.join(', ')}</td>
                <td class="admin-ctrl text-center"><button class="text-red-300" onclick="localData.rundown.splice(${i},1);saveData();renderAll()">✕</button></td>
            </tr>`).join('');
        
        // 手機卡片 (修正格式)
        document.getElementById('mobileView').innerHTML = localData.rundown.map((row, i) => `
            <div class="bg-white p-5 rounded-2xl border-l-8 border-blue-600 shadow-md">
                <div class="flex justify-between items-start mb-2">
                    <div class="text-[11px] font-black text-blue-600 bg-blue-50 px-2 py-0.5 rounded">${calculateEndTime(row.s, row.l)}</div>
                    <div class="text-[10px] font-black text-slate-400">${row.persons.join(',')}</div>
                </div>
                <div class="admin-ctrl flex gap-2 mb-3">
                    <input type="time" class="text-[11px] border rounded p-1" value="${row.s}" onchange="updateRow(${i},'s',this.value)">
                    <input type="number" class="w-16 text-[11px] border rounded p-1" value="${row.l}" onchange="updateRow(${i},'l',this.value)">
                </div>
                <input class="w-full font-black text-base mb-1 bg-transparent" value="${row.u}" onblur="updateRow(${i},'u',this.value)">
                <textarea class="w-full text-xs text-slate-500 bg-transparent resize-none leading-snug" onblur="updateRow(${i},'d',this.value)">${row.d||''}</textarea>
            </div>`).join('');

        // 器材 (名稱 + 數量)
        ['service', 'stage'].forEach(type => {
            document.getElementById(`list-${type}`).innerHTML = (localData.equip[type]||[]).map((item, idx) => `
                <div class="equip-tag">
                    <input class="bg-transparent outline-none font-bold text-slate-700" value="${item.n}" onblur="localData.equip['${type}'][${idx}].n=this.value;saveData()" size="${item.n.length*1.5 + 2}">
                    <span class="text-slate-300">|</span>
                    <input type="number" class="qty-input" value="${item.q}" onchange="localData.equip['${type}'][${idx}].q=this.value;saveData()">
                    ${isAdmin?`<span class="text-red-300 ml-1 cursor-pointer" onclick="localData.equip['${type}'].splice(${idx},1);renderAll();saveData()">✕</span>`:''}
                </div>`).join('');
        });

        document.getElementById('imgGallery').innerHTML = localData.images.map((img, i) => `<div class="img-box"><img src="${img}">${isAdmin?`<div class="img-del" onclick="localData.images.splice(${i},1);renderAll();saveData()">✕</div>`:''}</div>`).join('');
        
        document.getElementById('jobOptions').innerHTML = JOBS.map(j => `<button class="px-3 py-1.5 border text-[11px] font-bold rounded-lg ${selectedJob===j?'bg-blue-600 text-white shadow-md':'bg-white text-slate-600'}" onclick="selectedJob='${j}';renderAll()">${j}</button>`).join('');
        document.getElementById('nameOptions').innerHTML = NAMES.map(n => `<button class="px-3 py-1.5 border text-[11px] font-bold rounded-lg bg-white text-slate-600" onclick="addStaff('${n}')">${n}</button>`).join('');
        document.getElementById('staffList').innerHTML = localData.staff.map((s,i) => `<div class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-[11px] font-black">${s.n}(${s.j}) ${isAdmin?`<span class="cursor-pointer ml-1" onclick="localData.staff.splice(${i},1);saveData();renderAll()">✕</span>`:''}</div>`).join('');
    }

    function addStaff(n) { if(!selectedJob) return alert("請先選取職稱按鈕"); localData.staff.push({n, j:selectedJob}); saveData(); renderAll(); }
    function updateRow(i, f, v) { localData.rundown[i][f] = v; saveData(); renderAll(); }
    function addRow() { localData.rundown.push({s:"09:00", l:10, u:"新流程單元", d:"", persons:[]}); renderAll(); }
    function addItem(type) { localData.equip[type].push({n:"器材名稱", q:1}); renderAll(); }
    
    function saveData() {
        localData.eventDate = document.getElementById('eventDate').value;
        localData.eventName = document.getElementById('eventName').value;
        localData.notes = document.getElementById('eventNotes').value;
        localStorage.setItem('v48_5_final_prod', JSON.stringify(localData));
    }

    window.onload = () => {
        const saved = localStorage.getItem('v48_5_final_prod');
        if (saved) localData = JSON.parse(saved);
        renderAll();
    };
</script>
</body>
</html>
