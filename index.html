<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>執行製作旗艦控管台 v53</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root { --blue: #0078D4; }
body { font-family: 'Noto Sans TC', sans-serif; background: #f1f5f9; padding-bottom: 80px; }
#passwordGate { display: flex; position: fixed; inset: 0; z-index: 9999; background: linear-gradient(135deg, #0078D4 0%, #1e3a5f 100%); align-items: center; justify-content: center; }
#passwordGate.hidden { display: none; }
.password-container { background: white; border-radius: 24px; padding: 48px 40px; max-width: 420px; width: 90%; text-align: center; box-shadow: 0 40px 80px rgba(0,0,0,0.25); }
.password-input { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 12px; font-weight: 900; text-align: center; letter-spacing: 4px; outline: none; margin-bottom: 20px; }
.app-header { background: var(--blue); color: #fff; padding: 10px 16px; position: sticky; top: 0; z-index: 1000; }
.hidden { display: none !important; }
</style>
</head>

<body class="admin-mode">

<div id="passwordGate">
  <div class="password-container">
    <span class="text-5xl mb-4 block">🛡️</span>
    <h2 class="text-2xl font-black mb-2">執行製作控管台</h2>
    <p class="text-slate-500 mb-6 text-sm">請輸入系統密碼以同步雲端資料</p>
    <input type="password" id="passwordInput" class="password-input" placeholder="預設 12345" onkeydown="if(event.key==='Enter')verifyAndSync()">
    <button onclick="verifyAndSync()" id="loginBtn" class="w-full bg-blue-600 text-white font-black py-4 rounded-xl hover:bg-blue-700 shadow-lg transition">驗證並啟動</button>
    <p id="errorMsg" class="hidden text-red-500 mt-4 font-bold">❌ 密碼錯誤或網路問題</p>
  </div>
</div>

<div id="mainApp" class="hidden">
  <header class="app-header shadow-2xl no-print">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div>
        <input type="text" id="eventName" class="bg-transparent border-none text-xl font-black text-white outline-none" placeholder="輸入專案名稱..." onblur="saveData()">
      </div>
      <button onclick="location.reload()" class="text-xs bg-white/20 px-3 py-1 rounded">登出</button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4">
    <div class="bg-white p-10 rounded-2xl border-2 border-dashed border-slate-200 text-center text-slate-400">
      <p>雲端同步系統已就緒，請開始編輯你的流程。</p>
    </div>
  </main>
</div>

<script>
const DB_URL = "https://script.google.com/macros/s/AKfycbzODk4NGMizDqOi313ttnj_gz-u01yxZEMnUJ0wySHcz0p3Ir1s6WDXhMlWIadlechyDA/exec";
let AUTH_PWD = "";

async function verifyAndSync() {
    const pwd = document.getElementById('passwordInput').value;
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('errorMsg');

    btn.innerText = "驗證中...";
    btn.disabled = true;
    err.classList.add('hidden');

    try {
        const response = await fetch(DB_URL, {
            method: "POST",
            body: JSON.stringify({ action: "load", password: pwd })
        });
        const result = await response.json();

        if (result.success) {
            AUTH_PWD = pwd; 
            document.getElementById('passwordGate').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            if (result.data) {
                document.getElementById('eventName').value = result.data.eventName || "";
            }
        } else {
            throw new Error("Wrong Password");
        }
    } catch (e) {
        btn.innerText = "驗證並啟動";
        btn.disabled = false;
        err.classList.remove('hidden');
    }
}

async function saveData() {
    if (!AUTH_PWD) return;
    const data = { eventName: document.getElementById('eventName').value };
    fetch(DB_URL, {
        method: "POST",
        body: JSON.stringify({ action: "save", password: AUTH_PWD, payload: data })
    });
}
</script>
</body>
</html>
