<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026頭份四月八-全功能控台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background: #f8fafc; transition: 0.3s; }
        .admin-mode { background: #fffbeb; }
        .rundown-table { width: 100%; border-collapse: collapse; background: white; table-layout: fixed; }
        .rundown-table th, .rundown-table td { border: 1px solid #cbd5e1; padding: 10px 8px; vertical-align: middle; }
        .cell-input { font-weight: bold; width: 100%; outline: none; background: transparent; border: none; font-size: 15px; }
        .admin-mode .cell-input { background: #fff; border-bottom: 1px solid #e2e8f0; }
        .is-now { background: #f0fdf4 !important; border-left: 8px solid #22c55e !important; }
        .admin-only { display: none !important; }
        .admin-mode .admin-only { display: block !important; }
        .tag { display: inline-block; background: #e2e8f0; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin: 2px; font-weight: bold; }
        .eq-tag { cursor: pointer; border: 1.5px solid #cbd5e1; padding: 4px 10px; border-radius: 8px; margin: 4px; font-weight: bold; font-size: 13px; }
        .eq-tag.loaded { background-color: #22c55e; color: white; border-color: #166534; }
    </style>
</head>
<body class="p-2 md:p-6 pb-20">

    <div class="max-w-[1400px] mx-auto">
        <div class="flex justify-between items-center mb-6 border-b-2 pb-4">
            <div>
                <h1 class="text-2xl font-black italic">2026頭份四月八 靚燈好客節 發布會</h1>
                <p class="text-sm font-bold text-rose-600">3/27(五) 10:00 | 頭份市公所藝術館旁</p>
            </div>
            <div class="flex gap-2">
                <button onclick="handleAdminSwitch()" id="modeBtn" class="bg-amber-500 text-white px-4 py-2 rounded-lg font-bold shadow-md">🛠️ 編輯模式</button>
                <button onclick="saveToCloud()" class="admin-only bg-blue-600 text-white px-4 py-2 rounded-lg font-bold shadow-md">💾 儲存發布</button>
            </div>
        </div>

        <div class="admin-only bg-white rounded-xl mb-6 border-2 border-amber-300 p-4 shadow-xl">
            <h3 class="text-xs font-black mb-2 text-amber-600">👥 人員安排 (職稱/姓名)</h3>
            <div class="grid grid-cols-2 md:grid-cols-5 gap-2" id="staffGrid"></div>
        </div>

        <table class="rundown-table shadow-lg mb-6">
            <thead class="bg-slate-800 text-white">
                <tr><th width="45">序</th><th width="140">時間</th><th width="80">長度</th><th width="200">單元名稱</th><th>執行內容說明</th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>

        <button onclick="addRow()" class="admin-only mb-10 bg-white border-2 border-dashed border-slate-300 p-3 rounded-xl font-bold w-full">+ 新增流程行數</button>

        <div class="bg-white p-6 rounded-2xl border shadow-sm grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <h2 class="font-black italic text-blue-600 mb-2 text-sm">📍 服務台區域</h2>
                <div id="serviceBox" class="flex flex-wrap mb-2"></div>
                <input type="text" class="admin-only w-full border p-2 rounded text-xs" placeholder="+ 輸入器材按 Enter" onkeydown="if(event.key==='Enter'){addEq('service', this.value); this.value=''}">
            </div>
            <div>
                <h2 class="font-black italic text-rose-600 mb-2 text-sm">📍 舞台工作區</h2>
                <div id="stageBox" class="flex flex-wrap mb-2"></div>
                <input type="text" class="admin-only w-full border p-2 rounded text-xs" placeholder="+ 輸入器材按 Enter" onkeydown="if(event.key==='Enter'){addEq('stage', this.value); this.value=''}">
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const app = initializeApp({ databaseURL: "https://rundown-worker-default-rtdb.firebaseio.com/" });
        const db = getDatabase(app);
        const dataRef = ref(db, 'rundown_toufen_v10_stable');

        let isAdmin = false;
        let localData = {
            staff: Array(10).fill({j:"", n:""}),
            rundown: [
                { t: "08:30", d: "30M", u: "公司出發/小車", s: "鐵仁-執行、柏緯-服務台、江哥-拍攝、料理-中瑜、餐盒-貝克里" },
                { t: "08:30-09:00", d: "30M", u: "場佈", s: "1.簽到處 2.攝影燈 3.料理區 4.貝克里送餐盒20份" },
                { t: "10:00", d: "-", u: "媒體、市長到場", s: "邀請簽到、發放新聞資料與市長說明動作內容" },
                { t: "10:00-10:10", d: "10M", u: "媒體訪問", s: "進行相關資訊訪問、上手版" },
                { t: "10:10-10:20", d: "10M", u: "市長炒米粉示範", s: "美人素食美粉料理示範及試吃，中瑜協助" },
                { t: "10:20-10:30", d: "10M", u: "活動資訊公布", s: "創意供桌、彩繪花燈、炒米粉大賽手板" },
                { t: "10:30", d: "-", u: "發布會結束", s: "發放餐盒、活動結束" }
            ],
            eq: { service: [], stage: [] }
        };

        // 初始化人員欄位
        const staffGrid = document.getElementById('staffGrid');
        for(let i=0; i<10; i++) {
            staffGrid.innerHTML += `<div class="p-1 border rounded bg-slate-50"><input type="text" placeholder="職稱" class="s-j w-full text-[10px] border-b mb-1 outline-none bg-transparent"><input type="text" placeholder="姓名" class="s-n w-full text-[10px] outline-none bg-transparent"></div>`;
        }

        window.render = () => {
            // 流程表格
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = localData.rundown.map((item, i) => `
                <tr class="r-row">
                    <td class="text-center font-bold text-slate-300">${i+1}</td>
                    <td><input class="cell-input r-t" value="${item.t}" ${!isAdmin?'readonly':''}></td>
                    <td><input class="cell-input r-d" value="${item.d}" ${!isAdmin?'readonly':''}></td>
                    <td><input class="cell-input r-u" value="${item.u}" ${!isAdmin?'readonly':''}></td>
                    <td><input class="cell-input r-s" value="${item.s}" ${!isAdmin?'readonly':''}></td>
                </tr>
            `).join('');

            // 人員數據填入
            const sj = document.querySelectorAll('.s-j'), sn = document.querySelectorAll('.s-n');
            localData.staff.forEach((s, i) => { sj[i].value = s.j || ""; sn[i].value = s.n || ""; });

            // 器材渲染
            renderEqList();
        };

        window.renderEqList = () => {
            ['service', 'stage'].forEach(z => {
                document.getElementById(z+'Box').innerHTML = (localData.eq[z]||[]).map((e,idx)=>`
                    <div class="eq-tag ${e.l?'loaded':''}" onclick="toggleEq('${z}', ${idx})">${e.n} ${isAdmin?'<span class="ml-1 opacity-50">×</span>':''}</div>
                `).join('');
            });
        };

        window.syncAll = () => {
            // 同步人員
            const sj = document.querySelectorAll('.s-j'), sn = document.querySelectorAll('.s-n');
            localData.staff = Array.from(sj).map((j, i) => ({ j: j.value, n: sn[i].value }));
            // 同步流程
            const rows = document.querySelectorAll('.r-row');
            localData.rundown = Array.from(rows).map(row => ({
                t: row.querySelector('.r-t').value, d: row.querySelector('.r-d').value,
                u: row.querySelector('.r-u').value, s: row.querySelector('.r-s').value
            }));
        };

        window.handleAdminSwitch = () => {
            if(!isAdmin) {
                if(prompt("請輸入密碼") === "364401") {
                    isAdmin = true;
                    document.body.classList.add('admin-mode');
                    document.getElementById('modeBtn').innerText = "👁️ 結束編輯";
                    render();
                }
            } else {
                isAdmin = false;
                document.body.classList.remove('admin-mode');
                document.getElementById('modeBtn').innerText = "🛠️ 編輯模式";
                render();
            }
        };

        window.addRow = () => {
            syncAll();
            localData.rundown.push({ t: "", d: "10M", u: "新單元", s: "" });
            render();
        };

        window.addEq = (z, n) => { if(n) { localData.eq[z].push({n, l:false}); renderEqList(); } };
        window.toggleEq = (z, i) => { 
            if(isAdmin && event.target.tagName === 'SPAN') localData.eq[z].splice(i, 1);
            else localData.eq[z][i].l = !localData.eq[z][i].l;
            renderEqList(); 
        };

        window.saveToCloud = () => {
            syncAll();
            set(dataRef, localData).then(() => alert("✅ 全功能資料已同步發布！"));
        };

        onValue(dataRef, (snap) => {
            if(isAdmin) return; // 編輯中鎖定雲端同步
            const d = snap.val();
            if(d) { localData = d; render(); }
        });

        render();
    </script>
</body>
</html>
