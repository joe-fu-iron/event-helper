<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 活動流程表 (動態欄位優化版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background: #f1f5f9; font-size: 16px; }
        .rundown-table { width: 100%; border-collapse: collapse; background: white; table-layout: fixed; }
        .rundown-table th, .rundown-table td { border: 1.2px solid black; padding: 6px; vertical-align: middle; }
        .col-time { width: 100px; } .col-dur { width: 60px; } .col-unit { width: 200px; } .col-job { width: 220px; }  
        
        /* 負責人選單優化：預設隱藏，有值才顯示下一個 */
        .job-select-wrapper select { margin-bottom: 4px; display: none; }
        .job-select-wrapper select.visible { display: block; }

        @media screen and (max-width: 768px) {
            .rundown-table, .rundown-table thead, .rundown-table tbody, .rundown-table th, .rundown-table td, .rundown-table tr { display: block; width: 100% !important; }
            .rundown-table thead { display: none; } 
            .rundown-table tr { margin-bottom: 15px; border: 2px solid #ea580c; border-radius: 12px; overflow: hidden; }
            .rundown-table td { border: none; border-bottom: 1px solid #f1f5f9; position: relative; padding: 10px 10px 10px 35%; text-align: left; }
            .rundown-table td::before { content: attr(data-label); position: absolute; left: 12px; font-weight: 800; color: #ea580c; }
        }
        @media print {
            .no-print { display: none !important; }
            .job-select-wrapper select { display: none !important; }
            .print-job-text { display: block !important; border-bottom: 1px solid #eee; margin-bottom: 2px; font-size: 10pt; }
        }
    </style>
</head>
<body class="p-2 md:p-4">

    <div id="capture-area" class="max-w-[1580px] mx-auto">
        <div class="bg-white p-4 rounded-lg shadow mb-4 border-t-4 border-orange-600">
            <div class="flex justify-between items-center mb-4">
                <span class="font-black text-2xl text-orange-700">活動執行細部流程表</span>
                <div class="flex gap-2 no-print">
                    <button onclick="saveToFirebase()" class="bg-orange-600 text-white px-6 py-2 rounded font-bold shadow">💾 儲存</button>
                    <button onclick="window.print()" class="bg-slate-700 text-white px-5 py-2 rounded font-bold shadow">🖨️ 列印</button>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4 text-sm border-b pb-4">
                <div>主題：<input type="text" id="eventTitle" class="border-b w-full outline-none"></div>
                <div>日期：<input type="date" id="eventDate" class="border-b" onchange="updateDayOfWeek()"> <span id="dayOfWeek"></span></div>
                <div>地點：<input type="text" id="eventLocation" class="border-b w-full"></div>
                <div>主持人：<input type="text" id="headerHost" class="border-b w-full"></div>
            </div>

            <div class="p-2 bg-orange-50 rounded border border-orange-200">
                <div class="grid grid-cols-2 md:grid-cols-8 gap-2" id="staffList">
                    <script>
                        for(let i=1; i<=8; i++) {
                            document.write(`
                                <div class="bg-white p-2 rounded border text-xs">
                                    <select id="j${i}" class="w-full mb-1 border" onchange="updateAllSelects()">
                                        <option value="-">-</option>
                                        <option value="控場">控場</option><option value="音響">音響</option>
                                        <option value="服務台">服務台</option><option value="攝影">攝影</option>
                                        <option value="manual">(手動)</option>
                                    </select>
                                    <input type="text" id="cj${i}" placeholder="工項" class="w-full hidden mb-1 border-b" oninput="updateAllSelects()">
                                    <input type="text" id="s${i}" placeholder="姓名" class="w-full border-b" oninput="updateAllSelects()">
                                </div>
                            `);
                        }
                    </script>
                </div>
            </div>
        </div>

        <table id="rundownTable" class="rundown-table mb-4">
            <thead class="bg-gray-800 text-white text-sm">
                <tr><th class="col-time">時間</th><th class="col-dur">長度</th><th>單元項目</th><th>執行說明</th><th class="col-job">負責人</th></tr>
            </thead>
            <tbody id="rundownBody"></tbody>
        </table>
        
        <button onclick="addRow()" class="no-print bg-slate-800 text-white px-6 py-3 rounded font-bold">+ 新增流程</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://rundown-worker-default-rtdb.firebaseio.com/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dataRef = ref(db, 'rundown_v2026_dynamic_job');

        let isDirty = false;

        window.addRow = (isFirst = false, saved = null) => {
            const tbody = document.getElementById("rundownBody");
            const tr = document.createElement("tr");
            
            // 負責人區塊：動態增長邏輯
            let jobHTML = `<div class="job-select-wrapper">`;
            for(let i=0; i<6; i++) {
                const val = (saved && saved.jobs) ? saved.jobs[i] : "";
                jobHTML += `
                    <div class="job-item">
                        <select class="job-sel no-print w-full text-[12px] border rounded p-1 mb-1" 
                                data-temp-val="${val}" 
                                onchange="handleJobChange(this)">
                            <option value="">- 選取負責人 -</option>
                        </select>
                        <div class="print-job-text hidden font-bold text-blue-800">${val}</div>
                    </div>`;
            }
            jobHTML += `</div>`;

            tr.innerHTML = `
                <td data-label="時間" class="text-center">
                    ${isFirst ? `<input type="text" class="start-time start-time-input w-20 text-center border" value="${saved?.startTime||''}" oninput="calculateAllTimes()">` : 
                                `<span class="row-start-display font-bold text-orange-600">--:--</span>`}
                    <div class="row-end-display text-xs text-gray-400">--:--</div>
                </td>
                <td data-label="長度"><input type="number" class="duration w-full text-center border-b" value="${saved?.duration||10}" oninput="calculateAllTimes()"></td>
                <td data-label="單元" contenteditable="true" class="unit-cell font-bold px-2">${saved?.unit||''}</td>
                <td data-label="說明" contenteditable="true" class="desc-cell text-sm px-2 text-gray-600">${saved?.desc||''}</td>
                <td data-label="負責人" class="col-job">${jobHTML}</td>
            `;
            tbody.appendChild(tr);
            refreshJobSelects(tr);
            calculateAllTimes();
        };

        // 核心邏輯：控制下拉選單的顯示 (有選值才顯示下一個)
        window.handleJobChange = (el) => {
            el.setAttribute('data-temp-val', el.value);
            const row = el.closest('tr');
            refreshJobSelects(row);
            isDirty = true;
        };

        function refreshJobSelects(row) {
            const selects = row.querySelectorAll('.job-sel');
            const printTexts = row.querySelectorAll('.print-job-text');
            let lastSelectedIndex = -1;

            // 1. 先更新所有下拉選單的內容 (根據名單)
            const staffList = getStaffList();
            
            selects.forEach((sel, idx) => {
                const currentVal = sel.getAttribute('data-temp-val');
                let optHtml = `<option value="">- 選取負責人 -</option>`;
                staffList.forEach(s => optHtml += `<option value="${s}" ${s === currentVal ? 'selected' : ''}>${s}</option>`);
                sel.innerHTML = optHtml;
                if(currentVal) {
                    sel.value = currentVal;
                    lastSelectedIndex = idx;
                    printTexts[idx].innerText = currentVal;
                    printTexts[idx].classList.remove('hidden');
                } else {
                    printTexts[idx].classList.add('hidden');
                }
            });

            // 2. 控制可見性：始終顯示第一個，或者前一個有選值的下一個
            selects.forEach((sel, idx) => {
                if (idx === 0 || idx <= lastSelectedIndex + 1) {
                    if (idx < 6) sel.classList.add('visible');
                } else {
                    sel.classList.remove('visible');
                }
            });
        }

        function getStaffList() {
            const list = [];
            for(let i=1; i<=8; i++) {
                const j = document.getElementById(`j${i}`).value;
                const cj = document.getElementById(`cj${i}`).value;
                const s = document.getElementById(`s${i}`).value;
                if (j === "manual") {
                    if(cj) list.push(`${cj}(${s||''})`);
                } else if (j !== "-") {
                    list.push(`${j}(${s||''})`);
                }
            }
            return list;
        }

        window.updateAllSelects = () => {
            document.querySelectorAll("#rundownBody tr").forEach(row => refreshJobSelects(row));
            isDirty = true;
        };

        // Firebase 儲存與讀取 (略，邏輯同前，但確保 jobs 陣列完整儲存)
        window.saveToFirebase = () => {
            const data = {
                rundown: Array.from(document.querySelectorAll("#rundownBody tr")).map(row => ({
                    startTime: row.querySelector(".start-time")?.value || "",
                    duration: row.querySelector(".duration").value,
                    unit: row.querySelector(".unit-cell").innerText,
                    desc: row.querySelector(".desc-cell").innerText,
                    jobs: Array.from(row.querySelectorAll(".job-sel")).map(s => s.value)
                }))
                // ... 其他欄位略
            };
            set(dataRef, data).then(() => { isDirty = false; alert("儲存成功"); });
        };

        onValue(dataRef, (snapshot) => {
            const data = snapshot.val();
            if(data && data.rundown) {
                const tbody = document.getElementById("rundownBody");
                tbody.innerHTML = "";
                data.rundown.forEach((item, idx) => addRow(idx === 0, item));
            } else {
                addRow(true);
            }
        });

        window.calculateAllTimes = () => {
            const rows = document.querySelectorAll("#rundownBody tr");
            let currentTime = "";
            rows.forEach((row, i) => {
                const dur = parseInt(row.querySelector(".duration").value) || 0;
                let start = (i === 0) ? row.querySelector(".start-time").value : currentTime;
                if(start && start.includes(":")) {
                    let [h, m] = start.split(":").map(Number);
                    let endM = m + dur;
                    let endH = (h + Math.floor(endM/60)) % 24;
                    let endStr = `${String(endH).padStart(2,'0')}:${String(endM%60).padStart(2,'0')}`;
                    if(i !== 0) row.querySelector(".row-start-display").innerText = start;
                    row.querySelector(".row-end-display").innerText = "結束: " + endStr;
                    currentTime = endStr;
                }
            });
        };
    </script>
</body>
</html>
