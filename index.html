<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IRON 2026 CUE - REFIXED</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background: #000; color: #e2e8f0; }
        .rundown-table { width: 100%; border-collapse: collapse; background: #0f172a; table-layout: fixed; }
        .rundown-table th, .rundown-table td { border: 1px solid #1e293b; padding: 12px 8px; vertical-align: middle; }
        .time-range { font-family: 'Courier New', monospace; font-weight: bold; color: #f97316; font-size: 16px; text-align: center; }
        .unit-cell { font-size: 16px; font-weight: bold; color: #fbbf24; }
        .staff-card { background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 8px; }
        .staff-card.empty { display: none; } 
        #infoSection.open .staff-card.empty { display: block !important; opacity: 0.4; }
        .equipment-tag { display: inline-flex; align-items: center; background: #1e293b; border: 1px solid #475569; padding: 6px 14px; border-radius: 6px; margin: 4px; font-weight: bold; cursor: pointer; border-left: 4px solid transparent; }
        .equipment-tag.loaded { background-color: #064e3b !important; border-color: #10b981 !important; color: #d1fae5; border-left: 4px solid #10b981; }
        @media screen and (max-width: 768px) {
            .col-dur, .col-no, th:nth-child(1), th:nth-child(3) { display: none !important; }
            .rundown-table tr { margin-bottom: 15px; border-left: 6px solid #f97316; display: block; background: #0f172a; }
            .rundown-table td { display: block; width: 100% !important; padding-left: 30% !important; position: relative; border: none; border-bottom: 1px solid #1e293b; min-height: 45px; }
            .rundown-table td::before { content: attr(data-label); position: absolute; left: 12px; color: #64748b; font-size: 10px; font-weight: bold; }
            .unit-cell { font-size: 18px; padding-top: 15px !important; }
        }
        .collapsible { transition: max-height 0.4s ease; overflow: hidden; max-height: 0; }
        .collapsible.open { max-height: 1200px; }
    </style>
</head>
<body class="p-2 md:p-6 pb-20">

    <div class="max-w-[1400px] mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-black text-orange-500 tracking-tighter">IRON 2026 CUE</h1>
            <div class="flex items-center gap-3 no-print">
                <div id="syncStatus" class="text-[10px] font-bold px-3 py-1 rounded-full border border-slate-800 bg-slate-900">READY</div>
                <button onclick="saveToFirebase()" class="bg-orange-600 hover:bg-orange-500 text-white px-6 py-2 rounded-lg font-black shadow-lg">💾 存檔</button>
            </div>
        </div>

        <div class="no-print bg-slate-900 rounded-xl mb-6 border border-slate-800 overflow-hidden">
            <div onclick="toggleInfo()" class="p-4 cursor-pointer flex justify-between items-center bg-slate-800/50 hover:bg-slate-800">
                <span class="text-slate-400 font-bold text-sm">⚙️ CONFIG & STAFF (設定網址)</span>
                <span id="infoIcon">▼</span>
            </div>
            <div id="infoSection" class="collapsible">
                <div class="p-4 space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="text-[10px] text-orange-500 font-black uppercase">Firebase URL</label>
                            <input type="text" id="dbUrl" onchange="location.reload()" placeholder="貼上 Firebase 網址..." class="w-full bg-black border border-slate-700 p-2 rounded text-blue-400 text-sm outline-none">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>主題：<input type="text" id="eventTitle" class="w-full bg-transparent border-b border-slate-700 outline-none p-1 text-white"></div>
                            <div>日期：<input type="date" id="eventDate" class="w-full bg-transparent border-b border-slate-700 outline-none p-1 text-white"></div>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-3" id="staffConfig"></div>
                </div>
            </div>
        </div>

        <table class="rundown-table rounded-lg overflow-hidden mb-6">
            <thead class="bg-slate-900 text-slate-500 text-[10px] uppercase text-center">
                <tr><th style="width:50px">#</th><th style="width:165px">Time</th><th style="width:60px" class="col-dur">Min</th><th>Cue</th><th>Note</th><th style="width:220px">Staff</th></tr>
            </thead>
            <tbody id="rundownBody"></tbody>
        </table>

        <button onclick="addRow()" class="no-print bg-slate-800 text-slate-400 px-6 py-2 rounded font-bold mb-10">+ ADD CUE</button>

        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
            <h2 class="text-xl font-black text-orange-500 mb-4 italic">LOGISTICS 核對 (點擊變綠=已上車)</h2>
            <div class="no-print flex gap-2 mb-6 p-4 bg-black/50 rounded-xl border border-slate-800">
                <input type="text" id="manualEquipName" placeholder="新增器材..." class="bg-transparent border-b border-slate-700 flex-grow p-1 text-sm text-white">
                <select id="manualEquipTarget" class="bg-slate-800 text-xs rounded px-3 text-slate-300">
                    <option value="service">服務台</option><option value="stage">舞台區</option>
                </select>
                <button onclick="addManualEquip()" class="bg-orange-600 text-white px-5 py-1 rounded-lg font-black text-xs">新增</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                <div><h3 class="text-blue-500 text-[10px] font-black mb-4 uppercase">● Front Desk</h3><div id="serviceContainer" class="flex flex-wrap"></div></div>
                <div><h3 class="text-red-500 text-[10px] font-black mb-4 uppercase">● Stage Area</h3><div id="stageContainer" class="flex flex-wrap"></div></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const savedUrl = localStorage.getItem('iron_firebase_url');
        if(savedUrl) document.getElementById('dbUrl').value = savedUrl;

        let db, dataRef;

        // 生成人員設定
        const staffConfig = document.getElementById('staffConfig');
        for(let i=1; i<=8; i++) {
            staffConfig.innerHTML += `<div id="staffBox${i}" class="staff-card space-y-1">
                <select id="j${i}" class="w-full bg-black border border-slate-700 text-[10px] rounded" onchange="updateAllSelects()">
                    <option value="-">-</option><option value="控場">控場</option><option value="音響">音響</option><option value="服務台">服務台</option><option value="manual">自訂</option>
                </select>
                <input type="text" id="cj${i}" placeholder="職稱" class="w-full bg-slate-800 text-[10px] hidden" oninput="updateAllSelects()">
                <input type="text" id="s${i}" placeholder="姓名" class="w-full bg-transparent border-b border-slate-700 text-[10px]" oninput="updateAllSelects()">
            </div>`;
        }

        window.toggleInfo = () => {
            const sec = document.getElementById('infoSection');
            sec.classList.toggle('open');
            document.getElementById('infoIcon').innerText = sec.classList.contains('open') ? '▲' : '▼';
        };

        window.toggleEquipStatus = (el, type, index) => {
            el.classList.toggle('loaded');
            if(dataRef) {
                update(ref(db, `rundown_2026_live/${type}/${index}`), { l: el.classList.contains('loaded') });
            }
        };

        window.addEquipment = (containerId, template, savedQty = "", isLoaded = false, index = 0) => {
            const container = document.getElementById(containerId + 'Container');
            const name = template.split('*')[0], isManual = template.includes('{手動}');
            const tag = document.createElement('div');
            tag.className = `equipment-tag ${isLoaded ? 'loaded' : ''}`;
            tag.innerHTML = `<span onclick="toggleEquipStatus(this.parentElement, '${containerId}', ${index})">${name}</span>
                ${isManual ? `<input type="text" class="w-8 border-b border-slate-600 bg-transparent text-center ml-2 text-[10px] text-orange-400" value="${savedQty}">` : ''}
                <button class="ml-3 text-slate-700 no-print" onclick="this.parentElement.remove(); saveToFirebase()">✕</button>`;
            container.appendChild(tag);
        };

        window.addManualEquip = () => {
            const name = document.getElementById('manualEquipName').value;
            const target = document.getElementById('manualEquipTarget').value;
            if(!name) return;
            addEquipment(target, name + "*{手動}");
            document.getElementById('manualEquipName').value = "";
            saveToFirebase();
        };

        window.refreshRowJobs = (row) => {
            const list = [];
            for(let i=1; i<=8; i++) {
                const j = document.getElementById(`j${i}`).value, s = document.getElementById(`s${i}`).value, cj = document.getElementById(`cj${i}`).value;
                document.getElementById(`cj${i}`).style.display = (j === "manual") ? "block" : "none";
                if(j === "-" && !s) document.getElementById(`staffBox${i}`).classList.add('empty'); 
                else { document.getElementById(`staffBox${i}`).classList.remove('empty'); if(s) list.push(`${j === "manual" ? cj : j}: ${s}`); }
            }
            row.querySelectorAll('.job-sel').forEach((sel, i) => {
                const saved = sel.getAttribute('data-temp-val') || "";
                sel.innerHTML = `<option value="">-</option>` + list.map(n => `<option value="${n}" ${n===saved?'selected':''}>${n}</option>`).join('');
                const p = row.querySelectorAll('.print-text')[i];
                if(saved && list.includes(saved)) { sel.value = saved; p.innerText = saved; sel.style.display = "block"; }
                else { p.innerText = ""; sel.style.display = (i === 0 || row.querySelectorAll('.job-sel')[i-1]?.value) ? "block" : "none"; }
            });
        };

        window.updateAllSelects = () => document.querySelectorAll("#rundownBody tr").forEach(row => refreshRowJobs(row));

        window.addRow = (isFirst = false, saved = null) => {
            const tbody = document.getElementById("rundownBody");
            const tr = document.createElement("tr");
            let jobHTML = `<div class="space-y-1">`;
            for(let i=0; i<3; i++) {
                const v = saved?.jobs?.[i] || "";
                jobHTML += `<select class="job-sel no-print w-full bg-slate-800 text-[10px] rounded border-none" data-temp-val="${v}" onchange="this.setAttribute('data-temp-val', this.value); refreshRowJobs(this.closest('tr'))"></select><div class="print-text hidden font-bold text-orange-400 text-[10px]">${v}</div>`;
            }
            tr.innerHTML = `<td data-label="#" class="col-no text-center text-slate-700 text-[10px]"></td>
                <td data-label="Time" class="text-center"><div class="time-range">${isFirst ? `<input type="text" class="start-time bg-slate-800 border border-slate-700 rounded w-16 text-center text-white" value="${saved?.startTime||'09:00'}" oninput="calculateAllTimes()">` : '<span class="row-start">00:00</span>'}<span class="mx-1 text-slate-800">-</span><span class="row-end">00:00</span></div></td>
                <td data-label="Min" class="col-dur"><input type="number" class="duration w-full text-center bg-transparent border-b border-slate-800 text-white" value="${saved?.duration||10}" oninput="calculateAllTimes()"></td>
                <td data-label="Cue" contenteditable="true" class="unit-cell outline-none px-2">${saved?.unit||''}</td>
                <td data-label="Note" contenteditable="true" class="desc-cell text-[11px] text-slate-500 outline-none px-2">${saved?.desc||''}</td>
                <td data-label="Staff">${jobHTML}</div></td>`;
            tbody.appendChild(tr);
            refreshRowJobs(tr);
            calculateAllTimes();
        };

        window.calculateAllTimes = () => {
            let nextS = "";
            document.querySelectorAll("#rundownBody tr").forEach((row, i) => {
                row.querySelector(".col-no").innerText = i + 1;
                const dur = parseInt(row.querySelector(".duration").value) || 0;
                let start = (i === 0) ? row.querySelector(".start-time").value : nextS;
                if(start && start.includes(":")) {
                    let [h, m] = start.split(":").map(Number);
                    let em = m + dur, eh = (h + Math.floor(em/60)) % 24, es = `${String(eh).padStart(2,'0')}:${String(em%60).padStart(2,'0')}`;
                    if(i !== 0) row.querySelector(".row-start").innerText = start;
                    row.querySelector(".row-end").innerText = es;
                    nextS = es;
                }
            });
        };

        window.saveToFirebase = () => {
            if(!dataRef) return;
            const data = { title: document.getElementById('eventTitle').value, date: document.getElementById('eventDate').value, staff: {}, rundown: [], service: [], stage: [] };
            for(let i=1; i<=8; i++) data.staff[i] = {j: document.getElementById(`j${i}`).value, cj: document.getElementById(`cj${i}`).value, s: document.getElementById(`s${i}`).value};
            document.querySelectorAll("#rundownBody tr").forEach(row => {
                data.rundown.push({ startTime: row.querySelector(".start-time")?.value || "", duration: row.querySelector(".duration").value, unit: row.querySelector(".unit-cell").innerText, desc: row.querySelector(".desc-cell").innerText, jobs: Array.from(row.querySelectorAll('.job-sel')).map(s => s.getAttribute('data-temp-val') || "") });
            });
            const getEq = (id) => Array.from(document.querySelectorAll(`#${id}Container .equipment-tag`)).map(tag => ({ n: tag.querySelector('span').innerText, q: tag.querySelector('input')?.value || "", l: tag.classList.contains('loaded') }));
            data.service = getEq('service'); data.stage = getEq('stage');
            set(dataRef, data).then(() => { document.getElementById('syncStatus').innerText = "SAVE SUCCESS"; setTimeout(() => document.getElementById('syncStatus').innerText = "ONLINE", 2000); });
        };

        // 初始化連線
        const url = document.getElementById('dbUrl').value.trim();
        if(url) {
            localStorage.setItem('iron_firebase_url', url);
            const app = initializeApp({ databaseURL: url });
            db = getDatabase(app);
            dataRef = ref(db, 'rundown_2026_live');
            onValue(dataRef, (snap) => {
                const data = snap.val(); if(!data) { if(document.querySelectorAll("#rundownBody tr").length===0) addRow(true); return; }
                document.getElementById('eventTitle').value = data.title || "";
                document.getElementById('eventDate').value = data.date || "";
                for(let i=1; i<=8; i++) {
                    document.getElementById(`j${i}`).value = data.staff?.[i]?.j || "-";
                    document.getElementById(`cj${i}`).value = data.staff?.[i]?.cj || "";
                    document.getElementById(`s${i}`).value = data.staff?.[i]?.s || "";
                }
                document.getElementById("rundownBody").innerHTML = ""; (data.rundown || []).forEach((item, idx) => addRow(idx === 0, item));
                document.getElementById('serviceContainer').innerHTML = ""; (data.service || []).forEach((e, i) => addEquipment('service', e.n + (e.q?'*{手動}':''), e.q, e.l, i));
                document.getElementById('stageContainer').innerHTML = ""; (data.stage || []).forEach((e, i) => addEquipment('stage', e.n + (e.q?'*{手動}':''), e.q, e.l, i));
            });
            onValue(ref(db, ".info/connected"), (s) => {
                document.getElementById('syncStatus').innerText = s.val() ? "ONLINE" : "OFFLINE";
                document.getElementById('syncStatus').style.color = s.val() ? "#22c55e" : "#ef4444";
            });
        } else {
            addRow(true);
        }
    </script>
</body>
</html>
