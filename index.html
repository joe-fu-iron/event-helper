<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026頭份四月八-發布會控台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background: #f8fafc; color: #1e293b; }
        body.admin-mode { background: #fffbeb; } 
        .is-now { background: #f0fdf4 !important; border-left: 8px solid #22c55e !important; }
        .rundown-table { width: 100%; border-collapse: collapse; background: white; table-layout: fixed; }
        .rundown-table th, .rundown-table td { border: 1px solid #cbd5e1; padding: 12px 8px; vertical-align: middle; }
        .table-head { background: #334155; color: white; font-size: 14px; }
        .cell-content { font-weight: bold; font-size: 15px; outline: none; min-height: 1.5em; background: transparent; }
        .cell-content:focus { background: #fff !important; box-shadow: inset 0 0 0 2px #3b82f6; border-radius: 4px; }
        .time-range { font-family: monospace; font-weight: bold; color: #2563eb; font-size: 15px; }
        .job-tag { display: inline-block; background: #e2e8f0; color: #475569; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin: 2px; font-weight: bold; }
        .admin-only { display: none !important; }
        body.admin-mode .admin-only { display: block !important; }
    </style>
</head>
<body class="view-mode p-2 md:p-6 pb-20">

    <div class="max-w-[1400px] mx-auto">
        <div class="flex justify-between items-center mb-6 border-b-2 pb-4">
            <div>
                <h1 id="viewEventTitle" class="text-2xl font-black italic text-slate-800">2026頭份四月八 靚燈好客節 頭份迎頭香發布會</h1>
                <p class="text-sm font-bold text-rose-600">2026-03-27 (週五) 上午10點 / 頭份市公所藝術館旁</p>
            </div>
            <div class="flex gap-2 items-center no-print">
                <button onclick="handleModeSwitch()" id="modeBtn" class="bg-amber-500 text-white px-4 py-2 rounded-lg font-bold shadow-md">🛠️ 編輯模式</button>
                <button onclick="saveToFirebase()" class="admin-only bg-blue-600 text-white px-4 py-2 rounded-lg font-bold shadow-md">💾 儲存發布</button>
            </div>
        </div>

        <table class="rundown-table shadow-lg mb-6">
            <thead class="table-head">
                <tr><th style="width:45px">序</th><th style="width:145px">時間(分)</th><th style="width:200px">單元名稱</th><th>執行內容說明</th><th style="width:180px">備註人員</th></tr>
            </thead>
            <tbody id="rundownBody"></tbody>
        </table>

        <button onclick="addRow()" class="admin-only mb-10 bg-white border-2 border-dashed border-slate-300 p-3 rounded-xl font-bold w-full hover:bg-slate-50">+ 插入新流程 (不影響現有資料)</button>

        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
            <h2 class="font-black italic text-slate-700 mb-4">📋 現場器材狀態</h2>
            <div id="eqStatus" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="p-4 bg-blue-50 rounded-xl">📍 服務台：簽到處、攝影燈、上手板</div>
                <div class="p-4 bg-rose-50 rounded-xl">📍 料理區：美人素食米粉、餐盒20份</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const FIREBASE_URL = "https://rundown-worker-default-rtdb.firebaseio.com/";
        let db, dataRef, isAdmin = false, isEditing = false;

        // 直接預載您提供的資料
        let currentData = {
            title: "2026頭份四月八 靚燈好客節 頭份迎頭香發布會",
            date: "2026-03-27",
            rundown: [
                { startTime: "08:30", duration: 30, unit: "公司出發/小車", desc: "鐵仁-執行、柏緯-服務台、江哥-拍攝、料理-中瑜、餐盒-貝克里", jobs: [] },
                { startTime: "08:30", duration: 30, unit: "場佈", desc: "1.簽到處 2.攝影燈 3.料理區 4.貝克里送餐盒20份", jobs: [] },
                { startTime: "10:00", duration: 0, unit: "媒體、市長到場", desc: "邀請簽到、發放新聞資料與市長說明動作內容", jobs: [] },
                { startTime: "10:00", duration: 10, unit: "媒體訪問", desc: "進行相關資訊訪問、上手版", jobs: [] },
                { startTime: "10:10", duration: 10, unit: "市長炒米粉示範", desc: "美人素食美粉料理示範及試吃，中瑜協助", jobs: [] },
                { startTime: "10:20", duration: 10, unit: "活動資訊公布", desc: "創意供桌、彩繪花燈、炒米粉大賽手板", jobs: [] },
                { startTime: "10:30", duration: 0, unit: "發布會結束", desc: "發放餐盒、活動結束", jobs: [] }
            ]
        };

        window.renderTable = () => {
            if (isEditing) return;
            const tbody = document.getElementById("rundownBody");
            tbody.innerHTML = "";
            let nextS = "";
            const curMin = new Date().getHours() * 60 + new Date().getMinutes();

            currentData.rundown.forEach((item, i) => {
                const dur = parseInt(item.duration) || 0;
                let start = (i === 0 || item.startTime === "10:00") ? (item.startTime || "08:30") : nextS;
                let [h, m] = start.split(":").map(Number);
                let totalMin = h * 60 + m + dur;
                let eh = Math.floor(totalMin/60)%24, em = totalMin%60;
                let endStr = `${String(eh).padStart(2,'0')}:${String(em).padStart(2,'0')}`;
                if (dur > 0) nextS = endStr; else nextS = start;

                const isActive = (curMin >= (h*60+m) && curMin < (h*60+m + (dur||5)));

                const tr = document.createElement("tr");
                if(isActive) tr.className = "is-now";
                tr.innerHTML = `
                    <td class="text-center font-bold text-slate-300">${i+1}</td>
                    <td class="text-center">
                        <div class="time-range">${isAdmin ? `<input type="time" class="border-b w-full text-center" value="${start}" onchange="updateData(${i}, 'startTime', this.value)">` : start} ${dur>0 ? '- '+endStr : ''}</div>
                        ${isAdmin ? `<input type="number" class="w-12 text-center text-xs border rounded" value="${dur}" onfocus="isEditing=true" onblur="isEditing=false; updateData(${i}, 'duration', this.value)">` : `<span class="text-[10px] text-slate-400">${dur}m</span>`}
                    </td>
                    <td class="cell-content" contenteditable="${isAdmin}" onfocus="isEditing=true" onblur="isEditing=false; updateData(${i}, 'unit', this.innerText)">${item.unit}</td>
                    <td class="cell-content text-slate-500 font-normal" contenteditable="${isAdmin}" onfocus="isEditing=true" onblur="isEditing=false; updateData(${i}, 'desc', this.innerText)">${item.desc}</td>
                    <td class="text-xs text-slate-400 font-bold">${isAdmin ? `<button onclick="deleteRow(${i})" class="text-rose-500">🗑️ 刪除</button>` : '執行中'}</td>
                `;
                tbody.appendChild(tr);
            });
        };

        // 核心修正：手動同步所有欄位文字到 currentData
        window.syncAllFields = () => {
            const rows = document.querySelectorAll("#rundownBody tr");
            rows.forEach((row, i) => {
                if (!currentData.rundown[i]) return;
                const cells = row.querySelectorAll(".cell-content");
                currentData.rundown[i].unit = cells[0].innerText;
                currentData.rundown[i].desc = cells[1].innerText;
                const durInput = row.querySelector("input[type='number']");
                if (durInput) currentData.rundown[i].duration = durInput.value;
            });
        };

        window.updateData = (i, field, value) => {
            currentData.rundown[i][field] = value;
            renderTable();
        };

        window.addRow = () => {
            syncAllFields(); // 新增前先抓取目前畫面上所有打過的字
            currentData.rundown.push({ startTime: "", duration: 10, unit: "新項目", desc: "", jobs: [] });
            renderTable();
        };

        window.deleteRow = (i) => {
            syncAllFields();
            currentData.rundown.splice(i, 1);
            renderTable();
        };

        window.handleModeSwitch = () => {
            if (!isAdmin) { if (prompt("密碼：") === "364401") isAdmin = true; else return; } else isAdmin = false;
            document.body.classList.toggle("admin-mode", isAdmin);
            document.getElementById('modeBtn').innerText = isAdmin ? "👁️ 結束編輯" : "🛠️ 編輯模式";
            renderTable();
        };

        window.saveToFirebase = () => {
            syncAllFields();
            set(dataRef, currentData).then(() => alert("✅ 2026頭份四月八發布會資料已發布成功！"));
        };

        const app = initializeApp({ databaseURL: FIREBASE_URL });
        db = getDatabase(app); 
        dataRef = ref(db, 'rundown_toufen_48_v1'); 

        onValue(dataRef, (snap) => {
            if (isEditing) return;
            const d = snap.val();
            if(d) currentData = d;
            renderTable();
        });

        // 啟動渲染
        renderTable();
        setInterval(renderTable, 60000);
    </script>
</body>
</html>
