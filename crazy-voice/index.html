<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>CRAZY AI 語音指揮官</title>
  <style>
    :root{--bg:#061018;--panel:#0d2938;--line:#2d6d8b;--txt:#eefbff;--muted:#a6cddd;--accent:#4bdcff;--ok:#69eca2;--danger:#ff7b87}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#12384f,#061018 48%,#03080c);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;display:flex;align-items:center;justify-content:center;padding:22px}.wrap{width:min(720px,100%)}.card{background:linear-gradient(180deg,#102d3e,#091923);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 20px 60px #0007}h1{margin:0 0 8px;font-size:28px}.muted{color:var(--muted);font-size:14px}.orb{width:150px;height:150px;border-radius:50%;margin:28px auto;background:radial-gradient(circle,#4bdcff 0 10%,#17485e 11% 38%,#0a1b24 39%);border:2px solid #4bdcff;box-shadow:0 0 38px #4bdcff55;display:flex;align-items:center;justify-content:center;font-size:46px;user-select:none}.orb.live{animation:pulse 1s infinite;box-shadow:0 0 55px #69eca288;border-color:var(--ok)}@keyframes pulse{50%{transform:scale(1.05)}}button,textarea{width:100%;border-radius:14px;font-size:18px}button{padding:15px;border:1px solid #4b91b0;background:#155e7e;color:white;font-weight:800;margin-top:10px}button.secondary{background:#12394e}button:disabled{opacity:.55}textarea{min-height:100px;background:#071720;color:white;border:1px solid #326c86;padding:14px;resize:vertical;margin-top:14px}.status,.transcript{margin-top:15px;padding:12px;border-left:4px solid var(--accent);background:#071820;border-radius:8px;white-space:pre-wrap}.transcript{max-height:220px;overflow:auto;border-left-color:var(--ok)}.small{font-size:12px;margin-top:10px;color:var(--muted)}
  </style>
</head>
<body>
<div class="wrap"><div class="card">
  <h1>CRAZY AI 語音指揮官</h1>
  <div class="muted">使用裝置內建語音辨識，說完後可檢查文字，再送回 CRAZY 執行。</div>
  <div id="orb" class="orb">✦</div>
  <button id="startBtn" onclick="startListening()">開始語音輸入</button>
  <button id="stopBtn" class="secondary" onclick="stopListening()" disabled>停止聆聽</button>
  <textarea id="text" placeholder="也可以輸入 CRAZY 指令，再按送回執行。"></textarea>
  <button onclick="sendManual()">送回 CRAZY 執行</button>
  <button class="secondary" onclick="goBack()">返回 CRAZY</button>
  <div id="status" class="status">語音輸入待命</div>
  <div id="transcript" class="transcript">辨識內容會顯示在這裡。</div>
  <div class="small">語音辨識與朗讀由目前裝置的瀏覽器提供，不會使用 OpenAI API 或 Cloud Run。</div>
</div></div>
<script>
const qs=new URLSearchParams(location.search);
const returnUrl=qs.get('return')||'';
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
let recognition=null,listening=false,finalText='';
const $=id=>document.getElementById(id);
function setStatus(t){$('status').textContent=t}
function speak(text){if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang='zh-TW';utterance.rate=1;window.speechSynthesis.speak(utterance)}
function renderTranscript(interim=''){const text=[finalText,interim].filter(Boolean).join('');$('transcript').textContent=text||'辨識內容會顯示在這裡。';$('text').value=text}
function startListening(){
  if(!SpeechRecognition){setStatus('此瀏覽器不支援語音辨識，請改用 Chrome、Edge 或手動輸入。');speak('此瀏覽器不支援語音辨識，請改用手動輸入。');return}
  if(listening)return;
  finalText=$('text').value.trim();
  recognition=new SpeechRecognition();recognition.lang='zh-TW';recognition.continuous=true;recognition.interimResults=true;
  recognition.onstart=()=>{listening=true;$('orb').classList.add('live');$('startBtn').disabled=true;$('stopBtn').disabled=false;setStatus('正在聆聽，請說出 CRAZY 指令…')};
  recognition.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const phrase=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=(finalText?' ':'')+phrase.trim();else interim+=phrase}renderTranscript(interim)};
  recognition.onerror=e=>{const messages={not_allowed:'麥克風權限未開啟。',no_speech:'沒有聽到語音，請再試一次。',network:'語音辨識服務暫時無法連線。'};setStatus(messages[e.error]||('語音辨識錯誤：'+e.error))};
  recognition.onend=()=>{listening=false;$('orb').classList.remove('live');$('startBtn').disabled=false;$('stopBtn').disabled=true;if(finalText){setStatus('辨識完成，請確認文字後送回 CRAZY。');speak('辨識完成，請確認文字。')}else if(!$('status').textContent.includes('錯誤'))setStatus('語音輸入已停止。')};
  try{recognition.start()}catch(e){setStatus('無法啟動語音辨識：'+e.message)}
}
function stopListening(){if(recognition&&listening)recognition.stop()}
function sendManual(){const command=$('text').value.trim();if(!command){setStatus('還沒有指令內容。');return}sendBack(command)}
function sendBack(command){if(!returnUrl){setStatus('缺少 CRAZY 返回網址，請從 CRAZY 的語音按鈕進入此頁。');return}const url=new URL(returnUrl);url.searchParams.set('cmd',command);url.searchParams.set('source','device-voice');setStatus('正在送回 CRAZY 執行：'+command);speak('正在送回 CRAZY 執行');setTimeout(()=>{location.href=url.toString()},500)}
function goBack(){if(returnUrl)location.href=returnUrl;else history.back()}
</script>
</body>
</html>
